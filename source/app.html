<title>Lime</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap">
<style>
/* Calx, the Clockwork City. One reading column; tab bar on phones, rail on wide screens; lesson + workbench side by side on very wide screens. Each district recolours the accent. */
:root{
  --bg:#EDF3DF; --panel:#FBFDF4; --ink:#17230E; --muted:#51613F; --line:#17230E;
  --accent:#8BD122; --accent-ink:#17230E;
  --accent-soft:color-mix(in srgb, var(--accent) 24%, var(--panel));
  --ok:#17803B; --ok-soft:#CBEAD2; --bad:#B8341D; --bad-soft:#F5D2CA; --warn:#8A5F00; --warn-soft:#F6E5AE;
  --code-bg:#12200B; --code-ink:#E4F4C6; --shadow:#17230E; --dim:#3A4630;
  --pix:'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
  --body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1206; --panel:#142010; --ink:#E6F2D0; --muted:#9CB286; --line:#5E8038;
    --ok:#5BD58C; --ok-soft:#173A25; --bad:#FF907A; --bad-soft:#48211A; --warn:#F2C14E; --warn-soft:#3E3210;
    --code-bg:#091004; --code-ink:#E4F4C6; --shadow:#000; --dim:#26321C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1206; --panel:#142010; --ink:#E6F2D0; --muted:#9CB286; --line:#5E8038;
  --ok:#5BD58C; --ok-soft:#173A25; --bad:#FF907A; --bad-soft:#48211A; --warn:#F2C14E; --warn-soft:#3E3210;
  --code-bg:#091004; --code-ink:#E4F4C6; --shadow:#000; --dim:#26321C; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);padding:.05em .3em;border:1px solid color-mix(in srgb,var(--line) 35%,transparent)}
.app{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--pix);font-size:18px;letter-spacing:.5px;text-decoration:none}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--pix);font-size:9px;line-height:1.6;padding:6px 8px;border:2px solid var(--line);background:var(--panel);box-shadow:2px 2px 0 var(--shadow);white-space:nowrap;text-decoration:none}
.chip.hot{background:var(--accent);color:var(--accent-ink)}
main{min-width:0;padding:6px 0 24px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--panel);border-top:2px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px;text-decoration:none;font-family:var(--pix);font-size:8px;color:var(--muted);position:relative;border:2px solid transparent;min-width:0}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--accent-ink);background:var(--accent);border-color:var(--line)}
.nav .badge{position:absolute;top:2px;right:calc(50% - 26px);background:var(--bad);color:#fff;font-size:8px;padding:2px 4px;border:2px solid var(--line)}
@media (min-width:900px){
  body{padding-bottom:40px}
  .app{grid-template-columns:200px minmax(0,1fr);column-gap:28px}
  .top{grid-column:1 / -1}
  .nav{position:sticky;top:12px;bottom:auto;align-self:start;flex-direction:column;border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow);padding:8px;gap:4px;grid-row:2}
  .nav a{flex-direction:row;gap:10px;font-size:10px;padding:10px 8px}
  .nav .badge{position:static;margin-left:auto}
  main{grid-row:2;grid-column:2;max-width:760px}
}
@media (min-width:1280px){
  .app.split{max-width:1500px}
  .app.split main{max-width:none}
  .lgrid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:28px;align-items:start}
  .aside{display:block!important;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
  .tobench{display:inline-flex!important}
}
.aside{display:none}
.tobench{display:none!important}
.card{background:var(--panel);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:16px;margin:0 0 18px}
.card.tight{padding:12px 14px}
.h-pix{font-family:var(--pix);font-size:12px;line-height:1.8;margin:0 0 10px}
.sub{color:var(--muted);font-size:15px}
h1.title{font-family:var(--pix);font-size:16px;line-height:1.7;margin:4px 0 8px}
h2.sec{font-family:var(--pix);font-size:12px;line-height:1.7;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;border-top:2px dashed var(--line);opacity:.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:var(--pix);font-size:10px;line-height:1.4;padding:12px 14px;min-height:44px;
  background:var(--accent);color:var(--accent-ink);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow);text-decoration:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn:hover{filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.warn{background:var(--warn-soft);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--ink)}
.btn.small{font-size:9px;padding:8px 10px;min-height:38px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:14px;border:2px solid var(--line);background:var(--panel);position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);display:block}
.mission{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:2px dashed color-mix(in srgb,var(--line) 40%,transparent)}
.mission:first-of-type{border-top:0}
.mission .t{flex:1;min-width:0}
.mission .t b{display:block}
.tick{width:22px;height:22px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-family:var(--pix);font-size:9px;background:var(--panel)}
.tick.on{background:var(--ok-soft);color:var(--ok)}
.tick.part{background:var(--warn-soft)}
.tick.lock{background:var(--dim);color:var(--muted)}
.tag{font-family:var(--pix);font-size:8px;padding:4px 6px;border:2px solid var(--line);background:var(--panel);white-space:nowrap}
.tag.live{background:var(--accent);color:var(--accent-ink)}
.tag.fact{background:var(--warn-soft)}
.crumb{font-family:var(--pix);font-size:9px;text-decoration:none;color:var(--muted);display:inline-block;margin:6px 0 4px}
.prose{max-width:68ch}
.prose h3{font-family:var(--pix);font-size:11px;line-height:1.8;margin:30px 0 10px}
.prose p,.rich p{margin:0 0 14px}
.rich p:last-child{margin-bottom:0}
.prose ul,.rich ul{margin:0 0 14px;padding-left:22px}
.prose li,.rich li{margin:0 0 6px}
pre.src{margin:10px 0;padding:12px 14px;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:14px;overflow:auto;line-height:1.55;border:2px solid var(--line)}
.note{margin:16px 0;padding:12px 14px 12px 16px;border:2px solid var(--line);background:var(--panel)}
.note .nl{font-family:var(--pix);font-size:8px;display:block;margin-bottom:6px;letter-spacing:.3px}
.note.model{background:var(--accent-soft)}
.note.trap{background:var(--bad-soft)}
.note.tip{background:var(--warn-soft)}
.note p{margin:0 0 8px}.note p:last-child{margin:0}
.nit{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);background:var(--accent-soft);margin:10px 0;font-size:15.5px}
.nit svg{flex:none;margin-top:2px}
.nit b{font-family:var(--pix);font-size:8px;display:block;margin-bottom:3px}
.cell,.ex{margin:16px 0;border:2px solid var(--line);background:var(--code-bg);box-shadow:3px 3px 0 var(--shadow)}
.ed{position:relative}
.ta{display:block;width:100%;min-height:56px;resize:none;border:0;outline:0;background:transparent;color:var(--code-ink);font-family:var(--mono);font-size:14.5px;line-height:1.55;padding:12px 14px;white-space:pre;overflow:auto;tab-size:4}
.ta:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.keys{display:none;gap:4px;padding:6px;border-top:1px solid #2c4118;overflow-x:auto;background:#0e1a08}
@media (pointer:coarse){.ed:focus-within .keys{display:flex}}
.keys button{flex:none;min-width:42px;min-height:42px;background:#223616;color:#E4F4C6;border:1px solid #3f5a28;font-family:var(--mono);font-size:16px;cursor:pointer}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--panel);border-top:2px solid var(--line)}
.bar2 .sp{flex:1}
.out{margin:0;padding:10px 14px;background:#0a1405;color:#C9E5A0;font-family:var(--mono);font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;border-top:2px solid var(--line);max-height:320px;overflow:auto}
.out .err{color:#FF9B85;display:block}
.out .dim{color:#7f9a66}
.explain{padding:10px 14px;background:var(--bad-soft);border-top:2px solid var(--line);font-size:15px}
.explain b{font-family:var(--pix);font-size:8px;display:block;margin-bottom:4px}
.ex .hd{display:flex;gap:10px;align-items:center;background:var(--panel);padding:12px 14px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.ex .hd b{font-family:var(--pix);font-size:10px;line-height:1.7;flex:1;min-width:0}
.ex .pr{background:var(--panel);padding:12px 14px;border-bottom:2px solid var(--line)}
.ex .pr p{margin:0 0 8px}.ex .pr p:last-child{margin:0}
.res{list-style:none;margin:0;padding:10px 14px;background:var(--panel);border-top:2px solid var(--line)}
.res li{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.res li>.nit{flex:1;margin:4px 0}
.res .m{font-family:var(--pix);font-size:9px;width:20px;flex:none;margin-top:4px}
.res .ok .m{color:var(--ok)}.res .no .m{color:var(--bad)}
.res .why{display:block;font-size:14.5px;color:var(--muted)}
.box{padding:10px 14px;background:var(--warn-soft);border-top:2px solid var(--line);font-size:15.5px}
.box.sol{background:var(--panel)}
.box pre{margin:8px 0 0;padding:10px;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:13.5px;overflow:auto;border:2px solid var(--line)}
.win{background:var(--ok-soft);padding:10px 14px;border-top:2px solid var(--line);font-size:15px}
.win b{font-family:var(--pix);font-size:9px;display:block;margin-bottom:4px}
.pred{margin:16px 0;border:2px solid var(--line);background:var(--panel);box-shadow:3px 3px 0 var(--shadow)}
.pred .hd{padding:10px 14px;border-bottom:2px solid var(--line);font-family:var(--pix);font-size:9px;line-height:1.7}
.pred pre.src{margin:0;border:0;border-bottom:2px solid var(--line)}
.pred .in{padding:10px 14px}
.pred textarea,.teach textarea{width:100%;min-height:72px;font-family:var(--mono);font-size:14px;background:var(--bg);border:2px solid var(--line);padding:8px 10px;resize:vertical;white-space:pre}
.teach textarea{font-family:var(--body);white-space:normal;min-height:120px}
.pred .fb{padding:10px 14px;border-top:2px solid var(--line)}
.pred .fb.ok{background:var(--ok-soft)}.pred .fb.no{background:var(--bad-soft)}
.pred .fb pre{margin:6px 0;font-family:var(--mono);font-size:13.5px;white-space:pre-wrap}
.pz{margin:16px 0;border:2px solid var(--line);background:var(--panel);box-shadow:3px 3px 0 var(--shadow)}
.pz .hd{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:2px solid var(--line);font-family:var(--pix);font-size:9px;line-height:1.7}
.pz .hd span:first-child{flex:1}
.pz .zone{padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-height:60px}
.pz .zone.ans{background:var(--code-bg);border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.pz .zl{font-family:var(--pix);font-size:8px;color:var(--muted)}
.pz .zone.ans .zl{color:#9fbf7c}
.pz .ln{display:block;width:100%;text-align:left;font-family:var(--mono);font-size:14px;white-space:pre;padding:8px 10px;border:2px solid var(--line);background:var(--bg);cursor:pointer;min-height:40px;overflow-x:auto}
.pz .zone.ans .ln{background:#1d3311;color:var(--code-ink);border-color:#3f5a28}
.pz .ln .n{color:#7f9a66;margin-right:10px;user-select:none}
.teach{margin:16px 0;border:2px solid var(--line);background:var(--panel);box-shadow:3px 3px 0 var(--shadow);padding:14px}
.goals{margin:8px 0 0;padding-left:20px}
.pstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 4px}
.pstrip div{font-family:var(--pix);font-size:8px;line-height:1.8}
.pstrip .bar{margin-top:6px;height:12px}
.scene{border:2px solid var(--line);background:var(--panel);box-shadow:4px 4px 0 var(--shadow);margin:0 0 18px;display:block}
.scene .art,.art{background:var(--code-bg);border-bottom:2px solid var(--line);display:flex;justify-content:center;padding:10px}
.art svg{width:100%;max-width:440px;height:auto;image-rendering:pixelated}
.scene .body{padding:14px 16px}
.scene .foot{display:flex;gap:10px;padding:10px 16px;border-top:2px solid var(--line);align-items:center;flex-wrap:wrap}
.scene .foot .sp{flex:1}
.scene summary{cursor:pointer;padding:12px 16px;font-family:var(--pix);font-size:10px;line-height:1.7}
.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.map{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dtile{display:flex;flex-direction:column;gap:6px;text-decoration:none;border:2px solid var(--line);background:var(--panel);box-shadow:3px 3px 0 var(--shadow);padding:10px;position:relative;min-width:0}
.dtile svg{width:100%;height:auto;image-rendering:pixelated;border:2px solid var(--line)}
.dtile b{font-family:var(--pix);font-size:9px;line-height:1.6}
.dtile .num{position:absolute;top:14px;left:14px;font-family:var(--pix);font-size:8px;background:var(--panel);border:2px solid var(--line);padding:3px 5px}
.dtile.locked{opacity:.78}
.dtile .tag{align-self:flex-start}
.fcard{min-height:230px;background:var(--panel);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:20px;display:flex;flex-direction:column;justify-content:center;gap:14px;cursor:pointer;touch-action:pan-y;transition:transform .12s}
.fcard .side{font-family:var(--pix);font-size:8px;color:var(--muted)}
.fcard .q{font-size:20px;line-height:1.45}
.fcard .a{font-size:18px;line-height:1.5;border-top:2px dashed var(--line);padding-top:14px}
.fcard .a p{margin:0 0 8px}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate .btn{flex-direction:column;gap:5px;padding:10px 4px}
.rate .btn small{font-family:var(--body);font-size:12px;opacity:.85}
.rate .again{background:var(--bad-soft);color:var(--ink)}.rate .hard{background:var(--warn-soft);color:var(--ink)}.rate .easy{background:var(--ok-soft);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:2px solid var(--line);background:var(--panel);padding:10px}
.stat b{display:block;font-family:var(--pix);font-size:14px;line-height:1.5}
.stat span{font-size:13.5px;color:var(--muted)}
.term{padding:12px 0;border-top:2px dashed color-mix(in srgb,var(--line) 40%,transparent)}
.term:first-child{border-top:0}
.term b{font-family:var(--mono);font-size:15px}
.term .meta{font-size:13.5px;color:var(--muted)}
.term p{margin:4px 0}
.arch{border:2px solid var(--line);background:var(--panel);padding:12px 14px;margin:0 0 12px;box-shadow:3px 3px 0 var(--shadow)}
.arch .yr{font-family:var(--pix);font-size:10px}
.arch p{margin:0 0 8px}
.arch .src{font-size:13px;color:var(--muted);margin-top:6px}
.cab{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.cab .it{border:2px solid var(--line);background:var(--panel);padding:8px;text-align:center;font-size:13px}
.cab .it.off{border-style:dashed;opacity:.6}
.cab .it svg{width:48px;height:48px;image-rendering:pixelated;display:block;margin:0 auto 6px}
pre.json{margin:10px 0;padding:10px;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:12.5px;max-height:240px;overflow:auto;border:2px solid var(--line)}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.field label{min-width:170px}
.search,.namebox{background:var(--bg);border:2px solid var(--line);padding:8px 10px;min-height:44px;width:100%}
.field input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.field output{font-family:var(--pix);font-size:11px;min-width:40px}
.seg{display:inline-flex;border:2px solid var(--line);flex-wrap:wrap}
.seg button{font-family:var(--pix);font-size:9px;padding:10px 12px;background:var(--panel);border:0;border-right:2px solid var(--line);cursor:pointer;min-height:42px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
textarea.paste{width:100%;min-height:90px;font-family:var(--mono);font-size:12.5px;background:var(--bg);border:2px solid var(--line);padding:8px}
.empty{padding:26px 16px;text-align:center}
.timer{font-family:var(--pix);font-size:12px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
@media (min-width:900px){#toasts{bottom:24px}}
.toast{pointer-events:auto;background:var(--accent);color:var(--accent-ink);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow);padding:10px 12px;font-size:14.5px;line-height:1.45}
.toast b{font-family:var(--pix);font-size:8px;display:block;margin-bottom:3px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(8,14,4,.62);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--panel);border:2px solid var(--line);box-shadow:6px 6px 0 var(--shadow);max-width:440px;width:100%;padding:18px;max-height:90vh;overflow:auto}
.dlg h2{font-family:var(--pix);font-size:12px;line-height:1.7;margin-bottom:10px}
.dlg .row{justify-content:flex-end;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <a class="brand" href="#home" aria-label="Lime home"><span id="logo"></span><span>LIME</span></a>
    <div class="chips" id="chips"></div>
  </header>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <main id="view"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden></div>

/* ================= Python engine (Brython) ================= */
function loadScript(src, ms){
  return new Promise(function(resolve, reject){
    var s = document.createElement('script'), done = false;
    var timer = setTimeout(function(){ if (!done){ done = true; reject(new Error('Timed out loading ' + src)); } }, ms || 60000);
    s.src = src; s.async = true;
    s.onload = function(){ if (!done){ done = true; clearTimeout(timer); resolve(); } };
    s.onerror = function(){ if (!done){ done = true; clearTimeout(timer); reject(new Error('Could not load ' + src)); } };
    document.head.appendChild(s);
  });
}
var Py = {

      await loadScript(BRYTHON_BASE + 'brython.min.js');
      await loadScript(BRYTHON_BASE + 'brython_stdlib.js');
      window.brython({indexedDB:false});
      window.__BRYTHON__.runPythonSource(RUNNER_SRC, {id:'runner'});
      for (var i = 0; i < 200 && !window.pyReady; i++) await sleep(50);
      if (!window.pyReady) throw new Error('The Python runner did not start.');

    var v = ta.value, s = ta.selectionStart, ls = v.lastIndexOf('\n', s - 1) + 1;

      if (!best || score > best.score) best = Object.assign({score:score}, it);
    });
  });

}
