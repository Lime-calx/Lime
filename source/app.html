<title>Lime</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap">
<style>
/* Calx, the Clockwork City. One reading column; tab bar on phones, rail on wide screens; lesson + workbench side by side on very wide screens. Each district recolours the accent. */
:root{
  /* paper is tinted lightly by the district accent (d10): Python keeps its look, a pink or yellow district gets matching paper */
  --bg:color-mix(in srgb, var(--accent) 9%, #F7F6F2); --panel:color-mix(in srgb, var(--accent) 3%, #FFFFFB); --ink:#17230E; --muted:#51613F; --line:#17230E;
  --accent:#8BD122; --accent-ink:#17230E;
  --accent-soft:color-mix(in srgb, var(--accent) 24%, var(--panel));
  --ok:#13702F; --ok-soft:#CBEAD2; --bad:#B8341D; --bad-soft:#F5D2CA; --bad-ink:#FFFFFF; --warn:#8A5F00; --warn-soft:#F6E5AE;
  --code-bg:#12200B; --code-ink:#E4F4C6; --shadow:#17230E; --dim:#3A4630; --sky:#101a0a;
  --pix:'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
  --body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:color-mix(in srgb, var(--accent) 6%, #030604); --panel:color-mix(in srgb, var(--accent) 8%, #0A110E); --ink:#E6F2D0; --muted:#9CB286; --line:color-mix(in srgb, var(--accent) 35%, #5A6256);
    --accent-soft:color-mix(in srgb, var(--accent) 18%, var(--panel));
    --ok:#5BD58C; --ok-soft:#173A25; --bad:#FF907A; --bad-soft:#48211A; --bad-ink:#1F0A05; --warn:#F2C14E; --warn-soft:#3E3210;
    --code-bg:#091004; --code-ink:#E4F4C6; --shadow:#000; --dim:#26321C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:color-mix(in srgb, var(--accent) 6%, #030604); --panel:color-mix(in srgb, var(--accent) 8%, #0A110E); --ink:#E6F2D0; --muted:#9CB286; --line:color-mix(in srgb, var(--accent) 35%, #5A6256);
  --accent-soft:color-mix(in srgb, var(--accent) 18%, var(--panel));
  --ok:#5BD58C; --ok-soft:#173A25; --bad:#FF907A; --bad-soft:#48211A; --bad-ink:#1F0A05; --warn:#F2C14E; --warn-soft:#3E3210;
  --code-bg:#091004; --code-ink:#E4F4C6; --shadow:#000; --dim:#26321C; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);padding:.05em .3em;border:1px solid color-mix(in srgb,var(--line) 35%,transparent)}
.app{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);--readw:880px}
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--pix);font-size:18px;letter-spacing:.5px;text-decoration:none}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--pix);font-size:9px;line-height:1.6;padding:6px 8px;border:2px solid var(--line);background:var(--panel);box-shadow:2px 2px 0 var(--shadow);white-space:nowrap;text-decoration:none}
.chip.hot{background:var(--accent);color:var(--accent-ink)}
main{min-width:0;padding:6px 0 24px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--panel);border-top:2px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px;text-decoration:none;font-family:var(--pix);font-size:8px;color:var(--muted);position:relative;border:2px solid transparent;min-width:0}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--accent-ink);background:var(--accent);border-color:var(--line)}
.nav .badge{position:absolute;top:2px;right:calc(50% - 26px);background:var(--bad);color:#fff;font-size:8px;padding:2px 4px;border:2px solid var(--line)}
@media (min-width:900px){
  body{padding-bottom:40px}
  /* ONE frame on every route: the rail never moves sideways between lesson and other routes */
  .app{max-width:1680px;grid-template-columns:200px minmax(0,1fr);column-gap:28px}
  .top{grid-column:1 / -1}
  .nav{position:sticky;top:12px;bottom:auto;align-self:start;flex-direction:column;border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow);padding:8px;gap:4px;grid-row:2}
  .nav a{flex-direction:row;gap:10px;font-size:10px;padding:10px 8px}
  .nav .badge{position:static;margin-left:auto}
  main{grid-row:2;grid-column:2;max-width:none}
  /* reading routes keep a comfortable column, pinned left next to the rail (no re-centring) */
  #view>*{max-width:var(--readw)}
  #view>.lgrid{max-width:none}
}
/* lesson: one column capped at ~72ch so every block shares one edge; the workbench aside sits beside it when .bench-side */
.lgrid{display:grid;grid-template-columns:minmax(0,72ch);grid-template-areas:"bar" "main";align-items:start}
.lgrid>*{grid-area:main;min-width:0}
.lgrid>.laybar{grid-area:bar}
.lgrid .prose{max-width:none}
.aside{display:none}
.btn.tobench{display:none}
.laybar{display:none;justify-content:flex-end;margin:0 0 8px}
.laybar .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (min-width:1000px){
  .app.split .laybar{display:flex}
  .app.split.bench-side .lgrid{grid-template-columns:minmax(0,72ch) clamp(340px,32vw,440px);grid-template-areas:"main bar" "main aside";grid-template-rows:auto 1fr;column-gap:28px}
  .app.split.bench-side .lgrid>.aside{grid-area:aside;display:block;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;overscroll-behavior:contain}
  .app.split.bench-side .btn.tobench{display:inline-flex}
  /* RUN stays reachable while long output scrolls the aside */
  .aside .cell>.bar2{position:sticky;top:0;z-index:2}
  .aside .out{max-height:40vh}
  .aside .cell .ta{min-height:clamp(200px,40vh,520px)}
}
@media (min-width:1280px){
  .app.split.bench-side .lgrid{grid-template-columns:minmax(0,72ch) clamp(440px,36vw,720px);justify-content:space-between}
}
.card{background:var(--panel);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:16px;margin:0 0 18px}
.card.tight{padding:12px 14px}
.h-pix{font-family:var(--pix);font-size:12px;line-height:1.8;margin:0 0 10px}
.sub{color:var(--muted);font-size:15px}
h1.title{font-family:var(--pix);font-size:16px;line-height:1.7;margin:4px 0 8px}
h2.sec{font-family:var(--pix);font-size:12px;line-height:1.7;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;border-top:2px dashed var(--line);opacity:.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:var(--pix);font-size:10px;line-height:1.4;padding:12px 14px;min-height:44px;
  background:var(--accent);color:var(--accent-ink);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow);text-decoration:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn:hover{filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.warn{background:var(--warn-soft);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--ink)}
.btn.small{font-size:9px;padding:8px 10px;min-height:38px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:14px;border:2px solid var(--line);background:var(--panel);position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);display:block}
.mission{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:2px dashed color-mix(in srgb,var(--line) 40%,transparent)}
.mission:first-of-type{border-top:0}
.mission .t{flex:1;min-width:0}
.mission .t b{display:block}
.tick{width:22px;height:22px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-family:var(--pix);font-size:9px;background:var(--panel)}
.tick.on{background:var(--ok-soft);color:var(--ok)}
.tick.part{background:var(--warn-soft)}
.tick.lock{background:var(--dim);color:var(--muted)}
.tag{font-family:var(--pix);font-size:8px;padding:4px 6px;border:2px solid var(--line);background:var(--panel);white-space:nowrap}
.tag.live{background:var(--accent);color:var(--accent-ink)}
.tag.fact{background:var(--warn-soft)}
.crumb{font-family:var(--pix);font-size:9px;text-decoration:none;color:var(--muted);display:inline-block;margin:6px 0 4px}
.prose{max-width:68ch}
.prose h3{font-family:var(--pix);font-size:11px;line-height:1.8;margin:30px 0 10px}
.prose p,.rich p{margin:0 0 14px}
.rich p:last-child{margin-bottom:0}
.prose ul,.rich ul{margin:0 0 14px;padding-left:22px}
.prose li,.rich li{margin:0 0 6px}
pre.src{margin:10px 0;padding:12px 14px;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:14px;overflow:auto;line-height:1.55;border:2px solid var(--line)}
.note{margin:16px 0;padding:12px 14px 12px 16px;border:2px solid var(--line);background:var(--panel)}
.note .nl{font-family:var(--pix);font-size:8px;display:block;margin-bottom:6px;letter-spacing:.3px}
.note.model{background:var(--accent-soft)}
.note.trap{background:var(--bad-soft)}
.note.tip{background:var(--warn-soft)}
.note.deep{background:var(--panel);border-style:dashed}
.note.deep>summary{cursor:pointer;list-style:none;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;min-height:32px}
.note.deep>summary::-webkit-details-marker{display:none}
.note.deep>summary .nl::before{content:'+ '}
.note.deep[open]>summary .nl::before{content:'- '}
.note.deep[open]>summary{margin-bottom:8px}
.note p{margin:0 0 8px}.note p:last-child{margin:0}
.nit{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);background:var(--accent-soft);margin:10px 0;font-size:15.5px}
.nit svg{flex:none;margin-top:2px}
.nit b{font-family:var(--pix);font-size:8px;display:block;margin-bottom:3px}
.cell,.ex{margin:16px 0;border:2px solid var(--line);background:var(--code-bg);box-shadow:3px 3px 0 var(--shadow)}
.ed{position:relative}
.ta{display:block;width:100%;min-height:56px;resize:none;border:0;outline:0;background:transparent;color:var(--code-ink);font-family:var(--mono);font-size:14.5px;line-height:1.55;padding:12px 14px;white-space:pre;overflow:auto;tab-size:4}
.ta:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.edhint{position:absolute;top:4px;right:6px;z-index:1;font-family:var(--mono);font-size:11.5px;line-height:1.3;padding:2px 6px;background:#0e1a08;color:#BFD99A;border:1px solid #3f5a28;pointer-events:none}
/* touch key row: ONE shared overlay pinned to the top of the on-screen keyboard (visualViewport). It is position:fixed, so showing or hiding it never moves the page (a tap on CHECK right after typing lands). */
.keys{position:fixed;z-index:35;left:0;top:0;display:flex;flex-direction:column;gap:4px;padding:5px;background:#0e1a08;border:2px solid #2c4118;box-shadow:0 -3px 0 rgba(0,0,0,.28);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.keys .krow{display:flex;gap:4px;min-width:0}
.keys .krow.more{overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.keys .krow.more::-webkit-scrollbar{display:none}
.keys .krow.more.ov{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent)}
.keys button{flex:1 1 0;min-width:28px;min-height:42px;padding:0 2px;background:#223616;color:#E4F4C6;border:1px solid #3f5a28;font-family:var(--mono);font-size:17px;line-height:1;cursor:pointer;touch-action:manipulation}
.keys .krow.more button{flex:1 0 38px}
.keys button:active,.keys button.hit{background:#3f5a28}
.keys.wide{flex-direction:row}
.keys.wide .krow{display:contents}
.keys.wide .krow.more button{flex:1 1 0}
html.keys-open #toasts{bottom:auto;top:calc(10px + env(safe-area-inset-top,0px))}   /* toasts move up while the key row is open, so they never cover it */
html.lime-keys body{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.ed-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--panel);border-top:2px solid var(--line)}
.bar2 .sp{flex:1}
.out{margin:0;padding:10px 14px;background:#0a1405;color:#C9E5A0;font-family:var(--mono);font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;border-top:2px solid var(--line);max-height:320px;overflow:auto}
.out .err{color:#FF9B85;display:block}
.out .dim{color:#7f9a66}
.out .runbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.out .stopbtn{font-size:9px}
.explain{padding:10px 14px;background:var(--bad-soft);border-top:2px solid var(--line);font-size:15px}
/* workbench (d11): sticky RUN bar on the Bench page (above the phone tab bar), snippet list, status line, traceback/notes */
.bench-full .bar2{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:5}
html.keys-open .bench-full .bar2{position:static}
@media (min-width:900px){.bench-full .bar2{bottom:0}}
.bench-status{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:0 0 6px;font-size:14.5px;min-width:0}
.bench-status b{font-family:var(--pix);font-size:8px}
.bench-status > span{overflow-wrap:anywhere}
.bench-status .dirty{color:var(--bad);font-weight:600}
.bench .row .namebox{flex:1 1 140px;min-width:0;width:auto}
.snip-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
.snip-tools .search{flex:1 1 160px;width:auto;min-width:0}
.snip{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 0;border-top:2px dashed color-mix(in srgb,var(--line) 40%,transparent)}
.snip:first-child{border-top:0}
.snip .t{flex:1 1 180px;min-width:0}
.snip .t b{display:flex;gap:8px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.snip .acts{display:flex;gap:6px;flex-wrap:wrap}
.snip.on{background:color-mix(in srgb,var(--accent) 12%,transparent);padding-left:8px;padding-right:8px}
.out details.trace{margin-top:8px;color:#C9E5A0}
.out details.trace summary{cursor:pointer;color:#7f9a66}
.out details.trace .tr{display:block;margin-top:4px}
.explain.benchnote{background:var(--panel)}
.explain.benchnote ul{margin:6px 0 0;padding-left:20px}
.explain b{font-family:var(--pix);font-size:8px;display:block;margin-bottom:4px}
.explain b code{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:0;margin-left:2px}
.explain.note{background:var(--warn-soft)}
.ex .hd{display:flex;gap:10px;align-items:center;background:var(--panel);padding:12px 14px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.ex .hd h3.ext{font-family:var(--body);font-size:1rem;line-height:1.4;flex:1;min-width:0;margin:0;font-weight:700}
.ex .hd b{font-family:var(--pix);font-size:8px;line-height:1.7;flex:1;min-width:0;margin:0;font-weight:700;letter-spacing:normal;text-transform:none}
.ex .pr{background:var(--panel);padding:12px 14px;border-bottom:2px solid var(--line)}
.ex .pr p{margin:0 0 8px}.ex .pr p:last-child{margin:0}
.res{list-style:none;margin:0;padding:10px 14px;background:var(--panel);border-top:2px solid var(--line)}
.res li{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.res li>.nit{flex:1;margin:4px 0}
.res .m{font-family:var(--pix);font-size:9px;width:20px;flex:none;margin-top:4px}
.res .ok .m{color:var(--ok)}.res .no .m{color:var(--bad)}
.res .why{display:block;font-size:14.5px;color:var(--muted)}
.res .lb{flex:1;min-width:0}
.res .det{display:block;margin-top:4px;padding:4px 8px;font-family:var(--mono);font-size:13.5px;line-height:1.45;background:var(--code-bg);color:var(--code-ink);border:2px solid var(--line);white-space:pre-wrap;word-break:break-word}
.res .explain{margin-top:6px;border:2px solid var(--line)}
.resw .sum{margin:0;padding:6px 14px;background:var(--panel);border-top:2px solid var(--line);font-size:14.5px;font-weight:700}
.resw .sum:empty{display:none}
.out .note{display:block;color:#a9c48a;font-size:12px;margin-top:4px}
.ex .exmore{display:contents}
.ex .moretg{display:none}
.ex .hintbtn{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.win .how{display:block;margin-bottom:4px}
.win .nit{margin:6px 0 0}
@media (max-width:600px){.ex .moretg{display:inline-flex}.ex .bar2:not(.open) .exmore{display:none}}
@media (pointer:coarse){.ex .bar2 .btn{min-height:44px}}
.box{padding:10px 14px;background:var(--warn-soft);border-top:2px solid var(--line);font-size:15.5px}
.box.sol{background:var(--panel)}
.box pre{margin:8px 0 0;padding:10px;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:13.5px;overflow:auto;border:2px solid var(--line)}
.win{background:var(--ok-soft);padding:10px 14px;border-top:2px solid var(--line);font-size:15px}
.win b{font-family:var(--pix);font-size:9px;display:block;margin-bottom:4px}
.pred{margin:16px 0;border:2px solid var(--line);background:var(--panel);box-shadow:3px 3px 0 var(--shadow)}
.pred .hd{padding:10px 14px;border-bottom:2px solid var(--line);font-family:var(--pix);font-size:9px;line-height:1.7}
.pred pre.src{margin:0;border:0;border-bottom:2px solid var(--line)}
.pred .in{padding:10px 14px}
.pred textarea,.teach textarea{width:100%;min-height:72px;font-family:var(--mono);font-size:14px;background:var(--bg);border:2px solid var(--line);padding:8px 10px;resize:vertical;white-space:pre}
.teach textarea{font-family:var(--body);white-space:normal;min-height:120px}
.pred .fb{padding:10px 14px;border-top:2px solid var(--line)}
.pred .fb.ok{background:var(--ok-soft)}.pred .fb.no{background:var(--bad-soft)}
.pred .fb pre{margin:6px 0;font-family:var(--mono);font-size:13.5px;white-space:pre-wrap}
.pred textarea::placeholder{white-space:pre-wrap}
.pred .fb .pnote{margin:6px 0;font-weight:600}
.pred .fb:not(.ok):not(.no){background:var(--bg)}
.pred pre.src.wrap{white-space:pre-wrap;overflow-wrap:anywhere;overflow:visible}
.pred pre.src.wrap .cl{display:block;min-height:1.55em;background-image:linear-gradient(#9fbf7c,#9fbf7c);background-repeat:no-repeat;background-size:2px calc(100% - 1.55em - 4px)}
.pz{margin:16px 0;border:2px solid var(--line);background:var(--panel);box-shadow:3px 3px 0 var(--shadow)}
.pz .hd{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:2px solid var(--line);font-family:var(--pix);font-size:9px;line-height:1.7}
.pz .hd span:first-child{flex:1}
.pz .zone{padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-height:60px}
.pz .zone.ans{background:var(--code-bg);border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.pz .zl{font-family:var(--pix);font-size:8px;color:var(--muted)}
.pz .zone.ans .zl{color:#9fbf7c}
.pz .ln{display:block;width:100%;text-align:left;font-family:var(--mono);font-size:14px;white-space:pre;padding:8px 10px;border:2px solid var(--line);background:var(--bg);cursor:pointer;min-height:40px;overflow-x:auto}
.pz .zone.ans .ln{background:#1d3311;color:var(--code-ink);border-color:#3f5a28}
.pz .ln .n{color:#7f9a66;user-select:none}

.toast.warn{background:var(--warn-soft);color:var(--ink)}

.lay-a,.lay-b{min-width:0}

  .v-home.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:28px;align-items:start}
  .v-district.cols2{display:grid;grid-template-columns:minmax(380px,1fr) minmax(0,1.5fr);column-gap:28px;align-items:start}
  .v-district.cols2>.lay-top{grid-column:1 / -1}

.app[data-route="bench"] .cell .ta{min-height:clamp(200px,40vh,520px)}
@media (min-width:1280px){
  .app[data-route="bench"] #view>*{max-width:none}
  .app[data-route="bench"] #view .cell{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"ed out" "bar out" "exp exp"}
  .app[data-route="bench"] #view .cell>.ed{grid-area:ed}

  .app[data-route="bench"] #view .cell>.out{grid-area:out;border-top:0;border-left:2px solid var(--line);max-height:70vh;align-self:stretch}
  .app[data-route="bench"] #view .cell>:not(.ed):not(.bar2):not(.out){grid-area:exp}
  .app[data-route="bench"] #view .cell:has(>.out[hidden])::after{content:"Output shows here after RUN.";grid-area:out;padding:10px 14px;border-left:2px solid var(--line);background:#0a1405;color:#7f9a66;font-family:var(--mono);font-size:13.5px}
}
/* read-only code: horizontal scroll with a right-edge fade while more text is hidden (pure CSS scroll shadow) */

/* narrow screens: wrap instead. Each line is an inline span (so copy and innerText stay exact). The pre's left padding
   becomes a 2ch gutter on every line fragment; ::before blanks the gutter on a line's first fragment, so a bar
   in the gutter marks each continuation of a wrapped line */
@media (max-width:599px){
  pre.src.wrapl,.box pre.wrapl{white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:hidden;background:var(--code-bg);padding-left:4px}
  pre.wrapl .cl{padding-left:2ch;-webkit-box-decoration-break:clone;box-decoration-break:clone;background:linear-gradient(#7f9a66,#7f9a66) .6ch 0/2px 100% no-repeat}
  pre.wrapl .cl::before{content:"";display:inline-block;width:2ch;height:1.3em;margin-left:-2ch;vertical-align:text-top;background:var(--code-bg)}
  .scene .cell .ta{white-space:pre-wrap;overflow-wrap:anywhere}
}

/* ===== d10 typography + contrast + theme ===== */
/* Text size (Me > Settings) scales the root; every size below is in rem, so Samsung's / the browser's font-size setting works too. */
html{font-size:100%}
html[data-text="115"]{font-size:115%}
html[data-text="130"]{font-size:130%}
body{font-size:1.0625rem}
/* Press Start 2P is drawn on an 8px grid: it is only used at 8, 16 or 24px. round() snaps the rem size back onto the grid when the text size grows
   (the px line before each is the fallback for browsers without round()). Smoothing off keeps the strokes crisp. */
.brand,.chip,.nav a,.btn,.seg button,.dtile b,.dtile .num,.arch .yr,.h-pix,h1.title,h2.sec,.dlg h2,.stat b,.timer{-webkit-font-smoothing:none;-moz-osx-font-smoothing:auto;font-smooth:never}
.chip,.nav a,.btn,.btn.small,.seg button,.dtile b,.dtile .num,.arch .yr,.out .stopbtn,.h-pix[style*="font-size"]{font-size:8px!important;font-size:round(nearest,.5rem,8px)!important;letter-spacing:.5px}

.btn{line-height:1.6}
.h-pix,h2.sec,.dlg h2,.stat b,.timer,h1.title{font-size:16px;font-size:round(down,1rem,8px);line-height:1.6}

/* labels that carry state or instructions: body font, bold, uppercase, 12-13px */

:is(.tag,.crumb,.note .nl,.nit b,.explain b,.res .m,.win b,.pz .zl,.pstrip div:not(.lpbody):not(.bar),.fcard .side,.toast b,.pred .hd,.pz .hd) code{text-transform:none;letter-spacing:0}
.ex .hd b{font-family:var(--body);font-weight:700;font-size:1.0625rem;line-height:1.4}

/* contrast (tests/d10_contrast.py checks every pair below in both themes for all 13 district accents) */
.nav .badge{background:var(--bad);color:var(--bad-ink)}
.tick.lock{background:var(--panel);color:var(--muted);border-style:dashed}
.bar>i{box-shadow:2px 0 0 var(--line)}

/* predict the output (core predictions and read-the-machine) */
/* normOut: CRLF, smart quotes, non-breaking spaces and trailing spaces/blank lines never make an answer wrong */
function normOut(s){
  return String(s == null ? '' : s).replace(/\r/g, '').replace(/[‘’‚‛′]/g, "'").replace(/[“”„‟″]/g, '"').replace(/[   ]/g, ' ')
    .split('\n').map(function(l){ return l.replace(/\s+$/, ''); }).join('\n').trim();
}
/* a prediction counts as done only when it was answered right (a revealed answer does not count) */
function predDone(key){ return !!(S.pred[key] && S.pred[key].ok); }
/* format tolerances, tried from the smallest set up: each one that is needed adds its note */
var PRED_LOOSE = [
  {f:function(s){ return s.replace(/"/g, "'"); }, note:'Right values. Python prints strings inside lists with single quotes.'},
  {f:function(s){ return s.replace(/[ \t]*([,:])[ \t]*/g, '$1'); }, note:'Right values. Python prints a comma and one space between items in a list or tuple, and `: ` after each key in a dict.'},
  {f:function(s){ return s.split('\n').map(function(l){ return l.trim().replace(/[ \t]+/g, ' '); }).join('\n'); }, note:'Check the spacing: print puts exactly one space between items.'}
];
/* predCheck(given, ans, traps) -> {ok, notes:[...], trap:message|null}; exact match, then a listed trap, then format tolerance, then a trap in another format */
function predCheck(given, ans, traps){
  var g = normOut(given), a = normOut(ans), tk = Object.keys(traps || {}), i, m;
  if (g === a) return {ok:true, notes:[], trap:null};
  for (i = 0; i < tk.length; i++) if (normOut(tk[i]) === g && normOut(tk[i]) !== a) return {ok:false, notes:[], trap:traps[tk[i]]};
  function via(s, mask){ PRED_LOOSE.forEach(function(t, j){ if (mask & (1 << j)) s = t.f(s); }); return s; }
  var masks = [1, 2, 4, 3, 5, 6, 7];
  for (m = 0; m < masks.length; m++) if (via(g, masks[m]) === via(a, masks[m]))
    return {ok:true, trap:null, notes:PRED_LOOSE.filter(function(t, j){ return masks[m] & (1 << j); }).map(function(t){ return t.note; })};
  for (m = 0; m < masks.length; m++) for (i = 0; i < tk.length; i++) if (via(g, masks[m]) === via(normOut(tk[i]), masks[m])) return {ok:false, notes:[], trap:traps[tk[i]]};

/* Parsons: tap lines into order; decoys are refused before running, then the assembled program is run against the tests */

  var pool = shuffle(items.slice()), ans = [], tries = 0;

    rec.order.forEach(function(t){ var it = pool.filter(function(x){ return x.t === t; })[0]; if (it){ pool.splice(pool.indexOf(it), 1); ans.push(it); } });
  }

    var j = i + d; if (j < 0 || j >= ans.length) return;

        } else {

      h('button', {class:'mv dn', type:'button', disabled:idx === ans.length - 1, 'aria-label':'Move line ' + (idx + 1) + ' down', onclick:function(){ move(idx, 1); }}, '▼'));
  }

    fill(poolEl, h('span', {class:'zl'}, pool.length ? 'TAP A LINE TO ADD IT' : 'ALL LINES USED'), pool.map(function(it, i){ return lineBtn(it, false, i); }));

    poolEl, ansEl, h('div', {class:'bar2'}, chk, clr), say, out, exp, res);

/* Teach-back: explain, compare with a model answer, tick the key points you covered, rate yourself honestly.

var TEACH_MIN = 15;
function teachWords(s){ var m = {}; String(s || '').toLowerCase().replace(/[^a-z0-9_'`.\-\s]/g, ' ').split(/\s+/).forEach(function(w){ w = w.replace(/^['`.\-]+|['`.\-]+$/g, ''); if (w) m[w] = 1; }); return Object.keys(m).length; }

  var boxes = pts.map(function(pt, i){

function sceneArt(tid, key, pct){
  var W = 96, H = 40, t = TBY[tid] || TBY.py, svg = svgEl(W, H, null, '');
  var restored = key === 'ending' || (typeof trackRestored === 'function' && trackRestored(tid));
  pct = key === 'ending' ? 1 : Math.max(0, Math.min(1, pct == null ? 0 : pct));
  svg.setAttribute('data-key', key || ''); svg.setAttribute('data-tid', tid);
  skyRect(svg, W, H);
  var seed = strHash(tid);
  for (var i = 0; i < 22; i++){ var sh = cellHash(seed, i, 99); rect(svg, sh % W, (sh >>> 8) % 14, 1, 1, '#4a5a3a'); }
  var roof = shade(t.accent, -0.55), far = shade(t.accent, -0.68), lit = 0, wins = 0, spr = SCENE_SPRITES[key];
  var x = 2, k = 0;
  while (x < W - 4){
    var hb = cellHash(seed, k, 7), bw = 6 + (hb % 8), bh = 10 + ((hb >>> 4) % 20);
    /* behind the foreground sprite the buildings are dark, distant silhouettes, so the sprite reads */
    if (spr && x < 40){ rect(svg, x, H - bh, Math.min(bw, 40 - x), bh, far); x += bw + 1; k++; continue; }
    rect(svg, x, H - bh, bw, bh, t.accent); rect(svg, x, H - bh, bw, 1, roof);
    for (var yy = H - bh + 3; yy < H - 3; yy += 3) for (var xx = x + 1; xx < x + bw - 1; xx += 2){
      var on = cellHash(seed, xx, yy) % 1000 < pct * 1000; wins++; if (on) lit++;
      rect(svg, xx, yy, 1, 1, on ? '#FFD75E' : '#1d2a14').setAttribute('class', on ? 'win lit' : 'win');
    }
    x += bw + 1; k++;
  }
  svg.setAttribute('data-lit', lit); svg.setAttribute('data-windows', wins);
  /* the tower and its clock: stuck at 06:00 until the district runs again (then 09:00) */
  var cx = Math.floor(W / 2);
  rect(svg, cx - 3, 4, 7, H - 4, '#C9C2A6'); rect(svg, cx - 4, 3, 9, 1, '#8E8770'); rect(svg, cx - 1, 1, 3, 2, '#8E8770');
  rect(svg, cx - 2, 6, 5, 5, '#F2EBD0'); rect(svg, cx, 8, 1, 1, '#17230E');
  if (restored){ rect(svg, cx, 6, 1, 2, '#17230E'); rect(svg, cx - 2, 8, 2, 1, '#17230E'); }
  else { rect(svg, cx, 6, 1, 2, '#17230E'); rect(svg, cx, 9, 1, 2, '#17230E'); }
  svg.setAttribute('data-clock', restored ? '09:00' : '06:00');
  /* the street, and the tram line once restored */
  rect(svg, 0, H - 2, W, 2, '#0B0F07');
  if (restored){
    rect(svg, 0, H - 2, W, 1, '#7D8A96');
    var tx = 62 + (seed % 20); rect(svg, tx, H - 5, 6, 3, '#D9493E'); rect(svg, tx + 1, H - 4, 1, 1, '#FFD75E'); rect(svg, tx + 3, H - 4, 1, 1, '#FFD75E'); rect(svg, tx + 2, H - 6, 1, 1, '#0B0F07');
  }
  if (spr){
    var col = Object.assign({}, SPR_COL);
    if (key === 'home' && pct <= 0) col.y = '#5c5a44';
    var g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'sprite'); g.setAttribute('data-sprite', key);
    drawRows(g, spr, col, 0, 0); g.setAttribute('transform', 'translate(6 ' + (H - 2 - 2 * spr.length) + ') scale(2)'); svg.appendChild(g);
  }
  return svg;
}

function sceneView(tid, screens, opts){
  var i = 0, body = h('div', {class:'body'}), counter = h('span', {class:'sub'});
  var prev = h('button', {class:'btn small ghost', onclick:function(){ if (i > 0){ i--; draw(); } }}, '< BACK');
  var next = h('button', {class:'btn small', onclick:function(){ if (i < screens.length - 1){ i++; Snd.page(); draw(); } else if (opts.onDone) opts.onDone(); }}, 'NEXT >');
  function draw(){
    fill(body, rich(screens[i], true));
    counter.textContent = (i + 1) + ' / ' + screens.length;
    prev.disabled = i === 0; next.textContent = i === screens.length - 1 ? (opts.doneLabel || 'DONE') : 'NEXT >';
  }
  draw();
  return h('div', {class:'scene'}, h('div', {class:'art'}, sceneArt(tid, opts.artKey, opts.pct)), body,
    h('div', {class:'foot'}, prev, counter, h('span', {class:'sp'}), opts.skip ? h('button', {class:'btn small ghost', onclick:opts.skip}, 'SKIP') : null, next));
}

var headRefs = null;

var SECS = [['learn', 'LEARN'], ['predict', 'PREDICT'], ['order', 'ORDER'], ['practice', 'PRACTICE'], ['jobs', 'CITY JOBS'], ['explain', 'EXPLAIN']];
function secCounts(p){ return {predict:[p.pr, p.prN], order:[p.pz, p.pzN], practice:[p.ex, p.exN], jobs:[p.rd + p.jo, p.rdN + p.joN], explain:[p.taught ? 1 : 0, p.tN]}; }
function lpBreakdown(L, p){
  var rows = [];
  function row(name, a, b, what){ if (b) rows.push(h('li', null, h('b', null, name + ': '), a + ' of ' + b + ' ' + what)); }
  row('Predict the output', p.pr, p.prN, 'right');
  row('Put it in order', p.pz, p.pzN, 'solved');
  row('Practice', p.ex, p.exN, 'solved');
  row('Read the machine', p.rd, p.rdN, 'right');
  row('City jobs', p.jo, p.joN, 'solved');

}
/* "Lesson N is open" card: shown at the top of the lesson and on Home until the next lesson is visited */
function openCard(L){
  var nx = freshNext(L);
  if (nx) return h('div', {class:'card opencard', role:'status'}, h('h2', {class:'h-pix'}, 'LESSON ' + nx.n + ' IS OPEN'),
    h('p', {style:'margin:0 0 10px'}, '"' + nx.title + '" is ready. You can finish this lesson first or go on: everything here stays as you left it.'),
    h('a', {class:'btn small', href:'#lesson-' + nx.id}, 'GO TO LESSON ' + nx.n + ' >'));
  var ls = lessonsOf(L.track);
  if (ls[ls.length - 1] === L && trackReady(L.track) && !(S.exam[L.track] || {}).n)
    return h('div', {class:'card opencard', role:'status'}, h('h2', {class:'h-pix'}, 'THE DISTRICT EXAM IS OPEN'),
      h('p', {style:'margin:0 0 10px'}, 'Every lesson in the district is at least 60% done, so the exam and the boss project are open.'),
      h('a', {class:'btn small', href:'#d-' + L.track}, 'TO THE DISTRICT >'));

}
function refreshHead(L){
  if (!headRefs || headRefs.L !== L) return;
  var p = lp(L), r = headRefs, cnt = secCounts(p);
  r.line.textContent = lpLine(L, p);
  r.bar.style.width = (100 * p.pct) + '%';
  r.mark.style.left = (100 * p.need / Math.max(1, p.tot)) + '%';
  fill(r.parts, lpBreakdown(L, p));
  fill(r.open, openCard(L));
  r.menu.forEach(function(m){ var c = cnt[m.id]; if (c) m.n.textContent = ' ' + c[0] + '/' + c[1]; m.b.classList.toggle('full', !!c && c[1] > 0 && c[0] === c[1]); });
  if (r.next){
    var nx = r.next.L, open = unlocked(nx);
    r.next.el.className = 'btn' + (open ? '' : ' locked');
    if (open) r.next.el.removeAttribute('aria-disabled'); else r.next.el.setAttribute('aria-disabled', 'true');
    fill(r.next.el, open ? nx.n + '. ' + nx.title + ' >' : ['LOCKED: ' + nx.n + '. ' + nx.title, h('span', {class:'why'}, p.left + ' more task' + (p.left === 1 ? '' : 's') + ' here opens it')]);
  }
}
function afterProgress(L){
  var p = lp(L);
  if (p.done && !S.read[L.id + ':done']){ S.read[L.id + ':done'] = Date.now(); award(30, null); Snd.done(); toast(nitLine('lesson'), 'LESSON COMPLETE'); }
  else if (p.pct >= UNLOCK && !S.read[L.id + ':open']){
    S.read[L.id + ':open'] = Date.now(); save();
    var ls = lessonsOf(L.track), nx = ls[ls.indexOf(L) + 1];
    toast((nx ? 'Lesson ' + nx.n + ', "' + nx.title + '", is now open.' : 'The district exam and boss project are open.') + ' This lesson\'s ' + lessonCardCount(L) + ' flashcards join your reviews.', 'UNLOCKED');

/* ---- lesson resume: per-lesson reading position (localStorage, per device) and "jump to your next task" ---- */
function lposAll(){ try { var o = JSON.parse(LS.get('lime.lpos') || '{}'); return isObj(o) ? o : {}; } catch(e){ return {}; } }
function absTop(el){ return el.getBoundingClientRect().top + (window.scrollY || 0); }
function secMenuH(){ var m = document.querySelector('#view .secnav'); return m ? m.offsetHeight + 8 : 8; }
function anchorEls(){ return Array.prototype.slice.call(document.querySelectorAll('#view [data-anchor]')); }
function anchorEl(a){ return anchorEls().filter(function(e){ return e.getAttribute('data-anchor') === a; })[0] || null; }
/* exact: scroll to the element's top plus off (a saved position); otherwise just below the sticky section menu */
function scrollToEl(el, off, exact){ if (!el) return; window.scrollTo(0, Math.max(0, absTop(el) + (off || 0) - (exact ? 0 : secMenuH()))); }
function saveLpos(){
  var r = headRefs; if (!r || route.name !== 'lesson' || Date.now() - r.at < 900) return;
  var y = window.scrollY || 0, top = y + secMenuH() + 4, best = null, m = lposAll();
  anchorEls().forEach(function(a){ if (absTop(a) <= top) best = a; });
  m[r.L.id] = {a:best ? best.getAttribute('data-anchor') : '', off:best ? Math.round(y - absTop(best)) : 0, y:Math.round(y), t:Date.now()};
  LS.set('lime.lpos', JSON.stringify(m));
  /* the section menu shows where you are */
  var sec = null; anchorEls().forEach(function(a){ var k = a.getAttribute('data-anchor'); if (k.indexOf('sec-') === 0 && absTop(a) <= top) sec = k.slice(4); });
  r.menu.forEach(function(x){ if (x.id === sec) x.b.setAttribute('aria-current', 'true'); else x.b.removeAttribute('aria-current'); });
}
var lposTimer = null;
window.addEventListener('scroll', function(){ if (!headRefs) return; clearTimeout(lposTimer); lposTimer = setTimeout(saveLpos, 200); }, {passive:true});
function secLabel(a){
  var id = /^sec-(\w+)/.exec(a || ''), found = null;
  if (id) found = id[1];
  else { var el = anchorEl(a), all = anchorEls(), i = all.indexOf(el); for (; i >= 0; i--){ var k = all[i].getAttribute('data-anchor'); if (k.indexOf('sec-') === 0){ found = k.slice(4); break; } } }
  var s = SECS.filter(function(x){ return x[0] === found; })[0];
  return s ? s[1].toLowerCase() : '';
}
/* the resume bar for lesson L (null on a first visit), called by lessonView once the tasks are known.
   Arriving from Home's CONTINUE (sessionStorage 'lime.resume') scrolls there at once. d08 owns generic Back/Forward restoration. */
function lessonResume(L, tasks){
  var saved = lposAll()[L.id], auto = false;
  try { if (sessionStorage.getItem('lime.resume') === L.id){ sessionStorage.removeItem('lime.resume'); auto = true; } } catch(e){}
  function next(){ return (tasks || []).filter(function(t){ return !t.ok(); })[0] || null; }
  function goSaved(){ var el = anchorEl(saved.a); if (el) scrollToEl(el, saved.off || 0, true); else window.scrollTo(0, saved.y || 0); }
  function goNext(){ var t = next(); if (t){ var el = anchorEl(t.a); scrollToEl(el); var f = el && el.querySelector('textarea'); if (f) try { f.focus({preventScroll:true}); } catch(e){} } }
  var hasSaved = saved && (saved.y || 0) > 600, nt = next();
  if (auto) setTimeout(function(){ if (hasSaved) goSaved(); else if (nt && lp(L).got) goNext(); }, 80);
  if (!S.read[L.id] || (!hasSaved && !(nt && lp(L).got))) return null;
  return h('div', {class:'resume', role:'group', 'aria-label':'Pick up where you left off'},
    hasSaved ? h('button', {class:'btn small', type:'button', onclick:goSaved}, 'BACK TO WHERE YOU WERE', secLabel(saved.a) ? h('span', {class:'why'}, 'in ' + secLabel(saved.a)) : null) : null,
    nt ? h('button', {class:'btn small ghost', type:'button', onclick:goNext}, 'JUMP TO YOUR NEXT TASK', h('span', {class:'why'}, nt.title)) : null);
}

/* ---- re-do: retrieval practice on an old exercise from a blank page ----
   Levels per item: the next re-do is due 3, 7, 21, then 60 days after the last solve; a clean re-do (no hint, no
   solution, at most 3 tries) moves up one level, and after the 60-day one the item retires. Using help or needing more
   than 3 tries sends it back to 3 days. S.redo[key] = {v:2, t (last change, for merging), at (last re-do solve),
   lv, n, peek, hint, skipDay}. Older records {t, n} (one re-do under the old 7-day rule) and {t, skip:1} still read. */

  var r = S.redo[key], lv = 0, at = d.t || 0, last = d.t || 0;
  if (r && r.v === 2){ lv = r.lv || 0; at = r.at || d.t || 0; if (r.at) last = Math.max(last, r.at); }
  else if (r && r.skip){ at = r.t || at; }
  else if (r){ lv = 1; at = r.t || at; last = Math.max(last, r.t || 0); }
  var retired = lv >= REDO_IV.length;
  return {lv:lv, at:at, last:last, retired:retired, due:retired ? Infinity : at + REDO_IV[lv] * DAY_MS, skipDay:r && r.skipDay};
}
function redoItems(){
  var out = [];
  LESSONS.forEach(function(L){
    var c = cityOf(L);
    L.exercises.forEach(function(e){ out.push({L:L, ex:e, key:L.id + ':' + e.id}); });
    c.jobs.forEach(function(j){ out.push({L:L, ex:j, key:K(L, 'job', j.id)}); });

}

  var now = Date.now(), today = dayNum(), best = null;

    var st = redoState(it.key); if (!st || st.retired || now < st.due || st.skipDay === today) return;
    var d = S.done[it.key], iv = REDO_IV[st.lv] * DAY_MS;
    /* most overdue for its own interval; write-it items before fix-it items (re-fixing the same bug is recognition) */
    var score = (1 + (now - st.due) / iv) * (it.ex.kind === 'fix' ? 0.5 : 1) + (st.lv === 0 && d.peek ? 0.5 : 0) + (st.lv === 0 ? Math.min(3, (d.n || 1) - 1) * 0.1 : 0);
    if (!best || score > best.score) best = Object.assign({score:score, last:st.last, due:st.due, lv:st.lv}, it);
  });
