attacked", "resident": "Captain Lark", "boss": "The Gatehouse Lock"}, {"id": "game", "name": "Games and graphics", "status": "planned", "blurb": "Build games and draw with code: loops, sprites, physics and the maths of graphics.", "planned": ["The game loop", "Drawing on a 2D canvas", "Sprites and input", "Collision detection", "Simple physics", "Procedural generation", "Vectors and matrices", "3D and shaders, the concepts", "Game AI"], "district": "Carnival Row", "accent": "#EE5FA7", "ink": "#2A0718", "theme": "A loop, a screen, a player", "resident": "Pip, ride operator", "boss": "The Great Wheel"}], "city": {"py01": {"lesson": "py01", "opener": "The tram fare box has forgotten arithmetic. You have not. Lend it yours.", "scene": "Wren drives the Number 1 tram round the Workshop Quarter. This morning the fare box added every coin twice, then stopped altogether. Wren hands you the box's last program and a cup of oil.\n\n\"It used to just work,\" Wren says.\n\nNIT clicks from its pigeonholes: \"Everything used to just work. That is how you know someone wrote it.\" ", "jobs": [{"id": "fares", "title": "Count the fare box", "kind": "write", "prompt": "Thirteen passengers each paid 7 coins today. Coins go into bags of 20. Print three lines: the total number of coins, the number of full bags, and the loose coins left over. Work each one out with an expression, not by hand.", "starter": "# 13 passengers, 7 coins each, bags of 20\n", "tests": "check(\"prints 91, 4 and 11 on three lines\", lambda: out.split() == [\"91\", \"4\", \"11\"], \"Total first, then full bags, then the leftover.\")\ncheck(\"calculates instead of typing answers\", lambda: \"13 * 7\" in code.replace(\"13*7\", \"13 * 7\"), \"Write 13 * 7 so your working shows.\")\ncheck(\"uses // and %\", lambda: \"//\" in code and \"%\" in code, \"Full bags is floor division; leftover is the remainder.\")\n", "hint": "Full bags: 13 * 7 // 20. Leftover: 13 * 7 % 20. Precedence works left to right for * // and %, so no brackets are needed.", "solution": "print(13 * 7)\nprint(13 * 7 // 20)\nprint(13 * 7 % 20)\n", "role": "story"}, {"id": "midnight", "title": "Repair the tower clock", "kind": "fix", "prompt": "The tower clock turns minutes since midnight into hours and minutes. For 1000 minutes it should print `16` then `40`, but the hours come out as `16.666666666666668`. Repair it.", "starter": "print(1000 / 60)\nprint(1000 % 60)\n", "tests": "check(\"prints 16 then 40\", lambda: out.split() == [\"16\", \"40\"], \"Hours must be a whole number.\")\ncheck(\"still calculates from 1000\", lambda: \"1000\" in code and \"16\" not in code, \"Fix the operator rather than typing the answer.\")\n", "hint": "One operator is wrong. Which division drops the fraction?", "solution": "print(1000 // 60)\nprint(1000 % 60)\n", "role": "repair"}], "read": [{"id": "r1", "title": "The fare box's last program", "code": "print(13 * 7 // 20 * 20)\nprint(13 * 7 - 13 * 7 // 20 * 20)\nprint(2 + 2 * 2 ** 2)\nprint(7 / 7, 7 // 7)", "why": "`*`, `//` and `%` share one level and run left to right: 91 // 20 is 4, times 20 is 80. Then 91 - 80 is 11, which is exactly `91 % 20`. `**` binds tightest: 2 ** 2 is 4, times 2 is 8, plus 2 is 10. `/` always gives a float (1.0); `//` on two ints gives an int (1).", "ans": "80\n11\n10\n1.0 1"}], "parsons": [{"id": "p1", "title": "Furnace readings", "prompt": "Put the lines in order so the program prints a heading, then the average of the three furnace readings 12, 15 and 18 (`15.0`), then the average rounded down (`15`). One line is a decoy that gets the precedence wrong: leave it out.", "lines": ["print(\"Furnace average\")", "print((12 + 15 + 18) / 3)", "print((12 + 15 + 18) // 3)"], "distractors": ["print(12 + 15 + 18 / 3)"], "tests": "check(\"prints the heading, 15.0 and 15 in order\", lambda: out.strip().split(\"\\n\") == [\"Furnace average\", \"15.0\", \"15\"], \"Heading first, then the true division, then the floor division.\")\n", "hint": ""}], "teach": {"prompt": "Explain to Wren, who has never programmed, the difference between `/`, `//` and `%`. Use the fare box (91 coins, bags of 20) as your example.", "model": "`/` divides exactly and always gives a float: 91 / 20 is 4.55. `//` divides and rounds down to a whole number: 91 // 20 is 4 full bags. `%` gives what is left after taking out the whole bags: 91 % 20 is 11 loose coins. They always fit together: 4 * 20 + 11 is 91 again."}, "terms": [{"term": "interpreter", "def": "The program that reads your Python code and carries out its statements one at a time, from top to bottom.", "ex": "Lime runs a Python interpreter inside the page.", "mistake": "Thinking the computer understands what you meant. It only does what the text says."}, {"term": "expression", "def": "Code that produces a value.", "ex": "`6 * 7` is an expression with the value 42.", "mistake": "Writing an expression alone on a line in a script and expecting it to be shown. Only `print` shows it."}, {"term": "statement", "def": "A complete instruction that Python carries out.", "ex": "`print(6 * 7)` is a statement.", "mistake": ""}, {"term": "operator precedence", "def": "The rules that decide which part of an expression is calculated first: `**`, then `*` `/` `//` `%`, then `+` `-`. Brackets override everything.", "ex": "`2 + 3 * 4` is 14, not 20.", "mistake": "Forgetting that `-3 ** 2` is -9, because `**` binds tighter than the minus sign."}, {"term": "floor division (//)", "def": "Division that rounds down toward negative infinity.", "ex": "`7 // 2` is 3 and `-7 // 2` is -4.", "mistake": "Expecting `-7 // 2` to be -3."}, {"term": "modulo (%)", "def": "The remainder after floor division. It always matches `//`: `a == (a // b) * b + a % b`.", "ex": "`91 % 20` is 11.", "mistake": ""}, {"term": "int", "def": "A whole number type with no size limit in Python.", "ex": "`42`, `-7`, `10 ** 30`.", "mistake": ""}, {"term": "float", "def": "A number with a decimal point, stored approximately in binary.", "ex": "`3.5`, `8 / 2` (which is `4.0`).", "mistake": "Expecting `/` to give an int when the answer is whole."}, {"term": "comment", "def": "Text after `#` that Python ignores. Written for humans.", "ex": "`# bags of 20 coins`", "mistake": ""}, {"term": "traceback", "def": "The error report Python prints when something goes wrong. Read it from the bottom: the last line names the error, the lines above show where.", "ex": "`ZeroDivisionError: division by zero`", "mistake": "Reading only the top line."}]}, "py02": {"lesson": "py02", "opener": "Names are labels tied to drawers. The values live in the drawers. Keep track of which label is on which drawer.", "scene": "Mrs Pell runs the fruit stall at the corner of Spring Lane. Her till died last winter, so she keeps every price in her head and writes receipts in a hand nobody can read.\n\n\"Can your machine write a receipt a person can read?\" she asks.\n\nNIT: \"Heads are not storage. Names are. Also, her handwriting is a syntax error.\" ", "jobs": [{"id": "tickets", "title": "Wren's ticket line", "kind": "write", "prompt": "Wren sells day tickets. Using the names given, print exactly:\n\n`Wren sold 12 tickets for 54.00 coins`\n\nBuild the line with one f-string, and show the money with two decimal places. Keep the first three lines as they are: the checker changes them to test you.", "starter": "driver = \"Wren\"\nriders = 12\nprice = 4.5\n", "tests": "check(\"prints the exact line\", lambda: out.strip() == \"Wren sold 12 tickets for 54.00 coins\", \"Two decimals: {value:.2f}.\")\ncheck(\"uses an f-string\", lambda: 'f\"' in code or \"f'\" in code)\ndef other():\n    ns2, out2 = rerun(\"riders = 12\", \"riders = 3\")\n    return out2.strip() == \"Wren sold 3 tickets for 13.50 coins\"\ncheck(\"works for 3 riders too\", other, \"Calculate riders * price inside the braces instead of typing 54.00.\")\n", "hint": "Put expressions inside the braces: {riders * price:.2f}.", "solution": "driver = \"Wren\"\nriders = 12\nprice = 4.5\nprint(f\"{driver} sold {riders} tickets for {riders * price:.2f} coins\")\n", "role": "story"}, {"id": "pell_total", "title": "Repair Mrs Pell's till", "kind": "fix", "prompt": "The stall's stock arrives as text from the delivery note, so `apples` is the string `\"12\"`. The till should print `Total fruit: 19` but crashes with a `TypeError`. Repair it without changing the first line.", "starter": "apples = \"12\"\npears = 7\ntotal = apples + pears\nprint(\"Total fruit: \" + total)\n", "tests": "check(\"prints Total fruit: 19\", lambda: out.strip() == \"Total fruit: 19\", \"Two conversions are needed: text to number for the sum, number to text for the message (or use an f-string).\")\ncheck('keeps apples = \"12\"', lambda: 'apples = \"12\"' in code, \"The data arrives as text. Convert it; don't retype it.\")\n", "hint": "int(apples) turns the text into a number. Then either str(total) or an f-string puts it back into the message.", "solution": "apples = \"12\"\npears = 7\ntotal = int(apples) + pears\nprint(f\"Total fruit: {total}\")\n", "role": "repair"}], "read": [{"id": "r1", "title": "Labels and drawers", "code": "a = 5\nb = a\na = a + 1\nprint(a, b)\nc = \"5\"\nprint(c * 2, int(c) * 2)\nprint(type(a / 1).__name__, type(a // 1).__name__)\ntotal = 0\ntotal += 4\ntotal *= 3\nprint(total)", "why": "`b = a` ties `b` to the value 5. `a = a + 1` makes a new value 6 and moves only the label `a`, so `b` still shows 5. `*` on a string repeats it (`55`); after `int` it multiplies (10). `/` gives a float even for whole answers; `//` on ints gives an int. `+=` and `*=` update: 0 + 4 is 4, times 3 is 12.", "ans": "6 5\n55 10\nfloat int\n12"}], "parsons": [{"id": "p1", "title": "Swap the gear labels", "prompt": "Order the lines so the two names swap their values through a spare name, then print `copper brass`. One decoy line would overwrite a value before it is saved.", "lines": ["left = \"brass\"", "right = \"copper\"", "spare = left", "left = right", "right = spare", "print(left, right)"], "distractors": ["right = left"], "tests": "check(\"prints copper brass\", lambda: out.strip() == \"copper brass\", \"Save one value in spare before you overwrite it.\")\n", "hint": ""}], "teach": {"prompt": "Why does `b = a` followed by `a = a + 1` leave `b` unchanged? Explain it with labels and drawers.", "model": "A name is a label attached to a value. `b = a` attaches a second label to the same value, 5. `a = a + 1` calculates a new value, 6, and moves the `a` label onto it. Nothing changed the 5, and the `b` label is still on it. Numbers and strings can never be changed in place, so the only way to 'change' them is to move a label to a new value."}, "terms": [{"term": "name (variable)", "def": "A label that refers to a value. Assignment attaches it.", "ex": "`price = 4.5`", "mistake": "Thinking `b = a` links the two names forever."}, {"term": "assignment", "def": "The `=` statement: work out the right side, then attach the name on the left to the result.", "ex": "`total = total + 4`", "mistake": "Reading `=` as 'equals' in the maths sense. It means 'now refers to'."}, {"term": "type", "def": "The kind of value, which decides what operations make sense. `type(x)` tells you.", "ex": "`type(3.0)` is `float`.", "mistake": ""}, {"term": "str", "def": "The text type: a sequence of characters in quotes.", "ex": "`\"brass\"`, `'12'`", "mistake": "Adding `\"12\" + 7`: text and numbers do not mix without conversion."}, {"term": "bool", "def": "The type with exactly two values, `True` and `False`.", "ex": "`5 > 3` is `True`.", "mistake": ""}, {"term": "f-string", "def": "A string starting with `f` where expressions in `{}` are calculated and inserted, optionally with a format after a colon.", "ex": "`f\"{price:.2f}\"` gives `\"4.50\"`.", "mistake": "Forgetting the `f`, so the braces print literally."}, {"term": "type conversion", "def": "Making a value of one type from another: `int()`, `float()`, `str()`, `bool()`.", "ex": "`int(\"12\")` is 12.", "mistake": "`int(\"4.5\")` fails; use `float` first."}, {"term": "floating-point error", "def": "Floats are stored in binary, so most decimals are approximations.", "ex": "`0.1 + 0.2` is `0.30000000000000004`.", "mistake": "Comparing floats with `==`; compare the difference to a small tolerance instead."}, {"term": "augmented assignment", "def": "Shorthand that updates a name: `x += 1` means `x = x + 1`.", "ex": "`total *= 3`", "mistake": ""}]}, "py03": {"lesson": "py03", "opener": "Today: the tram loop. A loop whose condition never changes is a tram that never reaches the depot. Watch your conditions.", "scene": "The Number 1 tram has stopped at Brass Yard and will not leave. Its program says \"while there are stops left, announce the stop\". It has announced Brass Yard four thousand times.\n\nWren sighs. \"It's very polite about it.\"\n\nNIT: \"Politeness is not progress. Something inside the loop must move it toward the end.\" ", "jobs": [{"id": "timetable", "title": "Print the tram timetable", "kind": "write", "prompt": "The tram leaves at 06:00 and then every `every` minutes, up to and including `last` minutes after 06:00. Print each departure as `HH:MM`, one per line. With the values given, that is 06:00, 06:15, ... 08:00 (nine lines). Keep the three setting lines: the checker changes them.", "starter": "start_hour = 6\nevery = 15\nlast = 120\n", "tests": "want = [\"06:00\", \"06:15\", \"06:30\", \"06:45\", \"07:00\", \"07:15\", \"07:30\", \"07:45\", \"08:00\"]\ncheck(\"prints the nine departures\", lambda: out.strip().split(\"\\n\") == want, \"Loop over the minutes after 06:00, then split each into hours and minutes.\")\ncheck(\"uses a loop\", lambda: \"for \" in code or \"while \" in code, \"Let the loop produce the lines.\")\ndef other():\n    ns2, out2 = rerun(\"every = 15\", \"every = 40\")\n    return out2.strip().split(\"\\n\") == [\"06:00\", \"06:40\", \"07:20\", \"08:00\"]\ncheck(\"works when trams run every 40 minutes\", other)\ndef late():\n    ns2, out2 = rerun(\"start_hour = 6\", \"start_hour = 9\")\n    return out2.strip().split(\"\\n\")[-1] == \"11:00\"\ncheck(\"works when the first tram is at 09:00\", late)\n", "hint": "range(0, last + 1, every) gives the minutes after the start. For each one, the hour is start_hour + m // 60 and the minute is m % 60. Pad both with :02d.", "solution": "start_hour = 6\nevery = 15\nlast = 120\nfor m in range(0, last + 1, every):\n    hour = start_hour + m // 60\n    minute = m % 60\n    print(f\"{hour:02d}:{minute:02d}\")\n", "role": "story"}, {"id": "stuck_tram", "title": "Repair the stuck tram", "kind": "fix", "prompt": "This loop should count down the stops to the depot and then print `Depot!`. Instead it never ends (Lime stops it after a few seconds). Repair it. The output should be `Stops left: 5` down to `Stops left: 1`, then `Depot!`.", "starter": "stops_left = 5\nwhile stops_left > 0:\n    print(\"Stops left:\", stops_left)\nprint(\"Depot!\")\n", "tests": "want = [\"Stops left: 5\", \"Stops left: 4\", \"Stops left: 3\", \"Stops left: 2\", \"Stops left: 1\", \"Depot!\"]\ncheck(\"counts down and reaches the depot\", lambda: out.strip().split(\"\\n\") == want, \"The condition is checked again each time round. What inside the loop should change it?\")\n", "hint": "Inside the loop, after printing, take one off stops_left.", "solution": "stops_left = 5\nwhile stops_left > 0:\n    print(\"Stops left:\", stops_left)\n    stops_left -= 1\nprint(\"Depot!\")\n", "role": "repair"}], "read": [{"id": "r1", "title": "The fuel gauge", "code": "stops = 0\nfuel = 10\nwhile fuel > 0:\n    fuel -= 3\n    stops += 1\nprint(stops, fuel)\ntotal = 0\nfor i in range(1, 8):\n    if i % 2 == 0:\n        continue\n    if i > 5:\n        break\n    total += i\nprint(total)\nprint(0 or \"spare\", 3 and 0, not \"\")", "why": "Fuel goes 10, 7, 4, 1, -2: the check happens before each pass, so the loop runs 4 times and fuel ends at -2. In the for loop, even numbers are skipped and 7 triggers `break`, so total is 1 + 3 + 5 = 9. `or` returns the first truthy value (`spare`); `and` returns the first falsy one (0); an empty string is falsy, so `not \"\"` is True.", "ans": "4 -2\n9\nspare 0 True"}], "parsons": [{"id": "p1", "title": "Count the inspection days", "prompt": "The tram is inspected on every day number from 1 to 49 that is a multiple of 7. Order the lines to count those days and print the count (`7`). Indentation is already set. Two lines are decoys.", "lines": ["count = 0", "for day in range(1, 50):", "    if day % 7 == 0:", "        count += 1", "print(count)"], "distractors": ["    count = 0", "    print(day)"], "tests": "check(\"prints 7\", lambda: out.strip() == \"7\", \"Start the counter before the loop and print after it.\")\n", "hint": ""}], "teach": {"prompt": "When would you use `while` instead of `for`? Give one tram example of each and say why.", "model": "Use `for` when you know what you are going through before you start: `for stop in range(5)` visits each of 5 stops. Use `while` when you repeat until a condition changes and you don't know how many passes that takes: `while fuel > 0` keeps driving until the tank is empty. A `while` loop needs something inside it that moves toward making the condition false, or it never ends."}, "terms": [{"term": "boolean expression", "def": "An expression whose value is `True` or `False`.", "ex": "`fuel > 0`", "mistake": ""}, {"term": "comparison operators", "def": "`==`, `!=`, `<`, `<=`, `>`, `>=`. They can be chained: `0 < x < 10`.", "ex": "`stops == 0`", "mistake": "Using `=` (assignment) where you meant `==` (comparison)."}, {"term": "short-circuit evaluation", "def": "`and` stops at the first falsy value and `or` at the first truthy one; the rest is never run.", "ex": "`0 or \"spare\"` is `\"spare\"`.", "mistake": "Expecting `and`/`or` to always return True or False. They return one of the values."}, {"term": "truthiness", "def": "Every value counts as true or false in a condition. False: `0`, `0.0`, `\"\"`, `[]`, `{}`, `None`, `False`. Everything else is true.", "ex": "`if name:` is false for an empty name.", "mistake": "`\"0\"` and `\"False\"` are non-empty strings, so they are truthy."}, {"term": "if / elif / else", "def": "Run the first block whose condition is true; `else` catches everything left.", "ex": "", "mistake": "Writing several separate `if`s when only one branch should run."}, {"term": "while loop", "def": "Repeats a block while a condition is true, checking before each pass.", "ex": "`while stops_left > 0:`", "mistake": "Forgetting to change anything the condition depends on: an infinite loop."}, {"term": "for loop", "def": "Repeats a block once for each item of a sequence.", "ex": "`for day in range(1, 50):`", "mistake": ""}, {"term": "range", "def": "`range(start, stop, step)` gives numbers from start up to but not including stop.", "ex": "`range(0, 121, 15)` gives 0, 15, ..., 120.", "mistake": "Expecting the stop value to be included."}, {"term": "accumulator", "def": "A name that starts empty or at zero before a loop and collects a result during it.", "ex": "`total = 0` then `total += x`", "mistake": "Resetting the accumulator inside the loop."}, {"term": "break / continue", "def": "`break` leaves the loop at once; `continue` skips to the next pass.", "ex": "", "mistake": ""}, {"term": "infinite loop", "def": "A loop whose condition never becomes false. Lime stops it after a few seconds.", "ex": "", "mistake": ""}]}, "py04": {"lesson": "py04", "opener": "Functions are stamps. Carve one carefully and you can press it a thousand times. Carve it badly and you get a thousand mistakes.", "scene": "The Workshop's stamp press makes every brass ticket by hand: same shape, same lettering, fresh effort each time. The apprentices are exhausted.\n\n\"Carve the stamp once,\" says the old press-keeper, \"then press.\"\n\nNIT: \"This is the most important idea in programming. I would underline it if I had a pen.\" ", "jobs": [{"id": "fare_for", "title": "The fare stamp", "kind": "write", "prompt": "Write `fare_for(stops, day_pass=False)`. A trip costs 2 coins per stop, but never more than 12 coins. Anyone with a day pass pays 0. The function must **return** the fare, not print it.", "starter": "def fare_for(stops, day_pass=False):\n    pass\n", "tests": "f = ns.get(\"fare_for\")\ncheck(\"defines fare_for\", lambda: callable(f))\ncheck(\"3 stops cost 6\", lambda: f(3) == 6)\ncheck(\"10 stops are capped at 12\", lambda: f(10) == 12, \"Use min(...) or an if to cap the fare.\")\ncheck(\"0 stops cost 0\", lambda: f(0) == 0)\ncheck(\"a day pass costs 0\", lambda: f(5, day_pass=True) == 0, \"Check day_pass first.\")\ncheck(\"returns rather than prints\", lambda: f(4) == 8, \"Use return. Printing inside the function gives the caller None.\")\n", "hint": "If day_pass is true, return 0. Otherwise return min(stops * 2, 12).", "solution": "def fare_for(stops, day_pass=False):\n    if day_pass:\n        return 0\n    return min(stops * 2, 12)\n", "role": "story"}, {"id": "speed", "title": "Repair the speed gauge", "kind": "fix", "prompt": "This should print `Speed: 24.0 km/h`, but it prints `24.0` and then `Speed: None km/h`. Repair `average_speed` so it gives its result back to the caller.", "starter": "def average_speed(distance, minutes):\n    print(distance / minutes * 60)\n\nspeed = average_speed(12, 30)\nprint(f\"Speed: {speed} km/h\")\n", "tests": "check(\"prints only Speed: 24.0 km/h\", lambda: out.strip() == \"Speed: 24.0 km/h\", \"The function prints its answer instead of handing it back.\")\nf = ns.get(\"average_speed\")\ncheck(\"average_speed(10, 60) returns 10.0\", lambda: f(10, 60) == 10.0)\n", "hint": "A function without return gives back None. Replace print with return.", "solution": "def average_speed(distance, minutes):\n    return distance / minutes * 60\n\nspeed = average_speed(12, 30)\nprint(f\"Speed: {speed} km/h\")\n", "role": "repair"}], "read": [{"id": "r1", "title": "The press-keeper's notebook", "code": "def press(x, times=2):\n    return x * times\n\ndef bump(n):\n    n = n + 1\n    return n\n\nn = 5\nbump(n)\nprint(n, bump(n))\nprint(press(3), press(\"ab\"), press(2, times=4))\n\ndef countdown(k):\n    if k == 0:\n        return \"go\"\n    return str(k) + \" \" + countdown(k - 1)\n\nprint(countdown(3))", "why": "`bump` has its own local `n`; changing it never touches the outer `n`, and the first call's result is thrown away, so `n` is still 5 and `bump(n)` gives 6. `press` doubles by default: 6, `abab`, and with `times=4` it gives 8. `countdown` calls itself with a smaller `k` until the base case returns `go`, building `3 2 1 go`.", "ans": "5 6\n6 abab 8\n3 2 1 go"}], "parsons": [{"id": "p1", "title": "The speed limiter", "prompt": "Order the lines into a function that returns the speed, but never more than the limit, then prints the results for 40 and 20 with a limit of 30 (`30 20`). Indentation is set. One decoy prints instead of returning.", "lines": ["def safe_speed(speed, limit):", "    if speed > limit:", "        return limit", "    return speed", "print(safe_speed(40, 30), safe_speed(20, 30))"], "distractors": ["        print(limit)"], "tests": "check(\"prints 30 20\", lambda: out.strip() == \"30 20\")\nf = ns.get(\"safe_speed\")\ncheck(\"safe_speed(5, 10) returns 5\", lambda: f is not None and f(5, 10) == 5)\n", "hint": ""}], "teach": {"prompt": "What is the difference between printing a value inside a function and returning it? Use the speed gauge bug to explain why the program printed `None`.", "model": "`print` shows a value on the screen and nothing else: the program cannot use what was printed. `return` hands the value back to whoever called the function, so it can be stored, compared or printed later. `average_speed` printed 24.0 but had no `return`, and every function without one returns `None`. So `speed` was `None`, and the f-string showed it."}, "terms": [{"term": "function", "def": "A named, reusable block of code that takes inputs and can give back a result.", "ex": "`def fare_for(stops): ...`", "mistake": ""}, {"term": "parameter", "def": "A name in the function definition that receives a value when the function is called.", "ex": "`stops` in `def fare_for(stops):`", "mistake": ""}, {"term": "argument", "def": "The actual value passed in a call.", "ex": "`3` in `fare_for(3)`", "mistake": ""}, {"term": "return value", "def": "What a call gives back. Without `return`, a function returns `None`.", "ex": "", "mistake": "Printing inside the function and expecting the caller to receive the value."}, {"term": "default argument", "def": "A parameter with a value used when the caller leaves it out.", "ex": "`day_pass=False`", "mistake": "Using a list or dict as a default: it is shared between calls (lesson 6)."}, {"term": "keyword argument", "def": "An argument passed by name, so order does not matter and the call reads clearly.", "ex": "`fare_for(5, day_pass=True)`", "mistake": ""}, {"term": "scope", "def": "Where a name can be seen. Names assigned inside a function are local to it.", "ex": "", "mistake": "Expecting a function to change an outer name by assigning to it."}, {"term": "docstring", "def": "A string as the first line of a function that explains what it does.", "ex": "`\"\"\"Return the fare in coins.\"\"\"`", "mistake": ""}, {"term": "assert", "def": "A statement that raises AssertionError if its condition is false. Used for quick self-checks.", "ex": "`assert fare_for(3) == 6`", "mistake": ""}, {"term": "recursion", "def": "A function that calls itself on a smaller version of the problem.", "ex": "`countdown(k - 1)`", "mistake": "Forgetting the base case, giving RecursionError."}, {"term": "base case", "def": "The input where a recursive function stops calling itself and returns directly.", "ex": "`if k == 0: return \"go\"`", "mistake": ""}]}, "py05": {"lesson": "py05", "opener": "Strings are rows of characters, numbered from zero. I have always counted from zero. It saves time at the start.", "scene": "Overnight a gust of wind spun every stop sign on the Number 1 line. The sign painter, Juno, has new boards but no idea what codes the old signs carried.\n\n\"There was a pattern,\" Juno says, \"letters and a number. My uncle knew it.\"\n\nNIT: \"Your uncle was a string function. Let us rebuild him.\" ", "jobs": [{"id": "stop_code", "title": "Stop codes", "kind": "write", "prompt": "Every stop has a code: the first three letters of its name with spaces removed, in capitals, followed by the length of the full name (spaces included). Write `stop_code(name)`.\n\n- `stop_code(\"Brass Yard\")` is `\"BRA10\"`\n- `stop_code(\"A B\")` is `\"AB3\"` (only two letters exist)", "starter": "def stop_code(name):\n    pass\n", "tests": "f = ns.get(\"stop_code\")\ncheck(\"defines stop_code\", lambda: callable(f))\ncheck('\"Brass Yard\" gives \"BRA10\"', lambda: f(\"Brass Yard\") == \"BRA10\")\ncheck('\"Gearwell\" gives \"GEA8\"', lambda: f(\"Gearwell\") == \"GEA8\")\ncheck('\"A B\" gives \"AB3\"', lambda: f(\"A B\") == \"AB3\", \"Slicing past the end is safe: it just gives what exists.\")\ncheck('\"o ld mill\" gives \"OLD9\"', lambda: f(\"o ld mill\") == \"OLD9\", \"Remove the spaces before taking the first three letters.\")\n", "hint": "name.replace(\" \", \"\")[:3].upper() gives the letters; str(len(name)) gives the number.", "solution": "def stop_code(name):\n    letters = name.replace(\" \", \"\")[:3].upper()\n    return letters + str(len(name))\n", "role": "story"}, {"id": "shout", "title": "Repair the sign painter", "kind": "fix", "prompt": "`shout(sign)` should return the sign in capitals with `!` on the end, so `shout(\"tram stop\")` is `\"TRAM STOP!\"`. It returns `\"tram stop!\"`. Repair it.", "starter": "def shout(sign):\n    sign.upper()\n    return sign + \"!\"\n\nprint(shout(\"tram stop\"))\n", "tests": "f = ns.get(\"shout\")\ncheck('shout(\"tram stop\") is \"TRAM STOP!\"', lambda: f(\"tram stop\") == \"TRAM STOP!\", \"upper() does not change the string: it returns a new one.\")\ncheck('shout(\"a\") is \"A!\"', lambda: f(\"a\") == \"A!\")\n", "hint": "Strings never change. Keep the result: sign = sign.upper().", "solution": "def shout(sign):\n    sign = sign.upper()\n    return sign + \"!\"\n\nprint(shout(\"tram stop\"))\n", "role": "repair"}], "read": [{"id": "r1", "title": "Juno's sign board", "code": "s = \"clockwork\"\nprint(s[0], s[-1], s[2:5])\nprint(s[::-1][:4])\nprint(s.replace(\"o\", \"0\").count(\"0\"), len(s))\nprint(\"work\" in s, s.find(\"x\"), s.find(\"o\"))\nprint(\"-\".join([\"BRA\", \"GEA\", \"OLD\"]))\nprint(ord(\"A\"), chr(ord(\"A\") + 2))", "why": "Index 0 is `c`, -1 is the last character `k`, and `[2:5]` takes positions 2, 3, 4: `ock`. Reversed, `clockwork` is `krowkcolc`; its first four are `krow`. There are two o's. `in` checks for a substring; `find` returns -1 when missing and the first position otherwise (2). `join` glues the list with the separator. `A` is code 65, and two codes later is `C`.", "ans": "c k ock\nkrow\n2 9\nTrue -1 2\nBRA-GEA-OLD\n65 C"}], "parsons": [{"id": "p1", "title": "Count the vowels on a sign", "prompt": "Order the lines into a function that counts vowels in any capitalisation, then print the count for `Clockwork City` (`3`). Indentation is set. One decoy resets the count in the wrong place.", "lines": ["def count_vowels(text):", "    total = 0", "    for ch in text.lower():", "        if ch in \"aeiou\":", "            total += 1", "    return total", "print(count_vowels(\"Clockwork City\"))"], "distractors": ["        total = 0"], "tests": "check(\"prints 3\", lambda: out.strip() == \"3\")\nf = ns.get(\"count_vowels\")\ncheck('\"AEIOU\" gives 5', lambda: f is not None and f(\"AEIOU\") == 5)\n", "hint": ""}], "teach": {"prompt": "Why does `s[0] = \"X\"` fail, and how do you get a string with a different first letter instead?", "model": "Strings are immutable: once made, their characters can never change, so assigning to a position raises TypeError. Instead you build a new string from pieces and move the name to it: `s = \"X\" + s[1:]`. Methods like `upper()` and `replace()` work the same way: they return a new string and leave the old one alone, which is why you must keep their result."}, "terms": [{"term": "string", "def": "An immutable sequence of characters.", "ex": "`\"Brass Yard\"`", "mistake": ""}, {"term": "index", "def": "A character's position, counting from 0. Negative indexes count from the end.", "ex": "`\"tram\"[0]` is `\"t\"`, `\"tram\"[-1]` is `\"m\"`.", "mistake": "Using `len(s)` as an index: the last one is `len(s) - 1`."}, {"term": "slice", "def": "`s[start:stop:step]` gives a new string from start up to, not including, stop. Out-of-range slices are safe.", "ex": "`\"clockwork\"[2:5]` is `\"ock\"`.", "mistake": ""}, {"term": "immutable", "def": "Cannot be changed after creation. Strings, numbers and tuples are immutable.", "ex": "", "mistake": "Calling `s.upper()` and expecting `s` to change."}, {"term": "method", "def": "A function attached to a value, called with a dot.", "ex": "`name.replace(\" \", \"\")`", "mistake": ""}, {"term": "len", "def": "Built-in that returns how many items a sequence has.", "ex": "`len(\"A B\")` is 3.", "mistake": ""}, {"term": "in (substring)", "def": "`a in b` is True if text `a` appears anywhere in `b`.", "ex": "`\"work\" in \"clockwork\"`", "mistake": ""}, {"term": "escape sequence", "def": "A backslash code inside a string: `\\n` new line, `\\t` tab, `\\\\` backslash.", "ex": "", "mistake": ""}, {"term": "raw string", "def": "A string prefixed with `r` where backslashes are kept as typed.", "ex": "`r\"C:\\new\"`", "mistake": ""}, {"term": "ord / chr", "def": "`ord` gives a character's Unicode number; `chr` turns a number back into a character.", "ex": "`ord(\"A\")` is 65.", "mistake": ""}, {"term": "Unicode", "def": "The standard that gives every character in every writing system a number.", "ex": "", "mistake": ""}]}, "py06": {"lesson": "py06", "opener": "Mrs Pell keeps her sales on scraps of paper. A list is a better scrap: ordered, growable, and it does not blow away.", "scene": "Mrs Pell tips a biscuit tin of paper scraps onto the counter. Each scrap is one hour's takings. \"I want to know my best hours,\" she says, \"and I want to stop losing scraps.\"\n\nNIT: \"This is the beginning of a ledger. Ledgers are the beginning of everything. Banks. Archives. Arguments.\" ", "jobs": [{"id": "best_hours", "title": "Mrs Pell's best hours", "kind": "write", "prompt": "`sales[i]` is what Mrs Pell took in hour `i`. Write `best_hours(sales, n)` that returns a list of the `n` hours with the biggest sales, biggest first. When two hours tie, the earlier hour comes first. Do not change the list you are given.\n\n- `best_hours([12, 0, 7, 30, 7, 15], 2)` is `[3, 5]`\n- `best_hours([5, 5, 1], 2)` is `[0, 1]`", "starter": "def best_hours(sales, n):\n    pass\n", "tests": "f = ns.get(\"best_hours\")\ncheck(\"defines best_hours\", lambda: callable(f))\ncheck(\"top 2 of [12, 0, 7, 30, 7, 15]\", lambda: f([12, 0, 7, 30, 7, 15], 2) == [3, 5])\ncheck(\"top 3 of the same\", lambda: f([12, 0, 7, 30, 7, 15], 3) == [3, 5, 0])\ncheck(\"ties keep the earlier hour first\", lambda: f([5, 5, 1], 2) == [0, 1], \"Sort by sales from high to low, and by hour from low to high.\")\ncheck(\"ties further down\", lambda: f([7, 9, 7, 7], 3) == [1, 0, 2])\ndef untouched():\n    s = [3, 1, 2]\n    f(s, 2)\n    return s == [3, 1, 2]\ncheck(\"does not change the list\", untouched, \"sorted() returns a new list; list.sort() changes the old one.\")\n", "hint": "Sort the hours, not the sales: sorted(range(len(sales)), key=...). A key function can return a tuple such as (-sales[h], h). Then slice the first n.", "solution": "def best_hours(sales, n):\n    def rank(h):\n        return (-sales[h], h)\n    return sorted(range(len(sales)), key=rank)[:n]\n", "role": "story"}, {"id": "restock", "title": "Repair the restock", "kind": "fix", "prompt": "`restock` should return a new shelf with the item added, leaving the original alone. It changes the morning shelf too. The program should print `['apple', 'pear']` then `['apple', 'pear', 'fig']`. Repair `restock`.", "starter": "def restock(shelf, item):\n    shelf.append(item)\n    return shelf\n\nmorning = [\"apple\", \"pear\"]\nevening = restock(morning, \"fig\")\nprint(morning)\nprint(evening)\n", "tests": "check(\"prints the two shelves\", lambda: out.strip().split(\"\\n\") == [\"['apple', 'pear']\", \"['apple', 'pear', 'fig']\"], \"shelf and morning are two names for one list.\")\nf = ns.get(\"restock\")\ndef untouched():\n    s = [\"a\"]\n    r = f(s, \"b\")\n    return s == [\"a\"] and r == [\"a\", \"b\"]\ncheck(\"leaves its argument unchanged\", untouched)\n", "hint": "Build a new list: return shelf + [item], or copy first with shelf[:].", "solution": "def restock(shelf, item):\n    return shelf + [item]\n\nmorning = [\"apple\", \"pear\"]\nevening = restock(morning, \"fig\")\nprint(morning)\nprint(evening)\n", "role": "repair"}], "read": [{"id": "r1", "title": "Two names, one tin", "code": "a = [1, 2]\nb = a\nc = a[:]\nb.append(3)\nc.append(4)\nprint(a, b, c)\nprint(a is b, a is c, a == [1, 2, 3])\nt = (5, 6)\nx, y = t\nprint(y, x, len(a + c))\nprint([n * n for n in range(5) if n % 2 == 1])\nprint(list(zip(\"ab\", [1, 2, 3])))", "why": "`b = a` makes a second name for the same list, so appending through `b` shows in `a`. `a[:]` is a copy, so `c` changes alone. `is` asks 'same object?', `==` asks 'same contents?'. Unpacking puts 5 in x and 6 in y. `a + c` has 3 + 3 items. The comprehension squares the odd numbers 1 and 3. `zip` stops at the shorter input.", "ans": "[1, 2, 3] [1, 2, 3] [1, 2, 4]\nTrue False True\n6 5 6\n[1, 9]\n[('a', 1), ('b', 2)]"}], "parsons": [{"id": "p1", "title": "A running total", "prompt": "Order the lines to build a running total of Mrs Pell's hourly sales and print it: `[12, 12, 19, 49]`. Indentation is set. Two decoys are placed wrongly.", "lines": ["sales = [12, 0, 7, 30]", "running = []", "total = 0", "for s in sales:", "    total += s", "    running.append(total)", "print(running)"], "distractors": ["    running = []", "    running.append(s)"], "tests": "check(\"prints [12, 12, 19, 49]\", lambda: out.strip() == \"[12, 12, 19, 49]\")\n", "hint": ""}], "teach": {"prompt": "Using Mrs Pell's list of sales, explain aliasing: when do two names share one list, and how do you make a real copy?", "model": "Assignment never copies. `b = a` attaches a second name to the same list, so `b.append(...)` changes what `a` shows too, and passing a list to a function does the same: the parameter is another name for the caller's list. To get a separate list, make one: `a[:]`, `list(a)` or `a.copy()` (a shallow copy), or build a new list with `+` or a comprehension."}, "terms": [{"term": "list", "def": "An ordered, mutable sequence written in square brackets.", "ex": "`[12, 0, 7]`", "mistake": ""}, {"term": "tuple", "def": "An ordered, immutable sequence written with commas, usually in brackets.", "ex": "`(5, 6)`", "mistake": "Writing `(5)` for a one-item tuple; it needs a comma: `(5,)`."}, {"term": "mutable", "def": "Can be changed in place. Lists, dicts and sets are mutable.", "ex": "", "mistake": ""}, {"term": "append / extend", "def": "`append` adds one item; `extend` adds every item of another sequence.", "ex": "", "mistake": "`a.append([1, 2])` adds one item that is a list."}, {"term": "sort vs sorted", "def": "`list.sort()` changes the list and returns None; `sorted(x)` returns a new list.", "ex": "", "mistake": "`a = a.sort()` sets `a` to None."}, {"term": "key function", "def": "A function given to sorting that turns each item into the value to sort by.", "ex": "`sorted(words, key=len)`", "mistake": ""}, {"term": "alias", "def": "A second name for the same object.", "ex": "`b = a`", "mistake": "Expecting a copy."}, {"term": "shallow copy", "def": "A new outer list that holds the same inner objects.", "ex": "`a[:]`, `a.copy()`", "mistake": "Copying a list of lists and expecting the inner lists to be separate."}, {"term": "list comprehension", "def": "A compact expression that builds a list from a loop and optional condition.", "ex": "`[n * n for n in range(5) if n % 2]`", "mistake": ""}, {"term": "zip", "def": "Pairs items from several sequences, stopping at the shortest.", "ex": "`zip(\"ab\", [1, 2])`", "mistake": ""}, {"term": "unpacking", "def": "Assigning the items of a sequence to several names at once.", "ex": "`x, y = (5, 6)`", "mistake": ""}]}, "py07": {"lesson": "py07", "opener": "The Archives have lent the Workshop a card index: keys on the front, values on the back. Treat it gently. It is older than me.", "scene": "Mrs Pell's tin now holds a week of scraps: each one says what she sold and for how much. She wants to know what earns her the most.\n\n\"Apples, I think,\" she says. \"Or plums. It feels like plums.\"\n\nNIT: \"Feelings are not a data structure. A dictionary is.\" ", "jobs": [{"id": "ledger", "title": "Mrs Pell's ledger", "kind": "write", "prompt": "Each record is a tuple `(item, coins)`. Write two functions:\n\n- `totals_by_item(records)` returns a dictionary of item to total coins.\n- `best_seller(records)` returns the item with the largest total. If totals tie, return the one that comes first alphabetically. For no records, return `None`.", "starter": "def totals_by_item(records):\n    pass\n\ndef best_seller(records):\n    pass\n", "tests": "t = ns.get(\"totals_by_item\")\nb = ns.get(\"best_seller\")\nweek = [(\"apple\", 4), (\"plum\", 3), (\"apple\", 2), (\"fig\", 6), (\"plum\", 3)]\ncheck(\"defines both functions\", lambda: callable(t) and callable(b))\ncheck(\"totals for the week\", lambda: t(week) == {\"apple\": 6, \"plum\": 6, \"fig\": 6})\ncheck(\"no records give an empty dict\", lambda: t([]) == {})\ncheck(\"a clear best seller\", lambda: b([(\"apple\", 4), (\"fig\", 9)]) == \"fig\")\ncheck(\"a three-way tie gives apple\", lambda: b(week) == \"apple\", \"Compare (-total, item) or sort the items first.\")\ncheck(\"no records give None\", lambda: b([]) is None)\n", "hint": "Counting pattern: totals[item] = totals.get(item, 0) + coins. For the best seller, reuse totals_by_item, then look for the largest total; a key such as (-total, name) handles ties.", "solution": "def totals_by_item(records):\n    totals = {}\n    for item, coins in records:\n        totals[item] = totals.get(item, 0) + coins\n    return totals\n\ndef best_seller(records):\n    totals = totals_by_item(records)\n    if not totals:\n        return None\n    def rank(item):\n        return (-totals[item], item)\n    return sorted(totals, key=rank)[0]\n", "role": "story"}, {"id": "riders", "title": "Repair the rider counter", "kind": "fix", "prompt": "`unique_riders(names)` should count how many **different** people rode today. It counts every ride instead, so a regular who rides twice is counted twice. Repair it.", "starter": "def unique_riders(names):\n    riders = []\n    for n in names:\n        riders.append(n)\n    return len(riders)\n", "tests": "f = ns.get(\"unique_riders\")\ncheck(\"defines unique_riders\", lambda: callable(f))\ncheck(\"Wren, Juno, Wren gives 2\", lambda: f([\"Wren\", \"Juno\", \"Wren\"]) == 2, \"A set keeps only one of each.\")\ncheck(\"nobody gives 0\", lambda: f([]) == 0)\ncheck(\"case matters: Ada and ada are different\", lambda: f([\"Ada\", \"ada\"]) == 2)\ncheck(\"handles 20000 rides quickly\", lambda: f([i % 50 for i in range(20000)]) == 50, \"A set checks membership instantly; a list has to search.\")\n", "hint": "Use a set instead of a list: riders = set(), riders.add(n). Or simply len(set(names)).", "solution": "def unique_riders(names):\n    return len(set(names))\n", "role": "repair"}], "read": [{"id": "r1", "title": "The borrowed card index", "code": "stock = {\"gear\": 3, \"spring\": 0}\nstock[\"gear\"] += 2\nstock[\"bolt\"] = stock.get(\"bolt\", 0) + 1\nprint(stock)\nprint(len(stock), \"spring\" in stock, stock.get(\"nut\"))\nseen = {3, 1, 3, 2}\nprint(len(seen), sorted(seen))\na = {\"x\", \"y\", \"z\"}\nb = {\"y\", \"z\", \"w\"}\nprint(sorted(a & b), sorted(a - b), len(a | b))\nprint({k: v * 2 for k, v in stock.items() if v})", "why": "`+=` updates the existing key, and `get` with a default creates `bolt` safely. A dict remembers insertion order. `in` checks keys, so `spring` is there even though its value is 0, and a missing key with `get` gives None. A set keeps one of each, so {3, 1, 3, 2} has 3 items. `&` is shared items, `-` is in a but not b, `|` is everything (4). The comprehension skips `spring` because 0 is falsy.", "ans": "{'gear': 5, 'spring': 0, 'bolt': 1}\n3 True None\n3 [1, 2, 3]\n['y', 'z'] ['x'] 4\n{'gear': 10, 'bolt': 2}"}], "parsons": [{"id": "p1", "title": "Group the stops by letter", "prompt": "Order the lines into a function that groups stop names by their first letter, then print the result for three stops. Indentation is set. One decoy resets the groups inside the loop.", "lines": ["def by_letter(names):", "    groups = {}", "    for name in names:", "        key = name[0]", "        if key not in groups:", "            groups[key] = []", "        groups[key].append(name)", "    return groups", "print(by_letter([\"Bell\", \"Brass\", \"Cog\"]))"], "distractors": ["        groups = {}"], "tests": "check(\"prints the grouped dict\", lambda: out.strip() == \"{'B': ['Bell', 'Brass'], 'C': ['Cog']}\")\n", "hint": ""}], "teach": {"prompt": "Explain why `x in a_set` stays fast for a million items while `x in a_list` gets slow. What does that mean for the rider counter?", "model": "A list has no idea where an item is, so `in` checks items one by one: a million items can mean a million checks. A set (and a dict's keys) stores each item at a place worked out from its hash, so Python jumps straight to where it would be: about the same speed for ten items or a million. The rider counter only needs 'have I seen this person?', which is exactly what a set is built for."}, "terms": [{"term": "dictionary", "def": "A mutable mapping from keys to values, kept in insertion order.", "ex": "`{\"gear\": 3}`", "mistake": ""}, {"term": "key / value", "def": "A dict stores each value under a unique key. Keys must be hashable.", "ex": "", "mistake": "Using a list as a key: lists are mutable, so they cannot be hashed."}, {"term": "KeyError", "def": "Raised when you read `d[k]` and `k` is not a key.", "ex": "", "mistake": "Fix with `d.get(k, default)` or check `k in d` first."}, {"term": ".get()", "def": "Returns the value for a key, or a default (None if not given) when the key is missing.", "ex": "`stock.get(\"nut\", 0)`", "mistake": ""}, {"term": ".items()", "def": "Gives (key, value) pairs for looping.", "ex": "`for item, coins in totals.items():`", "mistake": ""}, {"term": "set", "def": "An unordered, mutable collection of unique hashable items with fast membership tests.", "ex": "`{3, 1, 2}`", "mistake": "`{}` is an empty dict; an empty set is `set()`."}, {"term": "hashable", "def": "Has a fixed hash value, so it can be a dict key or set item. Numbers, strings and tuples of hashables are; lists and dicts are not.", "ex": "", "mistake": ""}, {"term": "counting pattern", "def": "`counts[k] = counts.get(k, 0) + 1` inside a loop.", "ex": "", "mistake": ""}, {"term": "grouping pattern", "def": "Create an empty list for a new key, then append to it.", "ex": "", "mistake": ""}, {"term": "set operations", "def": "`&` intersection, `|` union, `-` difference, `^` in exactly one.", "ex": "", "mistake": ""}]}, "py08": {"lesson": "py08", "opener": "Machines fail. Good machines fail loudly, say where, and say why. Bad machines fail quietly and let you find out at dinner.", "scene": "The fare box is back on the tram, writing a log line for every stop. But the ink smudges: some lines are unreadable, and the old program simply stops when it meets one. Wren wants the day's total anyway.\n\nNIT: \"Never let one smudge stop the whole day. Also never pretend the smudge is not there. Count it.\" ", "jobs": [{"id": "fare_log", "title": "Read the smudged log", "kind": "write", "prompt": "Each log line looks like `\"06:15,7\"`: a time, a comma, the coins taken. Some lines are smudged and can't be read. Write `total_coins(lines)` that returns a tuple `(total, bad)`: the sum of the coins on the good lines and the number of bad lines.\n\nA line is bad if it does not split into exactly two parts on the comma, or if the coins part is not a whole number. Catch only the errors you expect.", "starter": "def total_coins(lines):\n    pass\n", "tests": "f = ns.get(\"total_coins\")\ncheck(\"defines total_coins\", lambda: callable(f))\ncheck(\"all good lines\", lambda: f([\"06:15,7\", \"08:00,12\"]) == (19, 0))\ncheck(\"smudged coins and a line with no comma\", lambda: f([\"06:15,7\", \"07:00,x\", \"garbage\", \"08:00,12\"]) == (19, 2), \"Unpacking the wrong number of parts and int('x') both raise ValueError.\")\ncheck(\"too many commas is bad\", lambda: f([\"06:15,7,9\"]) == (0, 1))\ncheck(\"an empty log\", lambda: f([]) == (0, 0))\ncheck(\"catches a specific exception\", lambda: \"except ValueError\" in code or \"except (ValueError\" in code, \"A bare except would also hide real bugs, such as a typo in a name.\")\n", "hint": "In the loop: try: time, coins = line.split(','); total += int(coins) except ValueError: bad += 1.", "solution": "def total_coins(lines):\n    total = 0\n    bad = 0\n    for line in lines:\n        try:\n            time, coins = line.split(\",\")\n            total += int(coins)\n        except ValueError:\n            bad += 1\n    return (total, bad)\n", "role": "story"}, {"id": "average_fare", "title": "Repair the silent average", "kind": "fix", "prompt": "`average_fare(fares)` hides every problem by returning 0. That turns a broken list into a believable wrong answer. Repair it so that:\n\n- a normal list gives its average,\n- an empty list raises `ValueError` with a clear message,\n- a list containing text lets the `TypeError` through instead of hiding it.", "starter": "def average_fare(fares):\n    try:\n        return sum(fares) / len(fares)\n    except Exception:\n        return 0\n", "tests": "f = ns.get(\"average_fare\")\ndef raises(fn, exc):\n    try:\n        fn()\n    except exc:\n        return True\n    except Exception:\n        return False\n    return False\ncheck(\"[2, 4] gives 3.0\", lambda: f([2, 4]) == 3.0)\ncheck(\"an empty list raises ValueError\", lambda: raises(lambda: f([]), ValueError), \"Check for the empty case first and raise ValueError(\\\"...\\\").\")\ncheck(\"text in the list raises TypeError\", lambda: raises(lambda: f([2, \"x\"]), TypeError), \"Remove the blanket except so real errors surface.\")\n", "hint": "Delete the try/except. Before dividing, if not fares: raise ValueError('no fares to average').", "solution": "def average_fare(fares):\n    if not fares:\n        raise ValueError(\"no fares to average\")\n    return sum(fares) / len(fares)\n", "role": "repair"}], "read": [{"id": "r1", "title": "NIT's own log", "code": "def risky(x):\n    try:\n        result = 10 // x\n    except ZeroDivisionError:\n        print(\"zero!\")\n        return -1\n    else:\n        print(\"fine\")\n        return result\n    finally:\n        print(\"logged\", x)\n\nprint(risky(3))\nprint(risky(0))\ntry:\n    int(\"seven\")\nexcept ValueError as e:\n    print(\"bad:\", type(e).__name__)", "why": "For 3: the try succeeds, `else` prints `fine`, and `finally` prints `logged 3` before the return value 3 is printed. For 0: `ZeroDivisionError` jumps to the except branch, which prints `zero!`; `finally` still prints `logged 0`; then -1 is printed. `int(\"seven\")` raises ValueError, and `type(e).__name__` is its class name.", "ans": "fine\nlogged 3\n3\nzero!\nlogged 0\n-1\nbad: ValueError"}], "parsons": [{"id": "p1", "title": "A safe converter", "prompt": "Order the lines into a function that turns text into an int, or gives `None` if it can't, then print the results for `\"12\"` and `\"twelve\"` (`12 None`). Indentation is set. Two decoys hide errors or invent numbers.", "lines": ["def to_int(text):", "    try:", "        return int(text)", "    except ValueError:", "        return None", "print(to_int(\"12\"), to_int(\"twelve\"))"], "distractors": ["    except:", "        return 0"], "tests": "check(\"prints 12 None\", lambda: out.strip() == \"12 None\")\ncheck(\"catches ValueError by name\", lambda: \"except ValueError\" in code, \"A bare except would also hide typos.\")\n", "hint": ""}], "teach": {"prompt": "Describe the debugging method from this lesson in your own words, using the stuck tram from lesson 3 as your example.", "model": "Reproduce it: run the tram program and see it never reach the depot. Read the evidence: the output repeats 'Stops left: 5' forever. Form a hypothesis: the condition `stops_left > 0` never becomes false, so nothing in the loop changes `stops_left`. Test the hypothesis by printing `stops_left` each pass, or by tracing by hand. Fix one thing (subtract 1 each pass), run again, and check the whole output, including the end."}, "terms": [{"term": "syntax error", "def": "Python cannot even read the code: a missing bracket, colon or quote. Nothing runs.", "ex": "", "mistake": ""}, {"term": "runtime error", "def": "The code is valid but something goes wrong while running, raising an exception.", "ex": "`10 // 0`", "mistake": ""}, {"term": "logic error", "def": "The code runs without errors but gives the wrong answer. Only tests find these.", "ex": "", "mistake": ""}, {"term": "exception", "def": "An object Python raises to signal an error; it travels up until something handles it or the program stops.", "ex": "", "mistake": ""}, {"term": "try / except", "def": "Run a block, and if a named exception happens, run the handler instead of stopping.", "ex": "`except ValueError:`", "mistake": "A bare `except:` that also hides typos and real bugs."}, {"term": "else / finally", "def": "`else` runs if no exception happened; `finally` always runs, even after return.", "ex": "", "mistake": ""}, {"term": "raise", "def": "Signal an error yourself, with a message.", "ex": "`raise ValueError(\"no fares\")`", "mistake": ""}, {"term": "ValueError", "def": "The value has the right type but an unusable content.", "ex": "`int(\"seven\")`", "mistake": ""}, {"term": "TypeError", "def": "An operation got a value of the wrong type.", "ex": "`\"12\" + 7`", "mistake": ""}, {"term": "IndexError", "def": "A sequence index is out of range.", "ex": "`[1, 2][2]`", "mistake": ""}, {"term": "ZeroDivisionError", "def": "Division or modulo by zero.", "ex": "", "mistake": ""}, {"term": "debugging", "def": "Reproduce, read the evidence, form a hypothesis, test it, fix one thing, re-check.", "ex": "", "mistake": "Changing several things at once and not knowing which fixed it."}]}}, "districts": {"py": {"track": "py", "opener": ["You step off the night train into **Calx**, the Clockwork City, with a letter of apprenticeship and a bag that is mostly sandwiches. The station clock says 06:00. It has said 06:00 for eleven years.", "Everything here runs on small programs written by the Founders: the trams, the fountains, the bells, the bread ovens. The Founders wrote no comments. The last Readers, who could make sense of their programs, have retired to the coast.", "A brass cabinet on wheels rolls up beside you. It is full of pigeonholes, and every pigeonhole is labelled. \"I am NIT,\" it says. \"Index of Names and Things. You are late by four minutes and eleven seconds, which is very early by local standards.\"\n\n\"Every stopped machine in this city has the same last line in its log,\" NIT adds, and slides out a card:\n\n`waiting for MERIDIAN`", "\"Your first district is the **Workshop Quarter**. Its benches, trams and stalls have all stopped. Learn to read their programs, and you can start them again. Learn enough, and we might find out what MERIDIAN is.\"\n\nPayload: below is the station clock's program. Read it, predict what it prints, then run it.\n\n```\nhour = 6\nminute = 0\nprint(f\"{hour:02d}:{minute:02d}\")\n```\nWhy does it never move? Nothing in it changes `minute`. You will fix programs like this all through the Quarter."], "ending": ["The Bench Automaton shudders, wheezes, and starts sorting bolts by size. Across the Quarter, trams move, Mrs Pell's till prints receipts a person can read, and Juno's signs are back in order.", "NIT slides out the Automaton's log. Every line is fine, except the last:\n\n`inventory complete. waiting for MERIDIAN`\n\n\"The Workshop works,\" NIT says. \"But it is still waiting. The next district is the Conveyor Works, where they move everything by belt and nobody moves anything by hand. Bring your Bench Key.\" "], "archive": [{"id": "jacquard", "year": "1804", "title": "The loom that read cards", "text": "Joseph Marie Jacquard demonstrated a loom controlled by a chain of punched cards: each card's holes chose which threads were lifted, so a pattern could be changed by changing the cards. It is an early example of a machine following stored instructions, and punched cards later carried data and programs for over a century.", "source": "Encyclopaedia Britannica, \"Jacquard loom\""}, {"id": "lovelace", "year": "1843", "title": "Notes on the Analytical Engine", "text": "Ada Lovelace translated an Italian paper about Charles Babbage's proposed Analytical Engine and added her own notes, longer than the paper. Her Note G sets out, step by step, how the engine could compute Bernoulli numbers, and is often called the first published computer program. She also argued that such a machine could act on symbols other than numbers.", "source": "Encyclopaedia Britannica, \"Ada Lovelace\""}, {"id": "fortran", "year": "1957", "title": "FORTRAN", "text": "A team at IBM led by John Backus released FORTRAN (FORmula TRANslation), the first widely used high-level programming language. Programmers could write formulas instead of machine instructions, and a compiler translated them into fast machine code.", "source": "IBM, \"Fortran\" (IBM Heritage)"}, {"id": "bug", "year": "1947", "title": "The moth in the relay", "text": "Operators of the Harvard Mark II computer found a moth trapped in a relay, taped it into the logbook and wrote \"First actual case of bug being found.\" The joke worked because engineers already called faults bugs. The logbook page survives in a museum.", "source": "Smithsonian National Museum of American History, \"Log Book With Computer Bug\""}, {"id": "goto", "year": "1968", "title": "Structured programming", "text": "Edsger Dijkstra's letter \"Go To Statement Considered Harmful\" in Communications of the ACM argued that jumping freely around a program makes it hard to reason about. The structured style that followed, built from sequence, if/else and loops, is the style Python is built around: Python has no goto at all.", "source": "Communications of the ACM, March 1968"}, {"id": "ieee754", "year": "1985", "title": "IEEE 754 floating point", "text": "The IEEE 754 standard fixed how computers store and round floating-point numbers, so the same calculation gives the same answer on different machines. It stores numbers in binary, which is why 0.1 + 0.2 is not exactly 0.3 in Python and nearly every other language.", "source": "IEEE Standard 754"}, {"id": "ascii", "year": "1963", "title": "ASCII, then Unicode", "text": "ASCII, first published in 1963, gave each English letter, digit and symbol a 7-bit number: 'A' is 65. It had no room for most of the world's writing systems. Unicode, first published in 1991, gives a number to characters from every script, and Python 3 strings are Unicode.", "source": "Encyclopaedia Britannica, \"ASCII\"; The Unicode Consortium"}, {"id": "python", "year": "1991", "title": "Python is released", "text": "Guido van Rossum began Python as a hobby project over Christmas 1989 and published the first version in February 1991. The name comes from the BBC comedy series Monty Python's Flying Circus, not from the snake.", "source": "Python documentation, General FAQ: \"Why is it called Python?\" (docs.python.org)"}, {"id": "py3", "year": "2008", "title": "Python 3 breaks with the past", "text": "Python 3.0, released in December 2008, deliberately broke compatibility to fix old design mistakes: `print` became a function and text became Unicode by default. Python 2 was officially retired on 1 January 2020, so everything in Lime is Python 3.", "source": "python.org, \"Sunsetting Python 2\""}, {"id": "zen", "year": "2004", "title": "The Zen of Python", "text": "Tim Peters' 19 short aphorisms about good Python style were written up as PEP 20. Among them: \"Readability counts\" and \"Errors should never pass silently.\" In desktop Python you can read them all by running `import this`.", "source": "PEP 20 (peps.python.org/pep-0020)"}], "quests": [{"id": "change", "title": "Side quest: the change maker", "kind": "write", "prompt": "The tram's change drawer holds coins worth 50, 20, 10, 5, 2 and 1. Write `make_change(amount)` that returns a dictionary of coin to count using as few coins as possible, leaving out coins with a count of 0.\n\n`make_change(78)` is `{50: 1, 20: 1, 5: 1, 2: 1, 1: 1}`.", "starter": "def make_change(amount):\n    pass\n", "tests": "f = ns.get(\"make_change\")\ncheck(\"defines make_change\", lambda: callable(f))\ncheck(\"78\", lambda: f(78) == {50: 1, 20: 1, 5: 1, 2: 1, 1: 1})\ncheck(\"40 is two 20s\", lambda: f(40) == {20: 2})\ncheck(\"0 gives an empty dict\", lambda: f(0) == {})\ncheck(\"every amount up to 200 adds up\", lambda: all(sum(c * n for c, n in f(a).items()) == a for a in range(201)))\n", "hint": "Go from the largest coin down: count = amount // coin, then amount %= coin. Only store counts above 0.", "solution": "def make_change(amount):\n    result = {}\n    for coin in [50, 20, 10, 5, 2, 1]:\n        count = amount // coin\n        if count:\n            result[coin] = count\n        amount %= coin\n    return result\n", "role": "quest", "after": "py07"}, {"id": "rle", "title": "Side quest: the loom's pattern code", "kind": "write", "prompt": "The loom stores patterns compressed: runs of the same character become the character followed by its count. Write `encode(text)` and `decode(code)`.\n\n- `encode(\"aaabcc\")` is `\"a3b1c2\"`\n- `decode(\"a3b1c2\")` is `\"aaabcc\"`\n\nCounts can be more than one digit (`\"x12\"`). Patterns contain only letters.", "starter": "def encode(text):\n    pass\n\ndef decode(code):\n    pass\n", "tests": "e = ns.get(\"encode\")\nd = ns.get(\"decode\")\ncheck(\"defines encode and decode\", lambda: callable(e) and callable(d))\ncheck('encode(\"aaabcc\")', lambda: e(\"aaabcc\") == \"a3b1c2\")\ncheck('encode(\"\")', lambda: e(\"\") == \"\")\ncheck(\"encode handles long runs\", lambda: e(\"x\" * 12 + \"y\") == \"x12y1\")\ncheck('decode(\"a3b1c2\")', lambda: d(\"a3b1c2\") == \"aaabcc\")\ncheck(\"decode handles two-digit counts\", lambda: d(\"x12y1\") == \"x\" * 12 + \"y\")\ncheck(\"decode(encode(s)) gives s back\", lambda: all(d(e(s)) == s for s in [\"\", \"a\", \"abba\", \"zzzzzzzzzzzq\", \"mississippi\"]))\n", "hint": "encode: walk the text keeping the current character and its run length; when the character changes, write the run. decode: collect digits after each letter until the next letter.", "solution": "def encode(text):\n    out = \"\"\n    i = 0\n    while i < len(text):\n        j = i\n        while j < len(text) and text[j] == text[i]:\n            j += 1\n        out += text[i] + str(j - i)\n        i = j\n    return out\n\ndef decode(code):\n    out = \"\"\n    i = 0\n    while i < len(code):\n        ch = code[i]\n        j = i + 1\n        while j < len(code) and code[j].isdigit():\n            j += 1\n        out += ch * int(code[i + 1:j])\n        i = j\n    return out\n", "role": "quest", "after": "py05"}, {"id": "angle", "title": "Side quest: the clock hands", "kind": "write", "prompt": "Write `hand_angle(hour, minute)` that returns the smaller angle in degrees between the hour and minute hands of an analogue clock. The hour hand moves smoothly: at 3:30 it is halfway between 3 and 4.\n\n- `hand_angle(3, 0)` is `90.0`\n- `hand_angle(3, 30)` is `75.0`\n- `hand_angle(12, 0)` is `0.0`", "starter": "def hand_angle(hour, minute):\n    pass\n", "tests": "f = ns.get(\"hand_angle\")\ncheck(\"defines hand_angle\", lambda: callable(f))\ncheck(\"3:00 is 90\", lambda: f(3, 0) == 90.0)\ncheck(\"3:30 is 75\", lambda: f(3, 30) == 75.0, \"The hour hand moves 0.5 degrees per minute.\")\ncheck(\"12:00 is 0\", lambda: f(12, 0) == 0.0)\ncheck(\"9:00 is 90, the smaller angle\", lambda: f(9, 0) == 90.0, \"Take the smaller of the angle and 360 minus it.\")\ncheck(\"6:00 is 180\", lambda: f(6, 0) == 180.0)\n", "hint": "Minute hand: 6 degrees per minute. Hour hand: 30 * (hour % 12) + 0.5 * minute. Take the difference, then min(diff, 360 - diff).", "solution": "def hand_angle(hour, minute):\n    m = 6.0 * minute\n    h = 30.0 * (hour % 12) + 0.5 * minute\n    diff = abs(h - m)\n    return min(diff, 360 - diff)\n", "role": "quest", "after": "py04"}, {"id": "roman", "title": "Side quest: the tower's numerals", "kind": "write", "prompt": "The Meridian's face uses Roman numerals. Write `to_roman(n)` for 1 to 3999, using the subtractive forms (IV, IX, XL, XC, CD, CM).\n\n`to_roman(1994)` is `\"MCMXCIV\"`.", "starter": "def to_roman(n):\n    pass\n", "tests": "f = ns.get(\"to_roman\")\ncheck(\"defines to_roman\", lambda: callable(f))\ncheck(\"4 is IV\", lambda: f(4) == \"IV\")\ncheck(\"9 is IX\", lambda: f(9) == \"IX\")\ncheck(\"14 is XIV\", lambda: f(14) == \"XIV\")\ncheck(\"1994 is MCMXCIV\", lambda: f(1994) == \"MCMXCIV\")\ncheck(\"3999 is MMMCMXCIX\", lambda: f(3999) == \"MMMCMXCIX\")\n", "hint": "Keep a list of (value, symbols) pairs from 1000 down to 1, including 900 CM, 400 CD, 90 XC, 40 XL, 9 IX, 4 IV. Take each as many times as it fits.", "solution": "def to_roman(n):\n    pairs = [(1000, \"M\"), (900, \"CM\"), (500, \"D\"), (400, \"CD\"), (100, \"C\"), (90, \"XC\"), (50, \"L\"), (40, \"XL\"), (10, \"X\"), (9, \"IX\"), (5, \"V\"), (4, \"IV\"), (1, \"I\")]\n    out = \"\"\n    for value, sym in pairs:\n        while n >= value:\n            out += sym\n            n -= value\n    return out\n", "role": "quest", "after": "py06"}, {"id": "luhn", "title": "Side quest: check the ticket number", "kind": "write", "prompt": "Tram season tickets carry a check digit using the **Luhn algorithm** (the same one used on bank card numbers). Write `luhn_ok(number)` that takes a string of digits, possibly with spaces, and returns `True` if it passes:\n\n1. Remove the spaces.\n2. Starting from the rightmost digit, double every second digit (the 2nd, 4th, ... from the right). If doubling gives more than 9, subtract 9.\n3. Add up all the digits. The number is valid if the total is a multiple of 10.\n\n`\"4539 3195 0343 6467\"` is valid. Change any single digit and it is not.", "starter": "def luhn_ok(number):\n    pass\n", "tests": "f = ns.get(\"luhn_ok\")\ncheck(\"defines luhn_ok\", lambda: callable(f))\ncheck(\"a valid number\", lambda: f(\"4539 3195 0343 6467\") is True)\ncheck(\"one digit changed\", lambda: f(\"4539 3195 0343 6468\") is False)\ncheck(\"79927398713 is valid\", lambda: f(\"79927398713\") is True)\ncheck(\"79927398710 is not\", lambda: f(\"79927398710\") is False)\ncheck(\"0 is valid\", lambda: f(\"0\") is True)\n", "hint": "Reverse the digits, then use enumerate: positions 1, 3, 5... (0-based) get doubled.", "solution": "def luhn_ok(number):\n    digits = number.replace(\" \", \"\")[::-1]\n    total = 0\n    for i, ch in enumerate(digits):\n        d = int(ch)\n        if i % 2 == 1:\n            d *= 2\n            if d > 9:\n                d -= 9\n        total += d\n    return total % 10 == 0\n", "role": "quest", "after": "py06"}], "exam": [{"code": "print(17 // 5, 17 % 5, -17 // 5)", "why": "17 // 5 is 3 with remainder 2. -3.4 rounds down to -4.", "ans": "3 2 -4"}, {"code": "x = [1, 2, 3]\ny = x\ny += [4]\nprint(x)", "why": "`+=` on a list extends it in place, and `y` is the same list as `x`.", "ans": "[1, 2, 3, 4]"}, {"code": "print(\"tram\"[1:3] * 2)", "why": "`[1:3]` is `ra`, repeated twice.", "ans": "rara"}, {"code": "print(sorted({\"b\": 2, \"a\": 1}.items()))", "why": "`.items()` gives pairs; sorted puts them in key order.", "ans": "[('a', 1), ('b', 2)]"}, {"code": "def f(n):\n    if n <= 1:\n        return 1\n    return n * f(n - 1)\n\nprint(f(5))", "why": "Recursive factorial: 5 * 4 * 3 * 2 * 1.", "ans": "120"}, {"code": "print(bool(\"\"), bool(\"0\"), bool(0.0))", "why": "Empty string and zero are falsy; `\"0\"` is a non-empty string, so truthy.", "ans": "False True False"}, {"code": "total = 0\nfor i in range(10):\n    if i == 6:\n        break\n    if i % 2:\n        continue\n    total += i\nprint(total)", "why": "Odd numbers are skipped and the loop stops at 6: 0 + 2 + 4.", "ans": "6"}, {"code": "try:\n    print(int(\"4\") + int(\"x\"))\nexcept ValueError:\n    print(\"bad\")", "why": "`int(\"x\")` raises before print runs.", "ans": "bad"}, {"code": "a = (1, 2, 3)\nprint(a[::-1], len(set(\"banana\")))", "why": "A reversed tuple; `banana` has three distinct letters.", "ans": "(3, 2, 1) 3"}, {"code": "print(f\"{7 / 2:.2f}|{7 // 2:03d}\")", "why": "Two decimals, then an int padded with zeros to width 3.", "ans": "3.50|003"}, {"code": "d = {}\nfor w in \"a b a c a\".split():\n    d[w] = d.get(w, 0) + 1\nprint(max(d, key=d.get), d[\"a\"])", "why": "Counting pattern; `max` with `key=d.get` finds the key with the biggest count.", "ans": "a 3"}, {"code": "nums = [3, 1, 2]\nr = nums.sort()\nprint(r, nums)", "why": "`sort` changes the list in place and returns None.", "ans": "None [1, 2, 3]"}], "project": {"id": "bench", "title": "Boss machine: the Bench Automaton", "kind": "write", "prompt": "The Bench Automaton keeps the Workshop's parts inventory, one line per delivery: `\"name,category,qty\"`. Some lines are damaged. Write `bench_report(lines)` that returns a list of strings:\n\n- one line per category, `\"category: total\"`, ordered by total from highest to lowest, ties in alphabetical order of category;\n- then a final line `\"bad lines: N\"`.\n\nA line is bad if it does not have exactly three comma-separated parts, if the quantity is not a whole number, or if the quantity is negative. Spaces around parts should be ignored (`\" gears , 4\"` is fine) and categories are not case-sensitive (store them in lower case).\n\nExample:\n```\nbench_report([\"bolt,metal,10\", \"cog, Metal ,5\", \"rope,fibre,7\", \"oops\", \"pin,metal,-2\"])\n```\nreturns `[\"metal: 15\", \"fibre: 7\", \"bad lines: 2\"]`.", "starter": "def bench_report(lines):\n    pass\n", "tests": "f = ns.get(\"bench_report\")\ncheck(\"defines bench_report\", lambda: callable(f))\ncheck(\"the example\", lambda: f([\"bolt,metal,10\", \"cog, Metal ,5\", \"rope,fibre,7\", \"oops\", \"pin,metal,-2\"]) == [\"metal: 15\", \"fibre: 7\", \"bad lines: 2\"])\ncheck(\"an empty inventory\", lambda: f([]) == [\"bad lines: 0\"])\ncheck(\"ties in alphabetical order\", lambda: f([\"a,zinc,3\", \"b,brass,3\"]) == [\"brass: 3\", \"zinc: 3\", \"bad lines: 0\"])\ncheck(\"non-numbers and wrong part counts are bad\", lambda: f([\"a,b\", \"a,b,c,d\", \"a,b,two\", \"a,b, 4 \"]) == [\"b: 4\", \"bad lines: 3\"])\ncheck(\"zero is allowed\", lambda: f([\"a,b,0\"]) == [\"b: 0\", \"bad lines: 0\"])\n", "hint": "Parse each line inside try/except ValueError: split on commas, strip each part, unpack three names, int() the quantity, and raise ValueError yourself if it is negative. Accumulate totals in a dict, then sort the items with key (-total, category).", "solution": "def bench_report(lines):\n    totals = {}\n    bad = 0\n    for line in lines:\n        try:\n            name, cat, qty = [p.strip() for p in line.split(\",\")]\n            qty = int(qty)\n            if qty < 0:\n                raise ValueError(\"negative quantity\")\n        except ValueError:\n            bad += 1\n            continue\n        cat = cat.lower()\n        totals[cat] = totals.get(cat, 0) + qty\n    def rank(item):\n        return (-item[1], item[0])\n    report = [f\"{c}: {t}\" for c, t in sorted(totals.items(), key=rank)]\n    report.append(f\"bad lines: {bad}\")\n    return report\n", "role": "project"}}}};
var RUNNER_SRC = "\"\"\"Lime runner: runs student code and checks it. Works in Brython (browser) and CPython (build-time validation).\"\"\"\nimport sys, json, re, time\nfrom io import StringIO\n\ntry:\n    from browser import window\nexcept Exception:\n    window = None\n\nMAX_ITERS = 2000000\nBUDGET = 6.0\n_WHILE = re.compile(r'^([ \\t]*)while[ \\t]+(.+?):[ \\t]*(#.*)?$', re.M)\n\n\nclass _Guard:\n    def __init__(self):\n        self.reset()\n\n    def reset(self):\n        self.n = 0\n        self.t = time.time()\n\n    def __call__(self):\n        self.n += 1\n        if self.n > MAX_ITERS or (self.n % 5000 == 0 and time.time() - self.t > BUDGET):\n            raise RuntimeError(\"Stopped: a loop ran for too long. Does a while loop never end?\")\n        return True\n\n\ndef _prep(code):\n    def sub(m):\n        tail = (\" \" + m.group(3)) if m.group(3) else \"\"\n        return \"%swhile __lime_guard__() and (%s):%s\" % (m.group(1), m.group(2), tail)\n    return _WHILE.sub(sub, code)\n\n\ndef _fmt_error(e):\n    name = e.__class__.__name__\n    msg = str(e)\n    line = None\n    try:\n        tb = e.__traceback__\n        while tb is not None:\n            if tb.tb_frame.f_code.co_filename == \"student\":\n                line = tb.tb_lineno\n            tb = tb.tb_next\n    except Exception:\n        pass\n    if isinstance(e, SyntaxError) and getattr(e, \"lineno\", None):\n        line = e.lineno\n    out = name + (\": \" + msg if msg else \"\")\n    if line:\n        out += \"  (line %s)\" % line\n    return out\n\n\ndef _input(prompt=\"\"):\n    raise RuntimeError(\"input() is not available in Lime. Put the value in a variable instead.\")\n\n\ndef _new_ns(guard):\n    return {\"__name__\": \"__main__\", \"__lime_guard__\": guard, \"input\": _input}\n\n\ndef _run(code, ns):\n    buf = StringIO()\n    old = sys.stdout, sys.stderr\n    sys.stdout = sys.stderr = buf\n    err = None\n    try:\n        exec(compile(_prep(code), \"student\", \"exec\"), ns)\n    e function loadScript(src, ms){
  return new Promise(function(resolve, reject){
    var s = document.createElement('script'), done = false;
    var timer = setTimeout(function(){ if (!done){ done = true; reject(new Error('Timed out loading ' + src)); } }, ms || 60000);
    s.src = src; s.async = true;
    s.onload = function(){ if (!done){ done = true; clearTimeout(timer); resolve(); } };
    s.onerror = function(){ if (!done){ done = true; clearTimeout(timer); reject(new Error('Could not load ' + src)); } };
    document.head.appendChild(s);
  });
}
var Py = {

      window.brython({indexedDB:false});

  function insert(txt){ var s = ta.selectionStart, e = ta.selectionEnd; ta.setRangeText(txt, s, e, 'end'); ta.dispatchEvent(new Event('input')); }

    var v = ta.value, s = ta.selectionStart, ls = v.lastIndexOf('\n', s - 1) + 1;

  }
  ta.addEventListener('input', function(){ fit(); if (o.onInput) o.onInput(ta.value); });

function sceneArt(tid){
  var W = 96, H = 40, t = TBY[tid] || TBY.py, svg = svgEl(W, H, null, '');
  rect(svg, 0, 0, W, H, '#101a0a');
  for (var i = 0; i < 22; i++) rect(svg, (i * 37) % W, (i * 11) % 14, 1, 1, '#4a5a3a');
  var x = 2, seed = tid.length * 7;
  while (x < W - 4){
    var bw = 6 + ((seed * 13 + x) % 8), bh = 10 + ((seed * 7 + x * 3) % 20);
    rect(svg, x, H - bh, bw, bh, t.accent); rect(svg, x, H - bh, bw, 1, '#17230E');

      if (!best || score > best.score) best = Object.assign({score:score}, it);

/* ================= cloud sync when this page runs as a Claude artifact ================= */
var Cloud = {ref:null, status:'off', last:0, writing:false, pending:false, pushedOnce:false};
async function cloudInit(){
  try {
    if (!(window.claude && window.claude.use)) return;
    var res = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    var db = res[0], user = res[1];
    if (!db || !user) return;
    var uid = await user.id(); if (!uid) return;
    Cloud.ref = db.doc('data/users/' + uid + '/progress'); Cloud.status = 'connecting';
    var timer = setTimeout(function(){ if (Cloud.status === 'connecting') Cloud.status = 'slow'; }, 10000);
    Cloud.ref.onSnapshot(function(snap){
      clearTimeout(timer); Cloud.last = Date.now(); Cloud.status = snap.metadata.fromCache ? 'cached' : 'on';
      var d = snap.exists ? snap.data() : null;
      if (d && d.state){
        var merged = mergeState(S, d.state);
        if (!same(merged, S)){ S = merged; persistLocal(); rerenderSoft(); }
        if (!snap.metadata.fromCache && !same(merged, d.state)) cloudPush();
      } else if (!snap.metadata.fromCache && !Cloud.pushedOnce){ cloudPush(); }
      if (!snap.metadata.fromCache) Cloud.pushedOnce = true;
    }, function(){ Cloud.status = 'error'; });
  } catch(e){ Cloud.status = 'off'; }
}
async function cloudPush(){
  if (!Cloud.ref) return;
  if (Cloud.writing){ Cloud.pending = true; return; }
  Cloud.writing = true;
  try { await Cloud.ref.set({v:2, updatedAt:Date.now(), state:JSON.parse(JSON.stringify(S))}); Cloud.last = Date.now(); if (Cloud.status !== 'on') Cloud.status = 'on'; }
  catch(e){ Cloud.status = 'error'; }
  Cloud.writing = false;
  if (Cloud.pending){ Cloud.pending = false; cloudPush(); }
}

    reg.addEventListener('updatefound', function(){
      var nw = reg.installing; if (!nw) return;

    });
    setInterval(function(){ reg.update().catch(function(){}); }, 60 * 60 * 1000);
    document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') reg.update().catch(function(){}); });
