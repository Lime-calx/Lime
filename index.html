 the wrong dose. Which kind of error is it?", "b": "A logic error. Only tests with known answers catch it.", "id": "c0"}, {"f": "Line 1 is `print(\"start\")`; line 5 is missing a closing bracket. Is `start` printed?", "b": "No. A SyntaxError is reported before any line runs.", "id": "c-syntax-first"}, {"f": "A traceback has three `File ...` entries: line 9 in `<module>`, line 4 in `report`, line 2 in `average`. Which line failed, and where do you look for the cause?", "b": "Line 2 (the entry just above the error line) is where it failed. Then walk up: the bad value usually came from a caller, line 4 or line 9.", "id": "c-tb-multi"}, {"f": "`int(\"seven\")` raises which exception, and why not TypeError?", "b": "ValueError: a string is the right type for `int()`, but this string's content cannot be converted.", "id": "c2"}, {"f": "When does the `else` of a try statement run?", "b": "Only when the `try` block raised no exception.", "id": "c3"}, {"f": "`def f():` / `try: return 1` / `finally: print(\"bye\")`. What does `print(f())` show?", "b": "`bye` then `1`: `finally` runs before the function hands back its value.", "id": "c-finally"}, {"f": "What is wrong with `try: avg = sum(fares) / len(fare)` followed by `except: avg = 0`?", "b": "The bare `except` also hides the typo `fare` (a NameError), turning a bug into a believable 0. Catch `ZeroDivisionError` only.", "id": "c4"}, {"f": "How do you stop your own function with a clear error when an age is negative?", "b": "`raise ValueError(\"age cannot be negative\")`. The function stops on that line.", "id": "c5"}, {"f": "Is `if b != 0: r = a / b` EAFP or LBYL?", "b": "LBYL (look before you leap): check first, then act. EAFP would try `a / b` and catch ZeroDivisionError.", "id": "c6"}, {"f": "`a, b = \"1,2,3\".split(\",\")`?", "b": "`ValueError: too many values to unpack`: three parts, two names.", "id": "c-unpack"}, {"f": "A function raises ValueError and has no `except`. Where does the exception go?", "b": "Up to its caller, then that caller's caller, until a matching `except` catches it. If none does, the program stops with a traceback.", "id": "c-pass-out"}, {"f": "Your report is wrong for a 500-line input file. What is the first debugging step?", "b": "Reproduce it with the smallest input that still fails, so every value can be seen.", "id": "c7"}, {"f": "You believe `total` is 30 after the loop, but the answer is wrong. What do you do before changing any code?", "b": "Check the belief: print or assert `total` there. The bug lives where a belief turns out false.", "id": "c-dbg-belief"}, {"f": "A 40-line calculation ends with a wrong value. How do you find where it first goes wrong without checking every line?", "b": "Bisect: print the value halfway. If it is already wrong, search the first half, otherwise the second. Repeat.", "id": "c-dbg-bisect"}, {"f": "You changed three things at once and the bug went away. What is the problem?", "b": "You do not know which change fixed it, or whether another one broke something. Change one thing at a time.", "id": "c-dbg-one"}, {"f": "Your `average(values)` works on `[3, 1, 2]`. Name two other inputs you should test.", "b": "For example the empty list `[]` and a single item `[5]`. Negatives, zeros and duplicates are good too.", "id": "c8"}]}], "tracks": [{"id": "py", "shape": "workshop", "name": "Python foundations", "status": "live", "blurb": "From zero to confident: values, control flow, functions, strings, collections and debugging.", "planned": [], "district": "The Workshop Quarter", "accent": "#8BD122", "ink": "#17230E", "theme": "Say exactly what you mean", "resident": "Wren, tram driver", "boss": "The Bench Automaton"}, {"id": "auto", "shape": "conveyor", "name": "Automation with Python", "status": "planned", "blurb": "Turn boring work into scripts: files, text, spreadsheets, web APIs and scheduled jobs.", "planned": ["Files and folders with pathlib", "Text processing and regular expressions", "CSV, JSON and spreadsheets", "Dates and times", "Talking to web APIs", "Scraping the web politely", "Command-line tools with argparse", "Logging, scheduling and reliability", "Capstone: a monthly rota spreadsheet becomes a shift calendar"], "district": "The Conveyor Works", "accent": "#2BB5A0", "ink": "#0B201C", "theme": "Make the machine do the boring part", "resident": "Foreman Dov", "boss": "The Rota Loom"}, {"id": "js", "shape": "bazaar", "name": "JavaScript and the web", "status": "planned", "blurb": "The language of the browser: functions, objects, the DOM, async code and small web apps.", "planned": ["Values, variables and control flow", "Functions, scope and closures", "Objects, arrays and JSON", "The DOM and events", "Promises, async/await and fetch", "Modules and tooling", "Build a small web app", "Node.js scripts for automation"], "district": "Signal Bazaar", "accent": "#F2C233", "ink": "#231A02", "theme": "Things happen when something happens", "resident": "Mrs Pell, market keeper", "boss": "The Bell Tower Board"}, {"id": "dsa", "shape": "archive", "name": "Algorithms and data structures", "status": "planned", "blurb": "How to think about cost, and the structures and algorithms that every programmer reuses.", "planned": ["Big-O and measuring real programs", "Arrays and linked lists", "Stacks and queues", "Hash tables in depth", "Sorting: insertion, merge, quicksort", "Binary search and divide and conquer", "Trees and binary search trees", "Heaps and priority queues", "Graphs: BFS and DFS", "Shortest paths", "Dynamic programming", "Greedy algorithms and backtracking"], "district": "The Archives", "accent": "#C98B3C", "ink": "#1F1306", "theme": "The shape of your data sets your speed", "resident": "Odo, archivist", "boss": "The Catalogue Engine"}, {"id": "sys", "shape": "foundry", "name": "How computers work", "status": "planned", "blurb": "Bits to operating systems to networks: what really happens when code runs.", "planned": ["Bits, bytes and number representation", "Logic gates to a CPU", "Memory, the stack and the heap", "From source code to machine code", "Processes, threads and scheduling", "Files and filesystems", "Networking: IP, TCP, DNS and HTTP", "Concurrency and parallelism"], "district": "The Foundry", "accent": "#D9593D", "ink": "#200A04", "theme": "Under everything are bits", "resident": "Chief Brass", "boss": "The Governor Valve"}, {"id": "math", "shape": "stair", "name": "Maths for computing", "status": "planned", "blurb": "Just enough maths, just in time: algebra, functions, logs, vectors, matrices, probability and a little calculus, with interactive pictures.", "planned": ["Numbers, powers and logarithms", "Functions and graphs", "Sums, sequences and growth rates", "Vectors", "Matrices and transformations", "Probability basics", "Rates of change: derivatives for programmers", "Gradients and optimisation"], "district": "The Chalk Stair", "accent": "#B8B8A8", "ink": "#1B1B14", "theme": "Just enough maths, just in time", "resident": "The Stair Counter", "boss": "The Stair Counter's puzzle"}, {"id": "theory", "shape": "dome", "name": "Theory and discrete maths", "status": "planned", "blurb": "The ideas under computer science: logic, proofs, counting, automata and computability.", "planned": ["Logic and proof", "Sets, relations and functions", "Counting and probability", "Induction and recursion", "Finite automata and regular languages", "Grammars and parsing", "Turing machines and computability", "Complexity: P and NP"], "district": "The Cloister", "accent": "#7E8FB5", "ink": "#0E1220", "theme": "What can and cannot be computed", "resident": "Sister Quill", "boss": "The Halting Lock"}, {"id": "data", "shape": "tower", "name": "Data analysis and statistics", "status": "planned", "blurb": "Ask questions of data and answer them honestly: cleaning, summarising, charting and inference.", "planned": ["Data types and data literacy", "Descriptive statistics", "Tables: filtering, grouping, joining", "Cleaning messy data", "Visualisation that does not mislead", "Probability distributions", "Sampling and inference", "Regression", "Communicating results"], "district": "The Survey Office", "accent": "#3F8FD9", "ink": "#06121F", "theme": "Numbers lie politely; ask them better", "resident": "Surveyor Hale", "boss": "The Ledger Orrery"}, {"id": "db", "shape": "vault", "name": "Databases and SQL", "status": "planned", "blurb": "Store data reliably and query it well.", "planned": ["The relational model", "SELECT, WHERE and ORDER BY", "Joins", "Aggregation and grouping", "Schema design and normalisation", "Indexes and query plans", "Transactions and ACID", "NoSQL and the trade-offs"], "district": "The Vaults", "accent": "#6C76D6", "ink": "#0A0D26", "theme": "Remember reliably", "resident": "Keeper Ines", "boss": "The Vault Door"}, {"id": "swe", "shape": "hall", "name": "Software engineering", "status": "planned", "blurb": "Working habits that make real programs last: Git, testing, design and review.", "planned": ["Git in depth", "Unit tests and property tests", "Modules and interfaces", "Reading other people's code", "Refactoring", "The shell and command line", "Packaging and dependencies", "Code review and documentation"], "district": "The Guildhall", "accent": "#C27F45", "ink": "#1E1004", "theme": "Build it to be read", "resident": "Guildmaster Rook", "boss": "The Guildmaster's Loom"}, {"id": "ai", "shape": "observatory", "name": "AI and machine learning", "status": "planned", "blurb": "Concepts, the maths behind them, and hands-on practice from linear models to language models.", "planned": ["What AI is and is not", "The linear algebra and calculus you need", "Probability for machine learning", "Linear and logistic regression", "Gradient descent", "Overfitting and honest evaluation", "A neural network from scratch", "Backpropagation", "Convolutional networks and vision", "Sequences, attention and transformers", "Tokens and embeddings", "How large language models are trained", "Prompting and checking model output", "Building with language model APIs", "Retrieval and agents", "Bias, safety and responsible use"], "district": "The Observatory", "accent": "#A774DB", "ink": "#160926", "theme": "Learning from examples", "resident": "Astronomer Vega", "boss": "The Watcher"}, {"id": "sec", "shape": "gate", "name": "Cybersecurity", "status": "planned", "blurb": "Think like an attacker to build defences: cryptography, authentication, web and network security.", "planned": ["Threat modelling", "Hashing and encryption", "Passwords and authentication", "Web security: injection, XSS, CSRF and their defences", "Network security", "Secure coding habits", "Malware concepts, from the defender's side", "Incident response and forensics basics"], "district": "The Walls and Gates", "accent": "#E0566A", "ink": "#26060C", "theme": "Assume it will be attacked", "resident": "Captain Lark", "boss": "The Gatehouse Lock"}, {"id": "game", "shape": "wheel", "name": "Games and graphics", "status": "planned", "blurb": "Build games and draw with code: loops, sprites, physics and the maths of graphics.", "planned": ["The game loop", "Drawing on a 2D canvas", "Sprites and input", "Collision detection", "Simple physics", "Procedural generation", "Vectors and matrices", "3D and shaders, the concepts", "Game AI"], "district": "Carnival Row", "accent": "#EE5FA7", "ink": "#2A0718", "theme": "A loop, a screen, a player", "resident": "Pip, ride operator", "boss": "The Great Wheel"}], "city": {"py01": {"lesson": "py01", "opener": "The tram fare box counts every coin twice. You can count once. Lend it your arithmetic.", "scene": "Wren drives the Number 1 tram round the Workshop Quarter. This morning 13 passengers each paid 7 coins, and the fare box reported 182 coins, 9 full bags of 20 and 2 loose coins. Wren counted the bags by hand: there are 4, and 11 loose coins. Wren hands you the box's program and a cup of oil.\n\n```\n# the fare box's program\nprint(13 * 7 * 2)\nprint(13 * 7 * 2 // 20)\nprint(13 * 7 * 2 % 20)\n```\n\n\"It used to just work,\" Wren says.\n\nNIT clicks from its pigeonholes: \"Everything used to just work. That is how you know someone wrote it. Note the `* 2`: the program does exactly what it says, and it says count twice.\" Your first job below is to write the fare box a correct program.", "jobs": [{"id": "fares", "title": "Count the fare box", "kind": "write", "prompt": "Write the fare box's program again, counting each coin once. Using the names `passengers`, `fare` and `bag`, print three lines: the total number of coins, the number of full bags, and the loose coins left over. For today that is `91`, `4` and `11`. The checker also tries other days, so calculate from the names.", "starter": "passengers = 13\nfare = 7\nbag = 20\n# print total, full bags, loose coins\n", "tests": "check_eq(\"prints 91, 4 and 11 on three lines\", lambda: out.strip().split(\"\\n\"), [\"91\", \"4\", \"11\"],\n         \"Three print calls: total coins first, then full bags, then the leftover.\")\ndef fewer():\n    n2, o2 = rerun(\"passengers = 13\", \"passengers = 9\")\n    return o2.strip().split(\"\\n\")\ncheck_eq(\"works for 9 passengers (63, 3, 3)\", fewer, [\"63\", \"3\", \"3\"],\n         \"Build every line from the names (passengers * fare ...) instead of typing numbers.\")\ndef bigger_bags():\n    n2, o2 = rerun(\"bag = 20\", \"bag = 25\")\n    return o2.strip().split(\"\\n\")\ncheck_eq(\"works for bags of 25 (91, 3, 16)\", bigger_bags, [\"91\", \"3\", \"16\"],\n         \"Full bags is the total // bag; the leftover is the total % bag.\")\n", "hint": "Total: passengers * fare. Full bags: passengers * fare // bag. Leftover: passengers * fare % bag. `*`, `//` and `%` share a rung and run left to right, so no brackets are needed.", "solution": "passengers = 13\nfare = 7\nbag = 20\nprint(passengers * fare)\nprint(passengers * fare // bag)\nprint(passengers * fare % bag)\n", "role": "story"}, {"id": "midnight", "title": "Repair the tower clock", "kind": "fix", "prompt": "The tower clock turns minutes since midnight into hours and minutes. For 1000 minutes it should print `16` then `40`, but the hours come out as `16.666666666666668`. Repair it. The checker also tries other times.", "starter": "minutes = 1000\nprint(minutes / 60)\nprint(minutes % 60)\n", "tests": "check_eq(\"prints 16 then 40\", lambda: out.strip().split(\"\\n\"), [\"16\", \"40\"],\n         \"Hours must be a whole number. Which division drops the fraction?\")\ndef other():\n    n2, o2 = rerun(\"minutes = 1000\", \"minutes = 61\")\n    return o2.strip().split(\"\\n\")\ncheck_eq(\"prints 1 then 1 for 61 minutes\", other, [\"1\", \"1\"],\n         \"Fix the operator and keep calculating from minutes rather than typing the answer.\")\n", "hint": "One operator is wrong. Which division drops the fraction?", "solution": "minutes = 1000\nprint(minutes // 60)\nprint(minutes % 60)\n", "role": "repair"}], "read": [{"id": "r1", "title": "The fare box's spare program", "code": "print(13 * 7 // 20 * 20)\nprint(13 * 7 - 13 * 7 // 20 * 20)\nprint(2 + 2 * 2 ** 2)\nprint(7 / 7, 7 // 7)", "why": "`*`, `//` and `%` share one rung and run left to right: 91 // 20 is 4, times 20 is 80. Then 91 - 80 is 11, which is exactly `91 % 20`. `**` is done first: 2 ** 2 is 4, times 2 is 8, plus 2 is 10. `/` always gives a float (1.0); `//` on two ints gives an int (1), and `print` puts one space between them.", "ans": "80\n11\n10\n1.0 1"}], "parsons": [{"id": "p1", "title": "Furnace readings", "prompt": "Put the lines in order so the program prints a heading, then the average of the three furnace readings 12, 15 and 18 (`15.0`), then the average rounded down (`15`). One line is a decoy that gets the precedence wrong: leave it out.", "lines": ["print(\"Furnace average\")", "print((12 + 15 + 18) / 3)", "print((12 + 15 + 18) // 3)"], "distractors": ["print(12 + 15 + 18 / 3)"], "tests": "check(\"prints the heading, 15.0 and 15 in order\", lambda: out.strip().split(\"\\n\") == [\"Furnace average\", \"15.0\", \"15\"], \"Heading first, then the true division, then the floor division.\")\n", "hint": ""}], "teach": {"prompt": "Explain to Wren, who has never programmed, the difference between `/`, `//` and `%`. Use the fare box (91 coins, bags of 20) as your example.", "model": "`/` divides exactly and always gives a float: 91 / 20 is 4.55. `//` divides and rounds down to a whole number: 91 // 20 is 4 full bags. `%` gives what is left after taking out the whole bags: 91 % 20 is 11 loose coins. They always fit together: 4 * 20 + 11 is 91 again.", "points": ["`/` gives the exact answer as a float (4.55)", "`//` gives the whole number of bags, rounded down (4)", "`%` gives the leftover coins (11)", "bags times 20 plus the leftover is the total again"]}, "terms": [{"term": "interpreter", "def": "The program that reads your Python code, checks it, and carries out its statements one at a time, from top to bottom.", "ex": "Lime runs a Python interpreter inside the page.", "mistake": "Thinking the computer understands what you meant. It only does what the text says.", "card": false, "id": "t0"}, {"term": "expression", "def": "Code that produces a value.", "ex": "`6 * 7` is an expression with the value 42.", "mistake": "Writing an expression alone on a line and expecting it to be shown. Only `print` shows it.", "card": false, "id": "t1"}, {"term": "statement", "def": "A complete instruction that Python carries out.", "ex": "`print(6 * 7)` is a statement; `6 * 7` inside it is an expression.", "mistake": "", "card": true, "q": "What is a statement in Python, and what is an example?", "id": "t2"}, {"term": "operator precedence", "def": "The order in which Python works out an expression: brackets, then `**`, then unary minus (`-x`), then `*` `/` `//` `%`, then `+` `-`. Lesson 3 adds comparisons, then `not`, `and`, `or`.", "ex": "`2 + 3 * 4` is 14, not 20.", "mistake": "Forgetting that `-3 ** 2` is -9, because `**` is done before the minus sign.", "card": false, "id": "t3"}, {"term": "floor division (//)", "def": "Division that rounds down to a whole number (toward the more negative side).", "ex": "`7 // 2` is 3 and `-7 // 2` is -4.", "mistake": "Expecting `-7 // 2` to be -3.", "card": false, "id": "t4"}, {"term": "modulo (%)", "def": "The remainder after floor division: what is left over once the whole groups are taken out.", "ex": "`91 % 20` is 11: 4 bags of 20 make 80, and 11 coins are left.", "mistake": "Using `/` and expecting the leftover: `91 / 20` is 4.55, not 11.", "card": false, "id": "t5"}, {"term": "int", "def": "The whole-number type. A Python int has no size limit.", "ex": "`42`, `-7`, `2 ** 100`.", "mistake": "Writing `3.0` and expecting an int; the decimal point makes it a float.", "card": true, "q": "Is there a largest number a Python int can hold?", "id": "t6"}, {"term": "float", "def": "A number with a decimal point, stored approximately in binary.", "ex": "`3.5`, and `8 / 2` (which is `4.0`).", "mistake": "Expecting `/` to give an int when the answer is whole.", "card": true, "q": "What is a float, and what is `8 / 2`?", "id": "t7"}, {"term": "comment", "def": "Text after `#` that Python skips. Written for humans.", "ex": "`# bags of 20 coins`", "mistake": "Writing a comment that only repeats the code instead of saying why.", "card": false, "id": "t8"}, {"term": "traceback", "def": "Python's report when an error stops a program. Lime shows a short traceback: the line number in your code, with the error type and message on the last line.", "ex": "`ZeroDivisionError: division by zero` on line 2.", "mistake": "Reading only the top of the report. The last line names the error.", "card": false, "id": "t9"}, {"term": "function call", "def": "Running a named piece of code (a function) by writing its name followed by brackets. Values for it go inside the brackets.", "ex": "`print(\"hi\")` calls the function `print` with the value `\"hi\"`.", "mistake": "Leaving out the brackets: `print \"hi\"` is a SyntaxError.", "card": true, "q": "What does it mean to call a function, and how do you write it?", "id": "t-call"}, {"term": "string", "def": "Text inside quotes. Python shows it exactly as written, without the quotes.", "ex": "`\"Hello, Lime!\"`", "mistake": "Leaving out the quotes: `print(Hello)` makes Python look for a name called Hello (a NameError).", "card": true, "q": "What happens if you write `print(Hello)` without quotes?", "id": "t-string"}], "nit_right": ["Correct. `print` put exactly one space between your values; the commas stayed in the code.", "Accepted. `//` rounded down and `%` kept the rest. Together they lose nothing.", "Right. `/` gave a float even though the answer was whole. It always will."]}, "py02": {"lesson": "py02", "opener": "Names are tags tied to objects. The values are the objects. Keep track of which tag is tied to which object.", "scene": "Mrs Pell runs the fruit stall at the corner of Spring Lane. Her till died last winter, so she keeps every price in her head and writes receipts in a hand nobody can read. Her nephew typed the till's program back in from memory, and it crashes at once:\n\n```\napples = \"12\"\npears = 7\ntotal = apples + pears\nprint(\"Total fruit: \" + total)\n```\n\n\"Can your machine write a receipt a person can read?\" she asks.\n\nNIT: \"Heads are not storage. Names are. The delivery note gives `apples` as text, in quotes, and text plus a number is a `TypeError`. Also, her handwriting is a syntax error.\" ", "jobs": [{"id": "tickets", "title": "Wren's ticket line", "kind": "write", "prompt": "Wren sells day tickets. Using the names given, print exactly:\n\n`Wren sold 12 tickets for 54.00 coins`\n\nBuild the line with one f-string, and show the money with two decimal places. Keep the first three lines as they are: the checker changes them to test you.", "starter": "driver = \"Wren\"\nriders = 12\nprice = 4.5\n", "tests": "check_eq(\"prints the exact line\", lambda: out.strip(), \"Wren sold 12 tickets for 54.00 coins\",\n         \"Two decimals: {value:.2f}. Check the spaces and the word order.\")\ncheck(\"uses an f-string\", lambda: has_node(\"JoinedStr\"),\n      \"Put an f straight before the opening quote, then the names inside {}.\")\ndef other():\n    ns2, out2 = rerun(\"riders = 12\", \"riders = 3\")\n    return out2.strip()\ncheck_eq(\"works for 3 riders too\", other, \"Wren sold 3 tickets for 13.50 coins\",\n         \"Calculate riders * price inside the braces instead of typing 54.00.\")\ndef other_driver():\n    ns2, out2 = rerun('driver = \"Wren\"', 'driver = \"Ada\"')\n    return out2.strip()\ncheck_eq(\"works for another driver\", other_driver, \"Ada sold 12 tickets for 54.00 coins\",\n         \"Put {driver} in the text instead of typing Wren.\")\n", "hint": "Put expressions inside the braces: {riders * price:.2f}.", "solution": "driver = \"Wren\"\nriders = 12\nprice = 4.5\nprint(f\"{driver} sold {riders} tickets for {riders * price:.2f} coins\")\n", "role": "story"}, {"id": "pell_total", "title": "Repair Mrs Pell's till", "kind": "fix", "prompt": "This is the till program from the scene. The stall's stock arrives as text from the delivery note, so `apples` is the string `\"12\"`. The till should print `Total fruit: 19` but crashes with a `TypeError`. Repair it without changing the first line: the checker changes it to test you.", "starter": "apples = \"12\"\npears = 7\ntotal = apples + pears\nprint(\"Total fruit: \" + total)\n", "tests": "check_eq(\"prints Total fruit: 19\", lambda: out.strip(), \"Total fruit: 19\",\n         \"Two conversions are needed: text to number for the sum, number to text for the message (or use an f-string).\")\ncheck_eq(\"total is the int 19\", lambda: ns[\"total\"], 19,\n         \"Convert apples with int() before adding, so total is a number.\")\ndef other():\n    n2, o2 = rerun('apples = \"12\"', 'apples = \"30\"')\n    return o2.strip()\ncheck_eq('works when apples is \"30\"', other, \"Total fruit: 37\",\n         \"The data arrives as text. Convert the name apples; do not type the number.\")\n", "hint": "int(apples) turns the text into a number. Then either str(total) or an f-string puts it back into the message.", "solution": "apples = \"12\"\npears = 7\ntotal = int(apples) + pears\nprint(f\"Total fruit: {total}\")\n", "role": "repair"}], "read": [{"id": "r1", "title": "Tags and objects", "code": "a = 5\nb = a\na = a + 1\nprint(a, b)\nc = \"5\"\nprint(c * 2, int(c) * 2)\nprint(type(a / 1), type(a // 1))\ntotal = 0\ntotal += 4\ntotal *= 3\nprint(total)", "why": "`b = a` ties `b` to the value 5. `a = a + 1` makes a new value 6 and moves only the `a` tag, so `b` still shows 5. `*` on a string repeats it (`55`); after `int` it multiplies (10). `/` gives a float even for whole answers; `//` on ints gives an int, and `type()` prints as `<class '...'>`. `+=` and `*=` update: 0 + 4 is 4, times 3 is 12.", "ans": "6 5\n55 10\n<class 'float'> <class 'int'>\n12"}], "parsons": [{"id": "p1", "title": "Swap the gear tags", "prompt": "Order the lines so the two names swap their values through a spare name, then print `copper brass`. One decoy line only pretends to swap: it prints the names in the other order and changes nothing. Leave it out.", "lines": ["left = \"brass\"", "right = \"copper\"", "spare = left", "left = right", "right = spare", "print(left, right)"], "distractors": ["print(right, left)"], "tests": "check(\"prints copper brass\", lambda: out.strip() == \"copper brass\", \"Save one value in spare before you overwrite it, and print only once, at the end.\")\ncheck(\"the names really swapped\", lambda: ns.get(\"left\") == \"copper\" and ns.get(\"right\") == \"brass\", \"Printing in another order does not move any tags; assignment does.\")\n", "hint": ""}], "teach": {"prompt": "Why does `b = a` followed by `a = a + 1` leave `b` unchanged? Explain it with tags tied to objects.", "model": "A name is a tag tied to a value. `b = a` ties a second tag to the same value, 5. `a = a + 1` calculates a new value, 6, and moves the `a` tag onto it. Nothing changed the 5, and the `b` tag is still tied to it. Numbers and strings can never be changed in place (they are immutable), so the only way to 'change' them is to move a tag to a new value.", "points": ["a name is a tag tied to a value, not a box", "`b = a` ties `b` to the same value, 5", "`a + 1` makes a new value; `=` moves only the `a` tag", "ints and strings are immutable, so the 5 itself never changes"]}, "terms": [{"term": "name (variable)", "def": "A tag that refers to a value. Assignment ties it to the value.", "ex": "`price = 4.5`", "mistake": "Thinking `b = a` links the two names forever.", "card": false, "id": "t0"}, {"term": "assignment", "def": "The `=` statement: work out the right side, then tie the name on the left to the result.", "ex": "`total = total + 4`", "mistake": "Reading `=` as 'equals' in the maths sense. It means 'now refers to'.", "card": true, "q": "`total = total + 4` would be false in maths. What does it mean in Python?", "id": "t1"}, {"term": "type", "def": "The kind of value, which decides what operations make sense. `type(x)` tells you.", "ex": "`type(3.0)` prints as `<class 'float'>`.", "mistake": "Thinking `3` and `3.0` are the same type; one is an int, the other a float.", "card": false, "id": "t2"}, {"term": "str", "def": "The text type: a sequence of characters in quotes.", "ex": "`\"brass\"`, `'12'`", "mistake": "Adding `\"12\" + 7`: text and numbers do not mix without conversion.", "card": true, "q": "Is `\"12\"` a number or text, and what is its type called?", "id": "t3"}, {"term": "bool", "def": "The type with exactly two values, `True` and `False`.", "ex": "`0.1 + 0.2 == 0.3` gives the bool `False`.", "mistake": "Writing `true` in lower case: it must be `True`.", "card": true, "q": "What are the only two values of type bool, spelled exactly?", "id": "t4"}, {"term": "f-string", "def": "A string starting with `f` where expressions in `{}` are calculated and inserted, optionally with a format after a colon.", "ex": "`f\"{price:.2f}\"` gives `\"4.50\"`.", "mistake": "Forgetting the `f`, so the braces print literally.", "card": true, "q": "What is an f-string, and what does `f\"{price:.2f}\"` give when price is 4.5?", "id": "t5"}, {"term": "type conversion", "def": "Making a value of one type from another: `int()`, `float()`, `str()`, `bool()`. `int()` only accepts text of a whole number: `int(\"4.5\")` is a ValueError, so use `float()` for decimals.", "ex": "`int(\"12\")` is 12.", "mistake": "`int(\"4.5\")` fails with a ValueError; use `float` first.", "card": true, "q": "What happens with `int(\"4.5\")`?", "id": "t6"}, {"term": "floating-point error", "def": "Floats are stored in binary, so most decimals are approximations.", "ex": "`0.1 + 0.2` is `0.30000000000000004`.", "mistake": "Comparing floats with `==`; use `math.isclose` or a small tolerance instead.", "card": false, "id": "t7"}, {"term": "augmented assignment", "def": "Shorthand that updates a name: `x += 1` means `x = x + 1`.", "ex": "`total = 4`, then `total *= 3` makes total 12.", "mistake": "Writing `x =+ 1`, which just sets x to +1.", "card": true, "q": "`total = 4`, then `total *= 3`. What is total?", "id": "t8"}, {"term": "immutable", "def": "Cannot be changed in place. Ints, floats and strings are immutable: operations make new values.", "ex": "`a = a + 1` makes a new int and moves the tag `a` to it.", "mistake": "Thinking `a + 1` changes the old value for every name tied to it.", "card": true, "q": "What does it mean that an int is immutable?", "id": "t-immutable"}], "nit_right": ["Correct. `=` moved a tag; the old value did not change, because ints are immutable.", "Accepted. `int()` turned the text into a number. `input()` would have handed you text too.", "Right. `round(2.5)` is 2: exact halves go to the even neighbour."]}, "py03": {"lesson": "py03", "opener": "Today: the tram loop, and the station clock. A loop whose condition never changes is a tram that never reaches the depot. Watch your conditions.", "scene": "The Number 1 tram has stopped at Brass Yard and will not leave. Its program says \"while there are stops left, announce the stop\". It announced `Stops left: 5` twenty times, until its safety brake counted the announcements and pulled itself.\n\nWren sighs. \"It's very polite about it.\" Here is the program the tram is running:\n\n```\nstops_left = 5\nannounced = 0\nwhile stops_left > 0:\n    print(\"Stops left:\", stops_left)\n    announced += 1\n    if announced == 20:\n        print(\"Safety brake! Still\", stops_left, \"stops left.\")\n        break\nprint(\"Depot!\")\n```\n\nNIT: \"Politeness is not progress. The condition is checked before every pass, and nothing inside the loop changes `stops_left`. Predict the output, then repair it below. While you are at it, the station clock has said 06:00 for eleven years: it has never had a loop at all.\" ", "jobs": [{"id": "timetable", "title": "Start the station clock", "kind": "write", "prompt": "NIT wires your timetable into the station clock. The first tram leaves at `start_hour`:00 and then every `every` minutes, up to and including `last` minutes after the first. Print each departure as `HH:MM`, one per line. With the values given that is 06:00, 06:15, ... 08:00 (nine lines), and for the first time in eleven years the clock shows something other than 06:00. Keep the three setting lines: the checker changes all of them.", "starter": "start_hour = 6\nevery = 15\nlast = 120\n", "tests": "want = [\"06:00\", \"06:15\", \"06:30\", \"06:45\", \"07:00\", \"07:15\", \"07:30\", \"07:45\", \"08:00\"]\ncheck_eq(\"prints the nine departures\", lambda: out.strip().split(\"\\n\"), want, \"Loop over the minutes after the first tram, then split each into hours (// 60) and minutes (% 60).\")\ncheck(\"uses a loop\", lambda: has_node(\"For\", \"While\"), \"Let a loop produce the lines, so the clock keeps moving whatever the settings.\")\ndef other():\n    ns2, out2 = rerun(\"every = 15\", \"every = 40\")\n    return out2.strip().split(\"\\n\")\ncheck_eq(\"works when trams run every 40 minutes\", other, [\"06:00\", \"06:40\", \"07:20\", \"08:00\"], \"Use every as the step of your range.\")\ndef late():\n    ns2, out2 = rerun(\"start_hour = 6\", \"start_hour = 9\")\n    return out2.strip().split(\"\\n\")\ncheck_eq(\"works when the first tram is at 09:00\", late, [\"09:00\", \"09:15\", \"09:30\", \"09:45\", \"10:00\", \"10:15\", \"10:30\", \"10:45\", \"11:00\"], \"Add start_hour to the hours you work out from the minutes.\")\ndef short():\n    ns2, out2 = rerun(\"last = 120\", \"last = 60\")\n    return out2.strip().split(\"\\n\")\ncheck_eq(\"works when the last tram is 60 minutes after the first\", short, [\"06:00\", \"06:15\", \"06:30\", \"06:45\", \"07:00\"], \"Build the stop from last. To include last itself, stop one past it: last + 1.\")\n", "hint": "range(0, last + 1, every) gives the minutes after the start. For each one, the hour is start_hour + m // 60 and the minute is m % 60. Pad both with :02d.", "solution": "start_hour = 6\nevery = 15\nlast = 120\nfor m in range(0, last + 1, every):\n    hour = start_hour + m // 60\n    minute = m % 60\n    print(f\"{hour:02d}:{minute:02d}\")\n", "role": "story"}, {"id": "stuck_tram", "title": "Repair the stuck tram", "kind": "fix", "prompt": "This is the tram's program from the scene. It should count down the stops to the depot and then print `Depot!`, but nothing inside the loop changes `stops_left`, so the safety brake has to stop it. Repair it so the output is `Stops left: 5` down to `Stops left: 1`, then `Depot!`. Keep the line `stops_left = 5`: the checker changes it.", "starter": "stops_left = 5\nannounced = 0\nwhile stops_left > 0:\n    print(\"Stops left:\", stops_left)\n    announced += 1\n    if announced == 20:\n        print(\"Safety brake! Still\", stops_left, \"stops left.\")\n        break\nprint(\"Depot!\")\n", "tests": "want = [\"Stops left: 5\", \"Stops left: 4\", \"Stops left: 3\", \"Stops left: 2\", \"Stops left: 1\", \"Depot!\"]\ncheck_eq(\"counts down and reaches the depot\", lambda: out.strip().split(\"\\n\"), want, \"The condition is checked again before each pass. What inside the loop should change stops_left?\")\ndef other():\n    ns2, out2 = rerun(\"stops_left = 5\", \"stops_left = 3\")\n    return out2.strip().split(\"\\n\")\ncheck_eq(\"works from 3 stops\", other, [\"Stops left: 3\", \"Stops left: 2\", \"Stops left: 1\", \"Depot!\"], \"Let the loop do the counting; do not print the lines yourself.\")\n", "hint": "Inside the loop, after printing, take one off: stops_left -= 1. The brake can stay; it will never trip.", "solution": "stops_left = 5\nannounced = 0\nwhile stops_left > 0:\n    print(\"Stops left:\", stops_left)\n    stops_left -= 1\n    announced += 1\n    if announced == 20:\n        print(\"Safety brake! Still\", stops_left, \"stops left.\")\n        break\nprint(\"Depot!\")\n", "role": "repair"}], "read": [{"id": "r1", "title": "The fuel gauge", "code": "stops = 0\nfuel = 10\nwhile fuel > 0:\n    fuel -= 3\n    stops += 1\nprint(stops, fuel)\ntotal = 0\nfor i in range(1, 8):\n    if i % 2 == 0:\n        continue\n    if i > 5:\n        break\n    total += i\nprint(total)\nprint(0 or \"spare\", 3 and 0, not \"\")", "why": "Fuel goes 10, 7, 4, 1, -2: the check happens before each pass, so the loop runs 4 times and fuel ends at -2. In the for loop, even numbers are skipped and 7 triggers `break`, so total is 1 + 3 + 5 = 9. `or` returns the first truthy value (`spare`); `and` returns the first falsy one (0); an empty string is falsy, so `not \"\"` is True.", "ans": "4 -2\n9\nspare 0 True"}], "parsons": [{"id": "p1", "title": "Count the inspection days", "prompt": "The tram is inspected on every day number from 1 to 49 that is a multiple of 7. Order the lines to count those days and print the count (`7`). Indentation is already set. Two lines are decoys.", "lines": ["count = 0", "for day in range(1, 50):", "    if day % 7 == 0:", "        count += 1", "print(count)"], "distractors": ["    count = 0", "    print(day)"], "tests": "check(\"prints 7\", lambda: out.strip() == \"7\", \"Start the counter before the loop and print after it.\")\n", "hint": ""}], "teach": {"prompt": "When would you use `while` instead of `for`? Give one tram example of each and say why.", "model": "Use `for` when you know what you are going through before you start: `for stop in range(5)` visits each of 5 stops. Use `while` when you repeat until a condition changes and you don't know how many passes that takes: `while fuel > 0` keeps driving until the tank is empty. The condition is checked before every pass, so a `while` loop needs something inside it that moves toward making the condition false, or it never ends. `while True` with a `break` is the shape for stopping from the middle.", "points": ["for: the items or the count are known before the loop starts", "while: repeat until a condition changes, number of passes unknown", "while checks its condition before every pass", "the body must change what the condition depends on, or the loop never ends"]}, "terms": [{"term": "boolean expression", "def": "An expression whose value is `True` or `False`.", "ex": "`fuel > 0`", "mistake": "", "card": true, "q": "What kind of value does a boolean expression such as `fuel > 0` produce?", "id": "t0"}, {"term": "comparison operators", "def": "`==`, `!=`, `<`, `<=`, `>`, `>=`. They can be chained: `0 < x < 10`. Text compares character by character.", "ex": "`stops == 0`", "mistake": "Comparing numbers stored as text: `\"10\" < \"9\"` is True.", "card": false, "id": "t1"}, {"term": "short-circuit evaluation", "def": "`and` stops at the first falsy value and `or` at the first truthy one; the rest is never run.", "ex": "`0 or \"spare\"` is `\"spare\"`.", "mistake": "Expecting `and`/`or` to always return True or False. They return one of the values.", "card": false, "id": "t2"}, {"term": "truthiness", "def": "Every value counts as true or false in a condition. False: `0`, `0.0`, `\"\"`, `[]`, `{}`, `None`, `False`. Everything else is true.", "ex": "`if name:` is false for an empty name.", "mistake": "`\"0\"` and `\"False\"` are non-empty strings, so they are truthy.", "card": false, "id": "t3"}, {"term": "elif", "def": "Short for \"else if\": a further condition in an if chain, tested only when every branch above it was false. Only the first true branch runs.", "ex": "`if t >= 39: ... elif t >= 38: ...`", "mistake": "Writing several separate `if`s when only one branch should run.", "card": false, "id": "t4"}, {"term": "else", "def": "The last branch of an if chain: it runs when no condition above it was true. It belongs to the `if` directly above it.", "ex": "`if fuel > 0: print(\"go\")` then `else: print(\"refuel\")`", "mistake": "Expecting an `else` to cover an earlier, separate `if`.", "card": false, "id": "t-else"}, {"term": "while loop", "def": "Repeats a block while a condition is true, checking before each pass.", "ex": "`while stops_left > 0:`", "mistake": "Forgetting to change anything the condition depends on: an infinite loop.", "card": false, "id": "t5"}, {"term": "for loop", "def": "Repeats a block once for each item of a sequence, pointing the loop variable at each item in turn.", "ex": "`for day in range(1, 50):`", "mistake": "Expecting `i = 10` inside the body to make the loop skip ahead. The next pass sets i again.", "card": true, "q": "What does a `for` loop do with its loop variable on each pass?", "id": "t6"}, {"term": "range", "def": "`range(start, stop, step)` gives numbers from start up to but not including stop.", "ex": "`range(0, 121, 15)` gives 0, 15, ..., 120.", "mistake": "Expecting the stop value to be included.", "card": false, "id": "t7"}, {"term": "accumulator", "def": "A name that starts empty or at zero before a loop and collects a result during it.", "ex": "`total = 0` then `total += x`", "mistake": "Resetting the accumulator inside the loop.", "card": false, "id": "t8"}, {"term": "break", "def": "Leaves the loop it is in at once. The code after the loop runs next.", "ex": "`if n % 7 == 0: break`", "mistake": "Expecting it to leave an outer loop too: it leaves only the innermost one.", "card": false, "id": "t9"}, {"term": "continue", "def": "Skips the rest of this pass of the loop and starts the next pass.", "ex": "`if n % 2 == 0: continue`", "mistake": "Using it when you meant to stop the loop: that is `break`.", "card": false, "id": "t-continue"}, {"term": "infinite loop", "def": "A loop whose condition never becomes false. Lime tries to stop it after a few seconds; ordinary Python runs until you interrupt it.", "ex": "`while stops_left > 0: print(stops_left)` (nothing changes stops_left)", "mistake": "", "card": true, "q": "What turns a `while` loop into an infinite loop?", "id": "t10"}, {"term": "flag", "def": "A bool that records whether something has happened yet, such as `found = False` before a search and `found = True` when it succeeds.", "ex": "`found = False` ... `if t > 39: found = True`", "mistake": "Resetting the flag inside the loop, so it only reports the last pass.", "card": true, "q": "What is a flag variable used for in a loop?", "id": "t-flag"}, {"term": "running maximum", "def": "A name holding the biggest value seen so far, replaced whenever a bigger one comes along.", "ex": "`best = values[0]` then `if v > best: best = v`", "mistake": "Starting it at 0, which is wrong when every value is negative.", "card": false, "id": "t-runmax"}], "nit_right": ["Correct. `range(5)` stopped before 5, as it always will.", "Matched. `not` runs after `==`, so `not x == 5` asks `not (x == 5)`. I admire its patience.", "Accepted. A loop's `else` runs only when no `break` fired. It is the most literal keyword I know."]}, "py04": {"lesson": "py04", "opener": "Functions are stamps. Carve one carefully and you can press it a thousand times. Carve it badly and you get a thousand mistakes.", "scene": "The Workshop's stamp press makes every brass ticket by hand: same shape, same lettering, fresh effort each time. The apprentices are exhausted. Their fare sheet looks like this, one copy of the rule per passenger:\n\n```\nstops = 3\nprint(min(stops * 2, 12))\nstops = 9\nprint(min(stops * 2, 12))\nstops = 4\nprint(min(stops * 2, 21))\n```\n\nOne copy has a typo nobody noticed: the cap is 21 instead of 12. \"Carve the stamp once,\" says the old press-keeper, \"then press.\" The fare stamp job below carves it: one function, one rule, one place to fix.\n\nNIT: \"This is the most important idea in programming. I would underline it if I had a pen.\" ", "jobs": [{"id": "fare_for", "title": "The fare stamp", "kind": "write", "prompt": "Write `fare_for(stops, day_pass=False)`. A trip costs 2 coins per stop, but never more than 12 coins. Anyone with a day pass pays 0. The function must **return** the fare, not print it.", "starter": "def fare_for(stops, day_pass=False):\n    pass\n", "tests": "f = ns.get(\"fare_for\")\ncheck(\"defines fare_for\", lambda: callable(f), \"Keep the line def fare_for(stops, day_pass=False):\")\ncheck_eq(\"3 stops cost 6\", lambda: silent(f, 3)[0], 6, \"2 coins per stop: stops * 2.\")\ncheck(\"returns rather than prints\", lambda: silent(f, 4) == (8, \"\"), \"Use return. Printing inside the function gives the caller None.\")\ncheck_eq(\"10 stops are capped at 12\", lambda: f(10), 12, \"Use min(...) or an if to cap the fare.\")\ncheck_eq(\"6 and 7 stops both cost 12\", lambda: [f(6), f(7)], [12, 12], \"The cap starts exactly at 6 stops (6 * 2 = 12).\")\ncheck_eq(\"0 and 1 stops\", lambda: [f(0), f(1)], [0, 2], \"Compute from stops; do not list the answers.\")\ncheck_eq(\"a day pass costs 0\", lambda: [f(5, day_pass=True), f(10, True)], [0, 0], \"Check day_pass first and return 0 straight away.\")\n", "hint": "If day_pass is true, return 0. Otherwise return min(stops * 2, 12).", "solution": "def fare_for(stops, day_pass=False):\n    if day_pass:\n        return 0\n    return min(stops * 2, 12)\n", "role": "story"}, {"id": "speed", "title": "Repair the speed gauge", "kind": "fix", "prompt": "This should print `Speed: 24.0 km/h`, but it prints `24.0` and then `Speed: None km/h`. Repair `average_speed` so it gives its result back to the caller.", "starter": "def average_speed(distance, minutes):\n    print(distance / minutes * 60)\n\nspeed = average_speed(12, 30)\nprint(f\"Speed: {speed} km/h\")\n", "tests": "check_eq(\"prints only Speed: 24.0 km/h\", lambda: out.strip(), \"Speed: 24.0 km/h\", \"The function prints its answer instead of handing it back.\")\nf = ns.get(\"average_speed\")\ncheck_eq(\"average_speed(10, 60) returns 10.0\", lambda: silent(f, 10, 60)[0], 10.0, \"Return distance / minutes * 60.\")\ncheck_eq(\"average_speed prints nothing itself\", lambda: silent(f, 10, 60)[1], \"\", \"Remove the print inside the function: the caller prints.\")\n", "hint": "A function without return gives back None. Replace print with return.", "solution": "def average_speed(distance, minutes):\n    return distance / minutes * 60\n\nspeed = average_speed(12, 30)\nprint(f\"Speed: {speed} km/h\")\n", "role": "repair"}], "read": [{"id": "r1", "title": "The press-keeper's notebook", "code": "def press(x, times=2):\n    return x * times\n\ndef bump(n):\n    n = n + 1\n    return n\n\nn = 5\nbump(n)\nprint(n, bump(n))\nprint(press(3), press(\"ab\"), press(2, times=4))\n\ndef countdown(k):\n    if k == 0:\n        return \"go\"\n    return str(k) + \" \" + countdown(k - 1)\n\nprint(countdown(3))", "why": "`bump` has its own local `n`; changing it never touches the outer `n`, and the first call's result is thrown away, so `n` is still 5 and `bump(n)` gives 6. `press` doubles by default: 6, `abab`, and with `times=4` it gives 8. `countdown` calls itself with a smaller `k` until the base case returns `go`, building `3 2 1 go`.", "ans": "5 6\n6 abab 8\n3 2 1 go"}], "parsons": [{"id": "p1", "title": "The speed limiter", "prompt": "Order the lines into a function that lowers the speed to the limit when it is too high and returns it, then prints the results for 40 and 20 with a limit of 30 (`30 20`). Indentation is set. One decoy prints instead of returning.", "lines": ["def safe_speed(speed, limit):", "    if speed > limit:", "        speed = limit", "    return speed", "print(safe_speed(40, 30), safe_speed(20, 30))"], "distractors": ["        print(limit)"], "tests": "check_eq(\"prints 30 20\", lambda: out.strip(), \"30 20\", \"The function must return; only the last line prints.\")\nf = ns.get(\"safe_speed\")\ncheck(\"safe_speed(5, 10) returns 5\", lambda: f is not None and silent(f, 5, 10) == (5, \"\"), \"Below the limit the speed comes back unchanged.\")\n", "hint": "The decoy prints instead of returning: leave it out."}], "teach": {"prompt": "What is the difference between printing a value inside a function and returning it? Use the speed gauge bug to explain why the program printed `None`.", "model": "`print` shows a value on the screen and nothing else: the program cannot use what was printed. `return` hands the value back to whoever called the function, so it can be stored, compared or printed later. `average_speed` printed 24.0 but had no `return`, and every function without one returns `None`. So `speed` was `None`, and the f-string showed it.", "points": ["print shows text to a person; the program cannot use it", "return hands the value back to the caller to store or use", "a function with no return gives back None", "speed was None, so the f-string showed None"]}, "terms": [{"term": "function", "def": "A named, reusable block of code that takes inputs and can give back a result.", "ex": "`def fare_for(stops): ...`", "mistake": "Writing `fare_for` without brackets when you meant to call it: that names the function, it does not run it.", "card": true, "q": "What is a function, in one sentence?", "id": "t0"}, {"term": "parameter", "def": "A name in the function definition that receives a value when the function is called.", "ex": "`stops` in `def fare_for(stops):`", "mistake": "", "card": false, "id": "t1"}, {"term": "argument", "def": "The actual value passed in a call.", "ex": "`3` in `fare_for(3)`", "mistake": "", "card": false, "id": "t2"}, {"term": "return value", "def": "What a call gives back. Without `return`, a function returns `None`.", "ex": "`fare = fare_for(3)` stores the returned 6", "mistake": "Printing inside the function and expecting the caller to receive the value.", "card": false, "id": "t3"}, {"term": "default argument", "def": "A parameter with a value used when the caller leaves it out.", "ex": "`day_pass=False`", "mistake": "Using a list or dict as a default: it is shared between calls (lesson 6).", "card": false, "id": "t4"}, {"term": "keyword argument", "def": "An argument passed by name, so order does not matter and the call reads clearly.", "ex": "`fare_for(5, day_pass=True)`", "mistake": "Putting a positional argument after a keyword one: `f(day_pass=True, 5)` is a SyntaxError.", "card": true, "q": "What is a keyword argument, and why use one?", "id": "t5"}, {"term": "scope", "def": "Where a name can be seen. Names assigned inside a function are local to it.", "ex": "`rate = 20` inside a function does not change the outer `rate`.", "mistake": "Expecting a function to change an outer name by assigning to it.", "card": false, "id": "t6"}, {"term": "docstring", "def": "A string written as the first statement of a function's body. Python keeps it in `name.__doc__`.", "ex": "`\"\"\"Return the fare in coins.\"\"\"` on the line after `def fare_for(stops):`", "mistake": "", "card": false, "id": "t7"}, {"term": "assert", "def": "A statement that raises AssertionError if its condition is false. Used for quick self-checks.", "ex": "`assert fare_for(3) == 6`", "mistake": "", "card": false, "id": "t8"}, {"term": "recursion", "def": "A function that calls itself on a smaller version of the problem.", "ex": "`countdown(k - 1)`", "mistake": "Forgetting the base case, giving RecursionError.", "card": false, "id": "t9"}, {"term": "base case", "def": "The input where a recursive function stops calling itself and returns directly.", "ex": "`if k == 0: return \"go\"`", "mistake": "", "card": false, "id": "t10"}, {"term": "side effect", "def": "Anything a function does that the caller can notice besides returning a value: printing, changing a global name, changing a list it was given.", "ex": "`print(...)` inside a function, or `doses.append(5)`", "mistake": "Hiding a side effect in a function whose name sounds like a calculation.", "card": true, "q": "What counts as a side effect of a function?", "id": "t-side-effect"}, {"term": "pure function", "def": "A function that only uses its arguments and returns a result, with no side effects.", "ex": "`def bmi(w, h): return w / h ** 2`", "mistake": "", "card": false, "id": "t-pure"}, {"term": "local variable", "def": "A name assigned inside a function. It exists only during that call, and each call gets a fresh one.", "ex": "`x` in `def f(): x = 1`", "mistake": "Reading it before it is assigned in the same function: UnboundLocalError.", "card": false, "id": "t-local"}, {"term": "call stack", "def": "The pile of calls that have started but not finished. Each recursive call adds one; Python stops at about 1000 with RecursionError.", "ex": "`fact(3)` waits for `fact(2)`, which waits for `fact(1)`.", "mistake": "", "card": true, "q": "What is the call stack, and what happens when it gets too deep?", "id": "t-stack"}], "nit_right": ["Correct. A function without `return` gives back `None`; yours gave back something better.", "Accepted. Assigning to a name inside a function makes it local for the whole function, which I find tidy.", "Matched. Each recursive call waits for the smaller one, so the calls finish in reverse order."]}, "py05": {"lesson": "py05", "opener": "Strings are rows of characters, numbered from zero. I have always counted from zero. It saves time at the start.", "scene": "Overnight a gust of wind spun every stop sign on the Number 1 line. The sign painter, Juno, has new boards but no idea what codes the old signs carried.\n\n\"There was a pattern,\" Juno says, \"letters and a number. My uncle knew it. The board still runs his program, but the wind shook it about.\" She holds up the old sign for Brass Yard: `BRA10`.\n\nNIT reads the board's program aloud. Predict what it prints before you run it:\n\n```\nname = \"Brass Yard\"\ncode = name[3:].upper() + str(len(name))\nprint(code)\nprint(name.replace(\" \", \"\")[:3])\n```\n\nNIT: \"The slice starts at the cut after the third character instead of stopping there, and nothing removes the space or capitalises the letters it should keep. Your uncle was a string function. Let us rebuild him: the first job writes `stop_code` properly.\" ", "jobs": [{"id": "stop_code", "title": "Stop codes", "kind": "write", "prompt": "Every stop has a code: the first three letters of its name with spaces removed, in capitals, followed by the length of the full name (spaces included). Write `stop_code(name)`.\n\n- `stop_code(\"Brass Yard\")` is `\"BRA10\"`\n- `stop_code(\"A B\")` is `\"AB3\"` (only two letters exist)", "starter": "def stop_code(name):\n    pass\n", "tests": "f = ns.get(\"stop_code\")\ncheck(\"defines stop_code\", lambda: callable(f), \"Start with def stop_code(name):\")\ncheck_eq('\"Brass Yard\"', lambda: f(\"Brass Yard\"), \"BRA10\", \"Letters first, then the length as text: str(len(name)).\")\ncheck_eq('\"Gearwell\"', lambda: f(\"Gearwell\"), \"GEA8\", \"Take the first three with [:3], not everything after them with [3:].\")\ncheck_eq('\"A B\"', lambda: f(\"A B\"), \"AB3\", \"Slicing past the end is safe: it just gives what exists.\")\ncheck_eq('\"o ld mill\"', lambda: f(\"o ld mill\"), \"OLD9\", \"Remove the spaces before taking the first three letters.\")\ncheck_eq('\"quay 12\"', lambda: f(\"quay 12\"), \"QUA7\", \"Count the length of the full name, spaces included.\")\n", "hint": "name.replace(\" \", \"\")[:3].upper() gives the letters; str(len(name)) gives the number.", "solution": "def stop_code(name):\n    letters = name.replace(\" \", \"\")[:3].upper()\n    return letters + str(len(name))\n", "role": "story"}, {"id": "shout", "title": "Repair the sign painter", "kind": "fix", "prompt": "`shout(sign)` should return the sign in capitals with `!` on the end, so `shout(\"tram stop\")` is `\"TRAM STOP!\"`. It returns `\"tram stop!\"`. Repair it.", "starter": "def shout(sign):\n    sign.upper()\n    return sign + \"!\"\n\nprint(shout(\"tram stop\"))\n", "tests": "f = ns.get(\"shout\")\ncheck_eq('shout(\"tram stop\")', lambda: f(\"tram stop\"), \"TRAM STOP!\", \"upper() does not change the string: it returns a new one. Keep it.\")\ncheck_eq('shout(\"a\")', lambda: f(\"a\"), \"A!\")\ncheck_eq('shout(\"Gear 4\")', lambda: f(\"Gear 4\"), \"GEAR 4!\", \"Digits and spaces pass through upper() unchanged.\")\n", "hint": "Strings never change. Keep the result: sign = sign.upper().", "solution": "def shout(sign):\n    sign = sign.upper()\n    return sign + \"!\"\n\nprint(shout(\"tram stop\"))\n", "role": "repair"}], "read": [{"id": "r1", "title": "Juno's sign board", "code": "s = \"clockwork\"\nprint(s[0], s[-1], s[2:5])\nprint(s[::-1][:4])\nprint(s.replace(\"o\", \"0\").count(\"0\"), len(s))\nprint(\"work\" in s, s.find(\"x\"), s.find(\"o\"))\nprint(\"-\".join([\"BRA\", \"GEA\", \"OLD\"]))\nprint(ord(\"A\"), chr(ord(\"A\") + 2))", "why": "Index 0 is `c`, -1 is the last character `k`, and `[2:5]` takes positions 2, 3, 4: `ock`. Reversed, `clockwork` is `krowkcolc`; its first four are `krow`. There are two o's. `in` checks for a substring; `find` returns -1 when missing and the first position otherwise (2). `join` glues the list with the separator. `A` is code 65, and two codes later is `C`.", "ans": "c k ock\nkrow\n2 9\nTrue -1 2\nBRA-GEA-OLD\n65 C"}], "parsons": [{"id": "p1", "title": "Count the vowels on a sign", "prompt": "Order the lines into a function that counts vowels in any capitalisation, then print the count for `Clockwork City` (`3`). Indentation is set. One decoy resets the count in the wrong place.", "lines": ["def count_vowels(text):", "    total = 0", "    for ch in text.lower():", "        if ch in \"aeiou\":", "            total += 1", "    return total", "print(count_vowels(\"Clockwork City\"))"], "distractors": ["        total = 0"], "tests": "check(\"prints 3\", lambda: out.strip() == \"3\")\nf = ns.get(\"count_vowels\")\ncheck('\"AEIOU\" gives 5', lambda: f is not None and f(\"AEIOU\") == 5)\n", "hint": ""}], "teach": {"prompt": "Why does `s[0] = \"X\"` fail, and how do you get a string with a different first letter instead?", "model": "Strings are immutable: once made, their characters can never change, so assigning to a position raises TypeError. Instead you build a new string from pieces and move the name to it: `s = \"X\" + s[1:]`. Methods like `upper()` and `replace()` work the same way: they return a new string and leave the old one alone, which is why you must keep their result.", "points": ["Strings are immutable: a character cannot be replaced in place (TypeError)", "Build a new string from pieces, e.g. `\"X\" + s[1:]`", "Rebind the name to the new string: `s = ...`", "Methods such as upper() and replace() also return new strings, so keep their result"]}, "terms": [{"term": "string", "def": "An immutable sequence of characters.", "ex": "`\"Brass Yard\"` has 10 characters, including the space.", "mistake": "Treating `\"5\"` as the number 5: it is text until you convert it.", "card": true, "id": "t0"}, {"term": "index", "def": "A character's position, counting from 0. Negative indexes count from the end.", "ex": "`\"tram\"[0]` is `\"t\"`, `\"tram\"[-1]` is `\"m\"`.", "mistake": "Using `len(s)` as an index: the last one is `len(s) - 1`.", "card": true, "q": "What is the last valid index of a string `s`, counted from the front?", "id": "t1"}, {"term": "slice", "def": "`s[start:stop:step]` gives a new string from start up to, not including, stop. A slice never raises IndexError; out-of-range ends are cut down to fit.", "ex": "`\"clockwork\"[2:5]` is `\"ock\"`.", "mistake": "Expecting `s[2:5]` to include index 5.", "card": false, "id": "t2"}, {"term": "immutable", "def": "Cannot be changed after creation. Strings, numbers and tuples are immutable.", "ex": "`s[0] = \"X\"` raises TypeError for a string.", "mistake": "Calling `s.upper()` and expecting `s` to change.", "card": false, "id": "t3"}, {"term": "method", "def": "A function attached to a value, called with a dot.", "ex": "`name.replace(\" \", \"\")`", "mistake": "Forgetting the brackets: `name.upper` is the method itself, not its result.", "card": true, "id": "t4"}, {"term": "len", "def": "Built-in that returns how many items a sequence has.", "ex": "`len(\"A B\")` is 3.", "mistake": "", "card": true, "q": "What is `len(\"A B\")`, and why?", "id": "t5"}, {"term": "in (substring)", "def": "`a in b` is True if text `a` appears anywhere in `b`. The empty string is in every string.", "ex": "`\"work\" in \"clockwork\"` is True; `\"\" in \"abc\"` is True too.", "mistake": "Forgetting case: `\"P\" in \"python\"` is False.", "card": true, "q": "What does `\"\" in \"abc\"` give, and why?", "id": "t6"}, {"term": "escape sequence", "def": "A backslash code inside a string: `\\n` new line, `\\t` tab, `\\\\` backslash.", "ex": "`print(\"a\\tb\")` puts a tab between a and b.", "mistake": "Writing a Windows path like `\"C:\\new\"` and getting a new line; use a raw string.", "card": true, "id": "t7"}, {"term": "raw string", "def": "A string prefixed with `r` where backslashes are kept as typed.", "ex": "`r\"C:\\new\"`", "mistake": "", "card": false, "id": "t8"}, {"term": "ord / chr", "def": "`ord` gives a character's Unicode number; `chr` turns a number back into a character.", "ex": "`ord(\"A\")` is 65.", "mistake": "", "card": false, "id": "t9"}, {"term": "Unicode", "def": "The standard that gives every character in every writing system a number.", "ex": "`ord(\"é\")` is 233.", "mistake": "Assuming every letter is between a and z: `\"é\".isalpha()` is True.", "card": true, "q": "Why does `\"é\".islower()` give True, and why does that matter for a 26-letter cipher?", "id": "t10"}, {"term": "repr", "def": "The precise text form of a value, made for programmers: strings get quotes and escapes are spelled out. Lists show their items this way.", "ex": "`repr(\"a\\n\")` shows `'a\\n'`, quotes included.", "mistake": "Reading the quotes in `['a']` as part of the text.", "card": false, "id": "t-repr"}, {"term": "partition", "def": "`s.partition(sep)` splits at the first `sep` and returns a tuple of three parts: before, sep, after.", "ex": "`\"a=b=c\".partition(\"=\")` is `('a', '=', 'b=c')`.", "mistake": "Using `split(\"=\")` and unpacking into two names: `\"a=b=c\"` gives three pieces and the unpacking fails.", "card": true, "q": "What does `\"a=b=c\".partition(\"=\")` give?", "id": "t-partition"}], "nit_right": ["Correct. A slice's stop is a cut, not a character: `s[:3]` ends before index 3.", "Accepted. `upper()` gave you a new string. The old one is exactly as it was, as strings always are.", "Right. `\"Z\" < \"a\"` because 90 is less than 97. I compare codes, never alphabets."]}, "py06": {"lesson": "py06", "opener": "Mrs Pell keeps her sales on scraps of paper. A list is a better scrap: ordered, growable, and it does not blow away.", "scene": "Mrs Pell tips a biscuit tin of paper scraps onto the counter. Each scrap is one hour's takings, in order from opening time. \"I want to know my best hours,\" she says, \"and I want to stop losing scraps.\"\n\nHer nephew already tried. This is his program. Predict both lines before you run it:\n\n```\nsales = [12, 0, 7, 30, 7, 15]\nbest = sales\nbest.sort(reverse=True)\nprint(best[:2])\nprint(sales)\n```\n\nNIT: \"Two faults. It answers with amounts, when she asked for hours. And `best = sales` copied nothing: `sort()` reordered the one list both names share, so the record of which hour took what is gone. This is the beginning of a ledger. Ledgers are the beginning of everything. Banks. Archives. Arguments. The first job fixes both faults.\" ", "jobs": [{"id": "best_hours", "title": "Mrs Pell's best hours", "kind": "write", "prompt": "`sales[i]` is what Mrs Pell took in hour `i`. Write `best_hours(sales, n)` that returns a list of the `n` hours with the biggest sales, biggest first. When two hours tie, the earlier hour comes first. Do not change the list you are given.\n\n- `best_hours([12, 0, 7, 30, 7, 15], 2)` is `[3, 5]`\n- `best_hours([5, 5, 1], 2)` is `[0, 1]`", "starter": "def best_hours(sales, n):\n    pass\n", "tests": "f = ns.get(\"best_hours\")\ncheck(\"defines best_hours\", lambda: callable(f), \"Start with def best_hours(sales, n):\")\ncheck_eq(\"top 2 of [12, 0, 7, 30, 7, 15]\", lambda: f([12, 0, 7, 30, 7, 15], 2), [3, 5], \"Return hour numbers (positions), not the sales amounts.\")\ncheck_eq(\"top 3 of the same\", lambda: f([12, 0, 7, 30, 7, 15], 3), [3, 5, 0], \"Biggest first, then slice off the first n.\")\ncheck_eq(\"ties keep the earlier hour first\", lambda: f([5, 5, 1], 2), [0, 1], \"Sorting is stable: hours with equal sales keep their original order, earlier first, as long as the key is only the sales.\")\ncheck_eq(\"ties further down\", lambda: f([7, 9, 7, 7], 3), [1, 0, 2])\ncheck_eq(\"n larger than the day\", lambda: f([4, 6], 5), [1, 0], \"Slicing past the end is safe: you get every hour.\")\ndef untouched():\n    s = [3, 1, 2]\n    f(s, 2)\n    return s == [3, 1, 2]\ncheck(\"does not change the list\", untouched, \"sorted() returns a new list; list.sort() changes the old one, which is what lost the scraps.\")\n", "hint": "Sorting is stable: ties keep their original order. Sort the hour numbers, `range(len(sales))`, by their sales with a key such as `lambda h: sales[h]` and `reverse=True` (or the key `-sales[h]`), then slice the first n.", "solution": "def best_hours(sales, n):\n    hours = sorted(range(len(sales)), key=lambda h: sales[h], reverse=True)\n    return hours[:n]\n", "role": "story"}, {"id": "restock", "title": "Repair the restock", "kind": "fix", "prompt": "`restock` should return a new shelf with the item added, leaving the original alone. It changes the morning shelf too. The program should print `['apple', 'pear']` then `['apple', 'pear', 'fig']`. Repair `restock`.", "starter": "def restock(shelf, item):\n    shelf.append(item)\n    return shelf\n\nmorning = [\"apple\", \"pear\"]\nevening = restock(morning, \"fig\")\nprint(morning)\nprint(evening)\n", "tests": "check_eq(\"prints the two shelves\", lambda: out.strip().split(\"\\n\"), [\"['apple', 'pear']\", \"['apple', 'pear', 'fig']\"], \"shelf and morning are two names for one list, so append changes the morning shelf too.\")\nf = ns.get(\"restock\")\ndef untouched():\n    s = [\"a\"]\n    r = f(s, \"b\")\n    return s == [\"a\"] and r == [\"a\", \"b\"]\ncheck(\"leaves its argument unchanged\", untouched, \"Build a new list (shelf + [item]) instead of changing shelf. Note that shelf += [item] would still change it.\")\n", "hint": "Build a new list: return shelf + [item], or copy first with shelf[:].", "solution": "def restock(shelf, item):\n    return shelf + [item]\n\nmorning = [\"apple\", \"pear\"]\nevening = restock(morning, \"fig\")\nprint(morning)\nprint(evening)\n", "role": "repair"}], "read": [{"id": "r1", "title": "Two names, one tin", "code": "a = [1, 2]\nb = a\nc = a[:]\nb.append(3)\nc.append(4)\nprint(a, b, c)\nprint(a is b, a is c, a == [1, 2, 3])\nt = (5, 6)\nx, y = t\nprint(y, x, len(a + c))\nprint([n * n for n in range(5) if n % 2 == 1])\nprint(list(zip(\"ab\", [1, 2, 3])))", "why": "`b = a` makes a second name for the same list, so appending through `b` shows in `a`. `a[:]` is a copy, so `c` changes alone. `is` asks 'same object?', `==` asks 'same contents?'. Unpacking puts 5 in x and 6 in y. `a + c` has 3 + 3 items. The comprehension squares the odd numbers 1 and 3. `zip` stops at the shorter input.", "ans": "[1, 2, 3] [1, 2, 3] [1, 2, 4]\nTrue False True\n6 5 6\n[1, 9]\n[('a', 1), ('b', 2)]"}], "parsons": [{"id": "p1", "title": "A running total", "prompt": "Order the lines to build a running total of Mrs Pell's hourly sales and print it: `[12, 12, 19, 49]`. Indentation is set. Two decoys are placed wrongly.", "lines": ["sales = [12, 0, 7, 30]", "running = []", "total = 0", "for s in sales:", "    total += s", "    running.append(total)", "print(running)"], "distractors": ["    running = []", "    running.append(s)"], "tests": "check(\"prints [12, 12, 19, 49]\", lambda: out.strip() == \"[12, 12, 19, 49]\")\n", "hint": ""}], "teach": {"prompt": "Using Mrs Pell's list of sales, explain aliasing: when do two names share one list, and how do you make a real copy?", "model": "Assignment never copies. `b = a` attaches a second name to the same list, so `b.append(...)` changes what `a` shows too, and passing a list to a function does the same: the parameter is another name for the caller's list. To get a separate list, make one: `a[:]`, `list(a)` or `a.copy()` (a shallow copy), or build a new list with `+` or a comprehension.", "points": ["Assignment never copies: `b = a` gives one list two names", "A parameter is another name for the caller's list, so changes inside a function show outside", "Copy with `a[:]`, `list(a)`, `a.copy()`, or build a new list with `+` or a comprehension", "Copies are shallow: inner lists are still shared (use `copy.deepcopy` for nested data)"]}, "terms": [{"term": "list", "def": "An ordered, mutable sequence written in square brackets.", "ex": "`[12, 0, 7]`", "mistake": "Expecting `print(sales)` to show strings without quotes: a list shows its items with repr.", "card": true, "id": "t0"}, {"term": "tuple", "def": "An ordered, immutable sequence written with commas, usually in brackets. Its items cannot be replaced, but a mutable item inside it (such as a list) can still change.", "ex": "`(5, 6)`; `t = ([1],)` then `t[0].append(2)` works.", "mistake": "Writing `(5)` for a one-item tuple; it needs a comma: `(5,)`.", "card": true, "id": "t1"}, {"term": "mutable", "def": "Can be changed in place. Lists, dicts and sets are mutable.", "ex": "`nums[0] = 99` changes the list `nums` itself.", "mistake": "Thinking `x = 5; x += 1` changes the number 5: ints are immutable, the name just moves.", "card": true, "q": "Which of these can be changed in place: str, list, tuple, int?", "id": "t2"}, {"term": "append / extend", "def": "`append` adds one item; `extend` adds every item of another sequence.", "ex": "`[1].extend([2, 3])` gives `[1, 2, 3]`.", "mistake": "`a.append([1, 2])` adds one item that is a list.", "card": false, "id": "t3"}, {"term": "sort vs sorted", "def": "`list.sort()` changes the list and returns None; `sorted(x)` returns a new list.", "ex": "`sorted([3, 1])` is `[1, 3]`.", "mistake": "`a = a.sort()` sets `a` to None.", "card": false, "id": "t4"}, {"term": "key function", "def": "A function given to sorting that turns each item into the value to sort by.", "ex": "`sorted(words, key=len)`", "mistake": "Writing `key=len()` with brackets: pass the function, do not call it.", "card": true, "q": "In `sorted(words, key=len)`, why is it `len` and not `len()`?", "id": "t5"}, {"term": "alias", "def": "A second name for the same object.", "ex": "`b = a`", "mistake": "Expecting a copy.", "card": false, "id": "t6"}, {"term": "shallow copy", "def": "A new outer list that holds the same inner objects.", "ex": "`a[:]`, `a.copy()`", "mistake": "Copying a list of lists and expecting the inner lists to be separate.", "card": false, "id": "t7"}, {"term": "list comprehension", "def": "A compact expression that builds a list from a loop and optional condition.", "ex": "`[n * n for n in range(5) if n % 2]`", "mistake": "", "card": false, "id": "t8"}, {"term": "zip", "def": "Pairs items from several sequences, stopping at the shortest. A zip can be walked only once.", "ex": "`list(zip(\"ab\", [1, 2]))` is `[('a', 1), ('b', 2)]`.", "mistake": "Reusing a zip after a loop has used it up.", "card": false, "id": "t9"}, {"term": "unpacking", "def": "Assigning the items of a sequence to several names at once.", "ex": "`x, y = (5, 6)`", "mistake": "Unpacking into the wrong number of names raises ValueError: `a, b = [1, 2, 3]`.", "card": true, "q": "What happens with `a, b = [1, 2, 3]`?", "id": "t10"}, {"term": "lambda", "def": "A small unnamed function written in one expression: `lambda arguments: result`.", "ex": "`sorted(words, key=lambda w: w[-1])`", "mistake": "Writing `return` inside a lambda: the expression after the colon is returned automatically.", "card": false, "id": "t-lambda"}, {"term": "stable sort", "def": "A sort that keeps items with equal keys in their original order. Python's sorts are stable.", "ex": "`sorted([\"pear\", \"fig\", \"kiwi\"], key=len)` keeps pear before kiwi.", "mistake": "Expecting ties to be broken alphabetically without asking for it.", "card": false, "id": "t-stable"}, {"term": "deep copy", "def": "A copy of a nested structure where the inner objects are copied too, so nothing is shared.", "ex": "`import copy` then `copy.deepcopy(grid)`", "mistake": "Using `grid.copy()` on a list of lists and expecting the rows to be separate.", "card": false, "id": "t-deepcopy"}, {"term": "import / module", "def": "`import name` loads a module, a file of ready-made tools, so you can use them as `name.tool`.", "ex": "`import copy` then `copy.deepcopy(x)`", "mistake": "Calling `deepcopy(x)` without the `copy.` prefix after `import copy`.", "card": true, "q": "After `import copy`, how do you call its `deepcopy` function?", "id": "t-import"}, {"term": "identity (is)", "def": "`a is b` is True when both names refer to the very same object; `==` only compares contents.", "ex": "`[1] == [1]` is True but `[1] is [1]` is False.", "mistake": "Using `is` to compare values such as numbers or strings; use `==`.", "card": true, "q": "`[1] == [1]` and `[1] is [1]`: which is True?", "id": "t-is"}], "nit_right": ["Correct. `b = a` gave the list a second name. I have filed both names on the same card.", "Accepted. `sorted` handed you a new list and left the old one exactly as it was.", "Right. Equal keys kept their places. Sorting in Python is stable, which is more than I can say for the tin."]}, "py07": {"lesson": "py07", "opener": "The Archives have lent the Workshop a card index: keys on the front, values on the back. Treat it gently. It is older than me.", "scene": "Mrs Pell's tin now holds a week of scraps: each one says what she sold and for how much. She wants to know what earns her the most.\n\n\"Plums,\" she says. \"I am always selling plums.\" Her nephew wrote her a little program to prove it:\n\n```\nscraps = [(\"plum\", 1), (\"fig\", 9), (\"plum\", 1), (\"apple\", 4), (\"plum\", 1)]\ncounts = {}\nfor item, coins in scraps:\n    counts[item] = counts.get(item, 0) + 1\nprint(counts)\n```\n\nIt does say plums: three scraps. But it counts **scraps**, not **coins**, and the fig sold once for 9.\n\nNIT: \"Feelings are not a data structure. A dictionary is. Although this one is answering a different question from the one you asked.\" ", "jobs": [{"id": "ledger", "title": "Mrs Pell's ledger", "kind": "write", "prompt": "Each record is a tuple `(item, coins)`. Write two functions:\n\n- `totals_by_item(records)` returns a dictionary of item to **total coins** (not the number of scraps).\n- `best_seller(records)` returns the item with the largest total. If totals tie, return the one that comes first alphabetically. For no records, return `None`.\n\nRemember that `max` keeps the first of equal values, so the order of the keys you give it decides ties.", "starter": "def totals_by_item(records):\n    pass\n\ndef best_seller(records):\n    pass\n", "tests": "t = ns.get(\"totals_by_item\")\nb = ns.get(\"best_seller\")\nweek = [(\"apple\", 4), (\"plum\", 3), (\"apple\", 2), (\"fig\", 6), (\"plum\", 3)]\nscraps = [(\"plum\", 1), (\"fig\", 9), (\"plum\", 1), (\"apple\", 4), (\"plum\", 1)]\ncheck(\"defines both functions\", lambda: callable(t) and callable(b))\ncheck_eq(\"totals for the week\", lambda: t(week), {\"apple\": 6, \"plum\": 6, \"fig\": 6}, \"Add the coins: totals[item] = totals.get(item, 0) + coins.\")\ncheck_eq(\"the scene's scraps add coins, not scraps\", lambda: t(scraps), {\"plum\": 3, \"fig\": 9, \"apple\": 4}, \"Add `coins`, not 1.\")\ncheck_eq(\"no records give an empty dict\", lambda: t([]), {})\ncheck_eq(\"the fig earns most\", lambda: b(scraps), \"fig\")\ncheck_eq(\"a three-way tie gives apple\", lambda: b(week), \"apple\", \"Give max the keys in alphabetical order: max(sorted(totals), key=totals.get).\")\ncheck_eq(\"a tie between pear and lime gives lime\", lambda: b([(\"pear\", 5), (\"lime\", 2), (\"lime\", 3)]), \"lime\", \"The tie-break is alphabetical, not first-seen.\")\ncheck_eq(\"no records give None\", lambda: b([]), None, \"An empty dictionary has no best key: check for it before calling max.\")\ncheck(\"does not change the records\", lambda: (lambda r: (b(r), r)[1] == [(\"fig\", 1)])([(\"fig\", 1)]))\n", "hint": "Counting pattern: totals[item] = totals.get(item, 0) + coins. For the best seller, reuse totals_by_item; if it is empty return None; otherwise max(sorted(totals), key=totals.get) gives the alphabetically first of the largest.", "solution": "def totals_by_item(records):\n    totals = {}\n    for item, coins in records:\n        totals[item] = totals.get(item, 0) + coins\n    return totals\n\ndef best_seller(records):\n    totals = totals_by_item(records)\n    if not totals:\n        return None\n    return max(sorted(totals), key=totals.get)\n", "role": "story"}, {"id": "riders", "title": "Repair the rider counter", "kind": "fix", "prompt": "`unique_riders(names)` should count how many **different** people rode today. It counts every ride instead, so a regular who rides twice is counted twice. Repair it so that it stays fast when thousands of different people ride: keep the riders you have seen in a set.", "starter": "def unique_riders(names):\n    riders = []\n    for n in names:\n        riders.append(n)\n    return len(riders)\n", "tests": "f = ns.get(\"unique_riders\")\nuses_set = uses_call(\"set\") or has_node(\"Set\", \"SetComp\")\ncheck(\"defines unique_riders\", lambda: callable(f))\ncheck_eq(\"Wren, Juno, Wren gives 2\", lambda: f([\"Wren\", \"Juno\", \"Wren\"]), 2, \"A set keeps only one of each.\")\ncheck_eq(\"nobody gives 0\", lambda: f([]), 0)\ncheck_eq(\"case matters: Ada and ada are different\", lambda: f([\"Ada\", \"ada\"]), 2)\ncheck(\"keeps the riders in a set\", lambda: uses_set, \"`if n not in riders` on a list scans every rider seen so far: with 5000 riders that is millions of steps. A set jumps straight to the answer.\")\ncheck_eq(\"5000 different riders over 10000 rides\", lambda: f([\"rider%d\" % (i % 5000) for i in range(10000)]) if uses_set else \"skipped until a set is used\", 5000, \"Every rider rode twice: count each once.\")\n", "hint": "Use a set instead of a list: riders = set(), riders.add(n). Or simply len(set(names)).", "solution": "def unique_riders(names):\n    return len(set(names))\n", "role": "repair"}], "read": [{"id": "r1", "title": "The borrowed card index", "code": "stock = {\"gear\": 3, \"spring\": 0}\nstock[\"gear\"] += 2\nstock[\"bolt\"] = stock.get(\"bolt\", 0) + 1\nprint(stock)\nprint(len(stock), \"spring\" in stock, stock.get(\"nut\"))\nseen = {3, 1, 3, 2}\nprint(len(seen), sorted(seen))\na = {\"x\", \"y\", \"z\"}\nb = {\"y\", \"z\", \"w\"}\nprint(sorted(a & b), sorted(a - b), len(a | b))\nprint({k: v * 2 for k, v in stock.items() if v})", "why": "`+=` updates the existing key, and `get` with a default creates `bolt` safely. A dict remembers insertion order. `in` checks keys, so `spring` is there even though its value is 0, and a missing key with `get` gives None. A set keeps one of each, so {3, 1, 3, 2} has 3 items. `&` is shared items, `-` is in a but not b, `|` is everything (4). The comprehension skips `spring` because 0 is falsy.", "ans": "{'gear': 5, 'spring': 0, 'bolt': 1}\n3 True None\n3 [1, 2, 3]\n['y', 'z'] ['x'] 4\n{'gear': 10, 'bolt': 2}"}], "parsons": [{"id": "p1", "title": "Group the stops by letter", "prompt": "Order the lines into a function that groups stop names by their first letter, then print the result for three stops. Indentation is set. One decoy resets the groups inside the loop.", "lines": ["def by_letter(names):", "    groups = {}", "    for name in names:", "        key = name[0]", "        if key not in groups:", "            groups[key] = []", "        groups[key].append(name)", "    return groups", "print(by_letter([\"Bell\", \"Brass\", \"Cog\"]))"], "distractors": ["        groups = {}"], "tests": "check(\"prints the grouped dict\", lambda: out.strip() == \"{'B': ['Bell', 'Brass'], 'C': ['Cog']}\")\n", "hint": ""}], "teach": {"prompt": "Explain why `x in a_set` stays fast for a million items while `x in a_list` gets slow. What does that mean for the rider counter?", "model": "A list has no idea where an item is, so `in` checks items one by one: a million items can mean a million checks. A set (and a dict's keys) stores each item at a place worked out from its hash, so Python jumps straight to where it would be: about the same speed for ten items or a million. That is also why set items and dict keys must be hashable: if an item could change, its hash would change and Python would look in the wrong place. The rider counter only needs 'have I seen this person?', which is exactly what a set is built for.", "points": ["`in` on a list checks items one by one (O(n))", "A set or dict computes the item's hash and jumps to its slot (about constant time)", "So items and keys must be hashable: their hash cannot change", "The rider counter only asks 'seen before?', so a set fits"]}, "terms": [{"term": "dictionary", "def": "A mutable mapping from unique keys to values, kept in insertion order.", "ex": "`{\"
