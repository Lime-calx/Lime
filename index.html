ime = None\n# search for a divisor; use for ... else\n", "tests": "def ref(k):\n    for d in range(2, k):\n        if k % d == 0:\n            return False\n    return True\ncheck_eq(\"97 is prime\", lambda: ns[\"is_prime\"], True, \"Set is_prime = True in the loop's else block (it runs only if no break happened).\")\nfor k in (2, 9, 91, 13):\n    check_eq(\"works for n = %d\" % k, lambda k=k: rerun(\"n = 97\", \"n = %d\" % k)[0][\"is_prime\"], ref(k), \"A divisor d means n % d == 0. For 2, range(2, 2) is empty, so the else runs and 2 is prime.\")\ndef _nodes(n, acc):\n    acc.append(n)\n    try:\n        d = vars(n)\n    except TypeError:\n        d = {}\n    if not d and hasattr(n, \"_fields\"):\n        d = {k: getattr(n, k, None) for k in n._fields}\n    for k, v in list(d.items()):\n        if not k.startswith(\"_\"):\n            for x in (v if isinstance(v, list) else [v]):\n                if hasattr(x, \"_fields\"):\n                    _nodes(x, acc)\n    return acc\ndef has_for_else():\n    import ast\n    fors = [x for x in _nodes(ast.parse(code), []) if type(x).__name__ == \"For\"]\n    return len([x for x in fors if getattr(x, \"orelse\", None)]) > 0\ncheck(\"uses for ... else\", has_for_else, \"Put else: at the same indentation as the for, not the if.\")\n", "hint": "`for d in range(2, n):` then `if n % d == 0:` set is_prime = False and break. Under the for (same indentation as for), `else:` sets is_prime = True.", "solution": "n = 97\nis_prime = None\nfor d in range(2, n):\n    if n % d == 0:\n        is_prime = False\n        break\nelse:\n    is_prime = True\n"}, {"id": "largest", "title": "Warmest reading, no max()", "kind": "write", "prompt": "Find the highest value in the list `readings` and leave it in `highest`, using a loop and a running maximum, without `max()` or `sorted()`. Keep the `readings = ...` line: the checker changes it, including to a freezer where every reading is below zero.", "starter": "readings = [36.8, 38.4, 37.1, 39.0, 37.6]\nhighest = 0\n# loop over readings and keep the highest so far\n", "tests": "def other(line):\n    return rerun(\"readings = [36.8, 38.4, 37.1, 39.0, 37.6]\", line)[0][\"highest\"]\ncheck_eq(\"highest is 39.0\", lambda: ns[\"highest\"], 39.0, \"Each pass: if the reading is bigger than highest, replace highest.\")\ncheck_eq(\"works when the highest comes first\", lambda: other(\"readings = [40.1, 36.0, 37.5]\"), 40.1, \"Compare every reading, including the first.\")\ncheck_eq(\"works when every reading is negative\", lambda: other(\"readings = [-21, -18, -25]\"), -18, \"Starting highest at 0 is the bug: 0 beats every negative reading. Start from readings[0].\")\ncheck(\"no max() or sorted()\", lambda: not uses_call(\"max\") and not uses_call(\"sorted\"), \"Do it with the loop: that is the pattern being practised.\")\n", "hint": "Set `highest = readings[0]` before the loop, then `for r in readings:` and `if r > highest: highest = r`.", "solution": "readings = [36.8, 38.4, 37.1, 39.0, 37.6]\nhighest = readings[0]\nfor r in readings:\n    if r > highest:\n        highest = r\n"}, {"id": "repeat", "title": "First doubled letter", "kind": "write", "prompt": "Find the first letter in `text` that is the same as the letter just before it, and leave it in `repeat`. If there is none, `repeat` stays `None`. For `\"bookkeeper\"` the answer is `\"o\"`, not `\"k\"` or `\"e\"`: stop at the first one with `break`. Keep the `text = ...` line: the checker changes it.", "starter": "text = \"bookkeeper\"\nrepeat = None\n# remember the previous letter as you loop\n", "tests": "def other(t):\n    return rerun('text = \"bookkeeper\"', \"text = %r\" % t)[0][\"repeat\"]\ncheck_eq('\"bookkeeper\" gives \"o\"', lambda: ns[\"repeat\"], \"o\", \"Keep a name prev for the letter before; if ch == prev you found a double.\")\ncheck_eq('\"abcdd\" gives \"d\"', lambda: other(\"abcdd\"), \"d\", \"Compare each letter with the one before it.\")\ncheck_eq('\"lime\" gives None', lambda: other(\"lime\"), None, \"Leave repeat as None when no letter repeats.\")\ncheck_eq('\"aabb\" gives \"a\"', lambda: other(\"aabb\"), \"a\", \"Stop at the first double: break as soon as you find it.\")\ncheck(\"uses break\", lambda: has_node(\"Break\"), \"Leave the loop with break once you have the answer.\")\n", "hint": "Start `prev = None`. In `for ch in text:`, if `ch == prev`, set repeat = ch and break. At the end of each pass set `prev = ch`.", "solution": "text = \"bookkeeper\"\nrepeat = None\nprev = None\nfor ch in text:\n    if ch == prev:\n        repeat = ch\n        break\n    prev = ch\n"}, {"id": "digits", "title": "Digit sum", "kind": "write", "prompt": "Add up the digits of the whole number `n` and leave the answer in `total`. For 4096 that is 4 + 0 + 9 + 6 = 19. Work with numbers: `n % 10` is the last digit and `n // 10` drops it. Keep the line `n = 4096`: the checker changes it.", "starter": "n = 4096\ntotal = 0\n# peel off the last digit until nothing is left\n", "tests": "def ref(k):\n    s = 0\n    while k > 0:\n        s += k % 10\n        k = k // 10\n    return s\ncheck_eq(\"total is 19 for 4096\", lambda: ns[\"total\"], 19, \"Each pass: add n % 10 to total, then n = n // 10.\")\nfor k in (7, 1000000, 98765):\n    check_eq(\"works for n = %d\" % k, lambda k=k: rerun(\"n = 4096\", \"n = %d\" % k)[0][\"total\"], ref(k), \"Loop while n > 0, so it works for any number of digits.\")\ncheck(\"uses % and //\", lambda: has_node(\"Mod\") and has_node(\"FloorDiv\"), \"Use the arithmetic: % 10 gives the last digit, // 10 removes it.\")\n", "hint": "`while n > 0:` then `total += n % 10` and `n = n // 10`.", "solution": "n = 4096\ntotal = 0\nwhile n > 0:\n    total += n % 10\n    n = n // 10\n"}], "predict": [{"code": "for i in range(4, 13, 4):\n    print(i)", "why": "`range(4, 13, 4)` starts at 4 and steps by 4: 4, 8, 12. The next would be 16, which is past the stop.", "id": "p0", "traps": {"4\n8": "12 is below the stop 13, so it is included; only values at or past the stop are left out."}, "ans": "4\n8\n12"}, {"code": "print(bool(\"\"), bool(\"0\"), bool([]), bool(None))", "why": "Only the non-empty string `\"0\"` is truthy. Empty string, empty list and None are falsy.", "id": "p1", "traps": {"False False False False": "\"0\" is a string with one character in it, so it is truthy; only the empty string is falsy."}, "ans": "False True False False"}, {"code": "x = 0\nprint(not x == 5, (not x) == 5)", "why": "`not` runs after `==`, so `not x == 5` is `not (0 == 5)`, which is `not False`: True. With brackets, `not x` is `not 0`, which is True, and `True == 5` is False.", "id": "p2", "traps": {"False False": "`not` binds more loosely than `==`: `not x == 5` means `not (x == 5)`.", "True True": "With the brackets, `not x` is evaluated first: True, and True is not equal to 5."}, "ans": "True False"}, {"code": "print(\"\" or \"guest\", 5 and 0, None or 0)", "why": "`or` returns the first truthy value, or the last value if none is truthy: `guest`, then `0` (None is falsy, so it moves on to 0). `and` returns the first falsy value: 0.", "id": "p3", "traps": {"guest False False": "`and` and `or` return one of the values they looked at, not a new True or False.", "True False False": "`and` and `or` return one of the values they looked at, not a new True or False."}, "ans": "guest 0 0"}, {"code": "total = 0\nfor n in range(1, 5):\n    if n == 3:\n        continue\n    total += n\nprint(total)", "why": "`continue` skips the rest of the pass for n = 3 only, so the total is 1 + 2 + 4 = 7.", "id": "p4", "traps": {"3": "That would be `break`. `continue` skips only this pass and goes on with n = 4.", "10": "`continue` jumps over `total += n` when n is 3, so 3 is never added."}, "ans": "7"}, {"code": "print(True or False and False)", "why": "`and` runs before `or`: `False and False` is False, then `True or False` is True.", "id": "p-and-or", "traps": {"False": "`and` binds tighter than `or`, so this is `True or (False and False)`, not `(True or False) and False`."}, "ans": "True"}, {"code": "print(\"Zebra\" < \"apple\", \"10\" < \"9\", 10 < 9)", "why": "Strings compare by character codes from the left. Capital Z comes before lower-case a, and the character \"1\" comes before \"9\". Only the real numbers compare by size.", "id": "p-strcmp", "traps": {"False False False": "Text compares character by character by code: every capital comes before every lower-case letter, and \"1\" < \"9\" decides \"10\" < \"9\".", "False True False": "Every capital letter has a smaller code than every lower-case letter, so \"Z\" < \"a\"."}, "ans": "True True False"}, {"code": "for i in range(5, 2):\n    print(i)\nprint(\"end\")", "why": "The stop (2) is already below the start (5), and the step is the default +1, so the range is empty and the body never runs.", "id": "p-range-empty", "traps": {"5\n4\n3\nend": "range only counts down with a negative step: range(5, 2, -1). With the default step it is empty."}, "ans": "end"}, {"code": "for i in range(4):\n    if i == 1:\n        i = 3\n    print(i)", "why": "Reassigning `i` changes it only for the rest of that pass. The `for` takes the next value from the range anyway: 0, then 3 (changed), then 2, then 3.", "id": "p-loopvar", "traps": {"0\n3": "Changing i does not make the loop skip ahead: the for loop gives i the next value of the range each pass."}, "ans": "0\n3\n2\n3"}, {"code": "for a in range(3):\n    for b in range(3):\n        if b == 1:\n            break\n        print(a, b)", "why": "`break` leaves only the inner loop. The outer loop carries on, so each `a` prints once with b = 0.", "id": "p-break-inner", "traps": {"0 0": "break ends only the innermost loop; the outer loop still runs for a = 1 and a = 2."}, "ans": "0 0\n1 0\n2 0"}, {"code": "t = 38.5\nif t >= 38:\n    print(\"fever\")\nif t >= 39:\n    print(\"high fever\")\nelse:\n    print(\"normal\")", "why": "These are two separate `if` statements. The first prints fever. The `else` belongs only to the second `if`, and 38.5 is below 39, so it prints normal too.", "id": "p-elif-vs-if", "traps": {"fever": "The else belongs to the second if only. The first if does not stop the second test from running."}, "ans": "fever\nnormal"}, {"code": "for n in range(2, 5):\n    if n == 7:\n        break\nelse:\n    print(\"no break\")\nprint(n)", "why": "7 never comes up, so the loop ends normally and its `else` runs. The loop variable keeps its last value, 4.", "id": "p-forelse", "traps": {"4": "A loop's else runs when the loop finishes without break, which is what happened here.", "no break\n5": "range(2, 5) stops before 5, and n keeps the last value it was given: 4."}, "ans": "no break\n4"}], "cards": [{"f": "What does the chained comparison `1 < x < 10` mean?", "b": "`1 < x and x < 10`, evaluated with x only once.", "id": "c0"}, {"f": "`=` versus `==`?", "b": "`=` assigns a value to a name. `==` compares two values and gives a bool.", "id": "c1"}, {"f": "What does `0 or \"fallback\"` evaluate to, and why?", "b": "`\"fallback\"`. `or` returns the first truthy value it meets, or the last value if none is truthy.", "id": "c2"}, {"f": "Which numbers are falsy in Python?", "b": "Only zero: `0` and `0.0`. Every other number, even `-1`, is truthy.", "id": "c3"}, {"f": "What is wrong with `if x == 1 or 2:`?", "b": "It parses as `(x == 1) or 2`, and 2 is always truthy, so it is always true. Write `x == 1 or x == 2` or `x in (1, 2)`.", "id": "c4"}, {"f": "In an if/elif chain, which branch runs?", "b": "Only the first one whose condition is true, so put the most specific tests first.", "id": "c5"}, {"f": "How many numbers does `range(2, 10)` give?", "b": "8: the numbers 2 to 9. The stop is never included.", "id": "c6"}, {"f": "When do you choose `while` over `for`?", "b": "When you do not know the number of repetitions in advance and loop until a condition changes.", "id": "c7"}, {"f": "A loop `for n in range(5):` has the body `if n == 2: break` followed by `print(n)`. What does it print?", "b": "`0` then `1`. `break` leaves the loop at once when n is 2, before 2 is printed.", "id": "c8"}, {"f": "What is wrong? `for n in range(1, 4):` has the body `total = 0` then `total += n`, and `print(total)` comes after the loop.", "b": "The accumulator is reset every pass, so it prints 3, not 6. Put `total = 0` before the loop.", "id": "c9"}, {"f": "A loop `for n in range(5):` has the body `if n == 2: continue` followed by `print(n)`. What does it print?", "b": "`0`, `1`, `3`, `4`. `continue` skips only the rest of the pass where n is 2.", "id": "c-continue"}, {"f": "Is `bool(\"0\")` True or False?", "b": "True. `\"0\"` is a non-empty string, and only the empty string is falsy.", "id": "c-truthy-str"}, {"f": "What does `\"10\" < \"9\"` give, and why?", "b": "True. Text compares character by character, and `\"1\"` comes before `\"9\"`. Convert with `int()` to compare as numbers.", "id": "c-strcmp"}, {"f": "How does Python read `not x == 5`?", "b": "As `not (x == 5)`: comparisons run before `not`.", "id": "c-not-prec"}, {"f": "What does `True or False and False` give?", "b": "True. `and` runs before `or`, so it is `True or (False and False)`.", "id": "c-and-or"}, {"f": "When does the `else` of a `for` loop run?", "b": "When the loop finishes without a `break`. A `break` skips it.", "id": "c-forelse"}, {"f": "In two nested loops, what does a `break` in the inner loop leave?", "b": "Only the inner loop. The outer loop carries on with its next pass.", "id": "c-break-inner"}, {"f": "How do you test whether `x` is None?", "b": "`x is None` (or `x is not None`), rather than `x == None`.", "id": "c-is-none"}, {"f": "Why start a running maximum at the first value instead of 0?", "b": "If every value is negative, 0 would beat them all and the answer would be wrong.", "id": "c-running-max"}, {"f": "After `for i in range(3): ...` finishes, what is `i`?", "b": "2, the last value it was given. The loop variable survives the loop.", "id": "c-loopvar"}]}, {"id": "py04", "track": "py", "n": 4, "title": "Functions", "minutes": 70, "summary": "Defining and calling functions, parameters, return values, scope, pure functions and side effects, recursion, and testing with assert.", "goals": ["Write functions with parameters, defaults and return values", "Explain the difference between print and return", "Predict which names a function can see and change", "Write a recursive function with a correct base case, and know when a loop is better", "Test a function with assert before trusting it"], "blocks": [{"t": "h", "x": "Why functions"}, {"t": "p", "x": "A **function** is a named, reusable piece of code. Functions let you give a name to an idea, test it once, and use it many times. You have already called functions such as `print` and `type`. Now you write your own."}, {"t": "h", "x": "Defining and calling"}, {"t": "code", "x": "def greet(name):\n    return \"Hello, \" + name + \"!\"\n\nmessage = greet(\"Ada\")\nprint(message)\nprint(greet(\"Grace\"))"}, {"t": "p", "x": "`def` defines the function, and nothing inside it runs until it is **called**. `name` is a **parameter**: a name for an input. `\"Ada\"` is an **argument**: the actual value passed in. `return` ends the function at once and hands a value back to the caller."}, {"t": "note", "k": "trap", "x": "`print` and `return` are different. `print` shows text to a person and gives back nothing. `return` hands a value back to the program so it can be stored or used. A function with no `return` gives back `None`."}, {"t": "code", "x": "def show_square(x):\n    print(x * x)\n\ndef square(x):\n    return x * x\n\na = show_square(4)\nb = square(4)\nprint(a, b)"}, {"t": "p", "x": "Functions that return values **compose**: `square(square(3))` works because the inner call produces a value for the outer one. A function that only prints cannot be used that way."}, {"t": "h", "x": "Early and multiple returns"}, {"t": "p", "x": "A function can have several `return` statements. The first one reached ends the call, so later lines never run. This lets you handle the special cases first and leave the normal case at the bottom, without deep `else` nesting."}, {"t": "code", "x": "def triage(heart_rate):\n    if heart_rate < 40:\n        return \"too slow\"\n    if heart_rate > 130:\n        return \"too fast\"\n    return \"in range\"\n\nprint(triage(35), triage(150), triage(72))"}, {"t": "h", "x": "Parameters: positional, keyword and default"}, {"t": "code", "x": "def power(base, exponent=2):\n    return base ** exponent\n\nprint(power(5))\nprint(power(2, 10))\nprint(power(exponent=3, base=4))"}, {"t": "p", "x": "Arguments can be passed by position or by keyword. A parameter with a **default value** becomes optional, and parameters with defaults must come after those without."}, {"t": "h", "x": "Returning more than one value"}, {"t": "code", "x": "def min_max(numbers):\n    return min(numbers), max(numbers)\n\nlow, high = min_max([4, 9, 2, 7])\nprint(low, high)"}, {"t": "p", "x": "This really returns one **tuple**, `(2, 9)`, which the caller unpacks into two names. Lists and tuples get a full lesson soon. For now, a list is written `[4, 9, 2, 7]`, and `min`, `max`, `sum` and `len` all work on it."}, {"t": "h", "x": "Scope: where a name lives"}, {"t": "p", "x": "Names created inside a function are **local**: they exist only while the function runs. A function can *read* names defined outside it, but assigning inside creates a new local name instead of changing the outer one."}, {"t": "code", "x": "rate = 10\n\ndef double_rate():\n    rate = 20          # a new local name\n    return rate * 2\n\nprint(double_rate())\nprint(rate)"}, {"t": "note", "k": "model", "x": "Inside a function, Python looks a name up first among the function's own **local** names, then among the **global** names of the program, then among the **built-in** names such as `print` and `len`. Each call gets fresh locals, so a function that depends only on its arguments is easy to reason about, test and reuse."}, {"t": "p", "x": "Python decides which names are local **before** the function runs: if a name is assigned anywhere in the function, it is local everywhere in that function. Reading it before the assignment is then an error, even though a global with that name exists."}, {"t": "code", "x": "count = 5\n\ndef show():\n    print(count)   # count is assigned below, so it is local here too\n    count = 0\n\nshow()"}, {"t": "p", "x": "That is an `UnboundLocalError`: the local `count` has no value yet. The fix is to use a different name, or better, to pass the value in and return the new one. (Python has a `global count` statement that lets a function assign to the outer name, but it makes code hard to follow; prefer returning a value.)"}, {"t": "code", "x": "def add_one(x):\n    x = x + 1\n    return x\n\nn = 1\nadd_one(n)\nprint(n)"}, {"t": "p", "x": "The function changed its own local `x`, never the caller's `n`, and the returned value was thrown away because nothing stored it."}, {"t": "note", "k": "deep", "x": "The full rule is called **LEGB**: Local, Enclosing, Global, Built-in. \"Enclosing\" matters only when you define a function inside another function: the inner one can read the outer one's local names. For example, inside `def outer(): unit = \"mg\"` a nested `def label(x): return str(x) + unit` can see `unit`. You will rarely need this early on."}, {"t": "h", "x": "Lists passed to functions"}, {"t": "p", "x": "A parameter is just another name for the caller's value. With numbers and text that never matters, because they cannot be changed in place. A list can be: `lst.append(x)` adds `x` to the end of that very list. (`append` is a *method*, a function attached to a value and called after a dot; lesson 5 covers methods.) `lst + [x]` instead builds a **new** list."}, {"t": "code", "x": "def add_in_place(doses):\n    doses.append(5)          # changes the caller's list\n\ndef add_new(doses):\n    doses = doses + [5]      # points the local name at a new list\n    return doses\n\nmine = [10]\nadd_in_place(mine)\nprint(mine)\nresult = add_new(mine)\nprint(mine, result)"}, {"t": "p", "x": "So \"a function cannot change the caller's variable\" is true for **assignment**, but a function can change the list it was given. When that is not what the caller expects, it is a bug that is hard to find. Lesson 6 explores this in depth."}, {"t": "h", "x": "Pure functions and side effects"}, {"t": "p", "x": "A **pure function** only reads its arguments and returns a result: same inputs, same output, nothing else touched. Anything else a function does that the caller can notice, such as printing, changing a global name or changing a list it was given, is a **side effect**. Programs need some side effects, but keep them in a few clear places. Pure functions are the easiest to test."}, {"t": "code", "x": "def bmi(weight_kg, height_m):          # pure: returns, touches nothing\n    return weight_kg / height_m ** 2\n\ndef report(weight_kg, height_m):       # side effect: printing\n    print(f\"BMI {bmi(weight_kg, height_m):.1f}\")\n\nreport(70, 1.75)\nprint(bmi(70, 1.75) == bmi(70, 1.75))"}, {"t": "h", "x": "Docstrings and testing with assert"}, {"t": "p", "x": "A **docstring** is a string written as the first statement of a function's body. It documents what the function does, and Python keeps it with the function: in ordinary Python, `is_leap.__doc__` gives the text back and `help(is_leap)` shows it, which is how editors show you what a function does. (Lime's in-browser Python drops docstrings to save space, so here `__doc__` shows `None`.) `assert condition` raises an `AssertionError` when the condition is false, which makes a tiny test: silence means it passed."}, {"t": "code", "x": "def is_leap(year):\n    \"\"\"Return True if year is a leap year in the Gregorian calendar.\"\"\"\n    return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)\n\nassert is_leap(2024)\nassert not is_leap(1900)\nassert is_leap(2000)\nprint(\"all tests passed\")"}, {"t": "note", "k": "tip", "x": "Write the `assert` lines first, then the function. Seeing a test fail before it passes proves the test can actually fail. Test the edges: for a cut-off at 50, try 49 and 50, not just 20 and 80."}, {"t": "h", "x": "Functions are values"}, {"t": "p", "x": "A function is an object like any other: you can store it in a variable and pass it to another function, without the brackets. This is what makes tools such as `sorted(items, key=...)` possible. Below, `abs` is the built-in function that gives a number's size without its sign: `abs(-7)` is 7."}, {"t": "code", "x": "def apply_twice(func, value):\n    return func(func(value))\n\ndef triple(x):\n    return x * 3\n\nprint(apply_twice(triple, 2))\nprint(apply_twice(abs, -7))"}, {"t": "h", "x": "Recursion: a function that calls itself"}, {"t": "p", "x": "A recursive function solves a problem by solving a smaller version of the same problem. It needs a **base case** that stops the recursion and a **recursive case** that moves toward it."}, {"t": "code", "x": "def factorial(n):\n    if n <= 1:                    # base case\n        return 1\n    return n * factorial(n - 1)   # recursive case\n\nprint(factorial(5))\nprint(factorial(20))"}, {"t": "p", "x": "Each call waits for the smaller call to finish before it carries on. Lines before the recursive call run on the way down; lines after it run on the way back up, in reverse order."}, {"t": "code", "x": "def descend(n):\n    if n == 0:\n        return            # a bare return ends the call (and returns None)\n    print(\"down\", n)\n    descend(n - 1)\n    print(\"up\", n)\n\ndescend(3)"}, {"t": "p", "x": "Recursion can also be very wasteful. The obvious recursive Fibonacci, `fib(n - 1) + fib(n - 2)`, recomputes the same values again and again. This pure function counts how many calls it would make:"}, {"t": "code", "x": "def calls(n):\n    if n < 2:\n        return 1\n    return 1 + calls(n - 1) + calls(n - 2)\n\nprint(calls(10), calls(20))"}, {"t": "note", "k": "trap", "x": "Forget the base case, or never move toward it, and calls pile up until Python raises `RecursionError`. For plain counting a loop is usually simpler and faster. Recursion shines on naturally nested problems, such as folders inside folders, which you will meet later."}, {"t": "note", "k": "deep", "x": "Every waiting call takes a slot on the **call stack**, and Python limits its depth to about 1000 calls by default. So `factorial(3000)` raises `RecursionError` even though the function is correct; a loop has no such limit."}], "exercises": [{"id": "is_even", "title": "is_even", "kind": "write", "prompt": "Write `is_even(n)` that returns `True` when `n` is even and `False` otherwise. It must also work for negative numbers.", "starter": "def is_even(n):\n    # return True or False\n    pass\n", "tests": "f = ns.get(\"is_even\")\ncheck(\"defines is_even\", lambda: callable(f), \"Use def is_even(n):\")\ncheck_eq(\"is_even(4) is True\", lambda: f(4), True, \"Return a bool, not print it: n % 2 == 0 is already True or False.\")\ncheck_eq(\"is_even(7) is False\", lambda: f(7), False, \"An odd number leaves remainder 1 when divided by 2.\")\ncheck_eq(\"is_even(0) is True\", lambda: f(0), True, \"0 % 2 is 0, so 0 is even.\")\ncheck_eq(\"is_even(-4) is True\", lambda: f(-4), True, \"Remainders of negative numbers still work with n % 2.\")\ncheck_eq(\"is_even(-3) is False\", lambda: f(-3), False, \"In Python -3 % 2 is 1, so the same test works.\")\ncheck_eq(\"works for other numbers\", lambda: [f(k) for k in (12, 31, 1000001, -100)], [True, False, False, True], \"Compute the answer from n; do not list cases.\")\n", "hint": "`return n % 2 == 0`", "solution": "def is_even(n):\n    return n % 2 == 0\n"}, {"id": "clamp", "title": "clamp", "kind": "write", "prompt": "Write `clamp(x, lo, hi)` that returns `lo` if `x` is below `lo`, `hi` if `x` is above `hi`, and `x` otherwise.", "starter": "def clamp(x, lo, hi):\n    pass\n", "tests": "f = ns.get(\"clamp\")\ncheck(\"defines clamp\", lambda: callable(f), \"Use def clamp(x, lo, hi):\")\ncheck_eq(\"clamp(5, 0, 10) is 5\", lambda: f(5, 0, 10), 5, \"Inside the range, give x back unchanged.\")\ncheck_eq(\"clamp(-3, 0, 10) is 0\", lambda: f(-3, 0, 10), 0, \"Below lo, return lo.\")\ncheck_eq(\"clamp(99, 0, 10) is 10\", lambda: f(99, 0, 10), 10, \"Above hi, return hi.\")\ncheck_eq(\"clamp(0.5, 0, 1) is 0.5\", lambda: f(0.5, 0, 1), 0.5, \"Return x itself, not a rounded version.\")\ncheck_eq(\"clamp(10, 0, 10) is 10\", lambda: f(10, 0, 10), 10, \"x equal to hi is allowed.\")\ncheck_eq(\"clamp(36, 37, 42) is 37\", lambda: f(36, 37, 42), 37, \"Use the parameters lo and hi, not fixed numbers.\")\n", "hint": "Use early returns: if x < lo return lo; if x > hi return hi; otherwise return x.", "solution": "def clamp(x, lo, hi):\n    if x < lo:\n        return lo\n    if x > hi:\n        return hi\n    return x\n"}, {"id": "greet", "title": "Defaults and keywords", "kind": "write", "prompt": "Write `greet(name, greeting=\"Hello\")` that returns text like `Hello, Ada!`. It must work with the default, with a second positional argument and with keyword arguments.", "starter": "def greet(name, greeting=\"Hello\"):\n    pass\n", "tests": "f = ns.get(\"greet\")\ncheck(\"defines greet\", lambda: callable(f), 'Keep the line def greet(name, greeting=\"Hello\"):')\ncheck_eq('greet(\"Ada\") is \"Hello, Ada!\"', lambda: f(\"Ada\"), \"Hello, Ada!\", \"Return the text; mind the comma, the space and the !.\")\ncheck_eq('greet(\"Ada\", \"Hi\") is \"Hi, Ada!\"', lambda: f(\"Ada\", \"Hi\"), \"Hi, Ada!\", \"Use the greeting parameter, not the fixed word Hello.\")\ncheck_eq(\"keyword arguments work\", lambda: f(greeting=\"Yo\", name=\"Bo\"), \"Yo, Bo!\", \"Keywords match by name, so the order of the call does not matter.\")\n", "hint": "Build the text with an f-string: `f\"{greeting}, {name}!\"`.", "solution": "def greet(name, greeting=\"Hello\"):\n    return f\"{greeting}, {name}!\"\n"}, {"id": "spread", "title": "spread", "kind": "write", "prompt": "Write `spread(numbers)` that returns the largest number minus the smallest number in a list. `spread([4, 9, 2, 7])` is 7.", "starter": "def spread(numbers):\n    pass\n", "tests": "f = ns.get(\"spread\")\ncheck(\"defines spread\", lambda: callable(f), \"Use def spread(numbers):\")\ncheck_eq(\"spread([4, 9, 2, 7]) is 7\", lambda: f([4, 9, 2, 7]), 7, \"max(numbers) - min(numbers).\")\ncheck_eq(\"spread([5]) is 0\", lambda: f([5]), 0, \"With one number the largest and smallest are the same.\")\ncheck_eq(\"works with negatives\", lambda: f([-3, -10, 4]), 14, \"4 - (-10) is 14.\")\ncheck_eq(\"works with decimals\", lambda: f([36.5, 38.0, 37.0]), 1.5, \"Do not round: return the difference as it is.\")\n", "hint": "`max(numbers) - min(numbers)`", "solution": "def spread(numbers):\n    return max(numbers) - min(numbers)\n"}, {"id": "cube", "title": "Fix print versus return", "kind": "fix", "prompt": "`cube(3) + 1` should be 28, but this function prints its answer and returns `None`. Fix it so it returns the cube and prints nothing.", "starter": "def cube(x):\n    print(x * x * x)\n", "tests": "f = ns.get(\"cube\")\ncheck(\"defines cube\", lambda: callable(f), \"Keep def cube(x):\")\ncheck_eq(\"cube(3) returns 27\", lambda: silent(f, 3)[0], 27, \"The function must return the value, not print it.\")\ncheck_eq(\"cube(3) prints nothing\", lambda: silent(f, 3)[1], \"\", \"Remove the print: the caller decides whether to show the result.\")\ncheck_eq(\"cube(2) + 1 is 9\", lambda: silent(f, 2)[0] + 1, 9, \"A returned value can be used in arithmetic; None cannot.\")\ncheck_eq(\"cube(-2) is -8\", lambda: silent(f, -2)[0], -8, \"Multiply x by itself three times (or use x ** 3).\")\n", "hint": "Replace print(...) with return ...", "solution": "def cube(x):\n    return x * x * x\n"}, {"id": "grade", "title": "Grade with early returns", "kind": "write", "prompt": "Write `grade(score)` for a score from 0 to 100. It returns `\"distinction\"` for 90 and above, `\"pass\"` for 50 and above, and `\"fail\"` below 50. Use early returns, and test the cut-offs: 49 and 50, 89 and 90.", "starter": "def grade(score):\n    pass\n", "tests": "f = ns.get(\"grade\")\ncheck(\"defines grade\", lambda: callable(f), \"Use def grade(score):\")\ncheck_eq(\"grade(49) is fail\", lambda: f(49), \"fail\", \"49 is below the pass mark of 50.\")\ncheck_eq(\"grade(50) is pass\", lambda: f(50), \"pass\", \"50 itself passes: use >= 50, not > 50.\")\ncheck_eq(\"grade(89) is pass\", lambda: f(89), \"pass\", \"89 is below the distinction mark.\")\ncheck_eq(\"grade(90) is distinction\", lambda: f(90), \"distinction\", \"90 itself is a distinction: use >= 90. Test the highest band first.\")\ncheck_eq(\"grade(100) and grade(0)\", lambda: [f(100), f(0)], [\"distinction\", \"fail\"], \"The ends of the range must work too.\")\ncheck(\"returns, does not print\", lambda: silent(f, 70)[1] == \"\", \"Return the word; do not print it.\")\ndef _nodes(n, acc):\n    acc.append(n)\n    try:\n        d = vars(n)\n    except TypeError:\n        d = {}\n    if not d and hasattr(n, \"_fields\"):\n        d = {k: getattr(n, k, None) for k in n._fields}\n    for k, v in list(d.items()):\n        if not k.startswith(\"_\"):\n            for x in (v if isinstance(v, list) else [v]):\n                if hasattr(x, \"_fields\"):\n                    _nodes(x, acc)\n    return acc\ndef returns():\n    import ast\n    return len([x for x in _nodes(ast.parse(code), []) if type(x).__name__ == \"Return\"])\ncheck(\"uses early returns\", lambda: returns() >= 2, \"Return as soon as you know the answer: one return per band, highest band first.\")\n", "hint": "if score >= 90: return \"distinction\". if score >= 50: return \"pass\". Then return \"fail\".", "solution": "def grade(score):\n    if score >= 90:\n        return \"distinction\"\n    if score >= 50:\n        return \"pass\"\n    return \"fail\"\n"}, {"id": "pure", "title": "Make it pure", "kind": "fix", "prompt": "`add_visit` changes a global counter, a side effect. Rewrite it as a pure function: `add_visit(count)` takes the current count and returns the new one, with no `global`. Then use it so the program still prints `2`.", "starter": "visits = 0\n\ndef add_visit():\n    global visits\n    visits = visits + 1\n\nadd_visit()\nadd_visit()\nprint(visits)\n", "tests": "f = ns.get(\"add_visit\")\ncheck(\"defines add_visit\", lambda: callable(f), \"Keep the name add_visit, with one parameter.\")\ncheck_eq(\"add_visit(5) returns 6\", lambda: silent(f, 5)[0], 6, \"Return count + 1.\")\ncheck_eq(\"same input, same output\", lambda: [f(0), f(0)], [1, 1], \"A pure function gives the same answer every time for the same input.\")\ncheck(\"no global statement\", lambda: not has_node(\"Global\"), \"Remove global: pass the count in and return the new value.\")\ncheck_eq(\"the program still prints 2\", lambda: out.strip(), \"2\", \"Store each result: visits = add_visit(visits).\")\n", "hint": "def add_visit(count): return count + 1. Then visits = add_visit(visits), twice.", "solution": "visits = 0\n\ndef add_visit(count):\n    return count + 1\n\nvisits = add_visit(visits)\nvisits = add_visit(visits)\nprint(visits)\n"}, {"id": "fact", "title": "Recursive factorial", "kind": "write", "prompt": "Write `fact(n)` using recursion: `fact(0)` and `fact(1)` are 1, and otherwise `fact(n)` is `n * fact(n - 1)`.", "starter": "def fact(n):\n    pass\n", "tests": "f = ns.get(\"fact\")\ncheck(\"defines fact\", lambda: callable(f), \"Use def fact(n):\")\ncheck_eq(\"fact(0) is 1\", lambda: f(0), 1, \"Base case: if n <= 1, return 1.\")\ncheck_eq(\"fact(1) is 1\", lambda: f(1), 1, \"Base case: if n <= 1, return 1.\")\ncheck_eq(\"fact(5) is 120\", lambda: f(5), 120, \"5 * 4 * 3 * 2 * 1.\")\ncheck_eq(\"fact(10) is 3628800\", lambda: f(10), 3628800, \"Return n * fact(n - 1).\")\ns = spy(\"fact\")\ndef count():\n    s.reset()\n    ns[\"fact\"](5)\n    return s.calls\ncheck_eq(\"fact(5) calls itself (5 calls in all)\", count, 5, \"fact(5) should call fact(4), which calls fact(3), and so on down to fact(1). A loop makes only 1 call.\")\n", "hint": "Base case first: if n <= 1 return 1. Then return n * fact(n - 1).", "solution": "def fact(n):\n    if n <= 1:\n        return 1\n    return n * fact(n - 1)\n"}, {"id": "fib", "title": "Fibonacci with a loop", "kind": "write", "prompt": "Write `fib(n)` returning the n-th Fibonacci number, with `fib(0)` = 0, `fib(1)` = 1 and each later number the sum of the two before it. Use a loop, not recursion: the recursive version makes thousands of calls (see the `calls` demo above). In a loop that only repeats, you can name the loop variable `_`, a name meaning \"I don't need this value\".", "starter": "def fib(n):\n    pass\n", "tests": "f = ns.get(\"fib\")\ncheck(\"defines fib\", lambda: callable(f), \"Use def fib(n):\")\ncheck_eq(\"fib(0) is 0\", lambda: f(0), 0, \"With no steps, return the first value, 0.\")\ncheck_eq(\"fib(1) is 1\", lambda: f(1), 1, \"One step from 0, 1 gives 1.\")\ncheck_eq(\"fib(10) is 55\", lambda: f(10), 55, \"Keep two names a, b = 0, 1 and update both each pass: a, b = b, a + b.\")\ns = spy(\"fib\")\ndef count():\n    s.reset()\n    ns[\"fib\"](20)\n    return s.calls\ncheck_eq(\"fib(20) makes only one call\", count, 1, \"Your fib(20) calls itself (the number above is how many calls). Use a loop that updates two names instead.\")\nns[\"fib\"] = s.orig\ncheck_eq(\"fib(30) is 832040\", lambda: f(30), 832040, \"Repeat the update n times with for _ in range(n).\")\n", "hint": "Keep a and b = 0, 1. Repeat n times: a, b = b, a + b. Return a.", "solution": "def fib(n):\n    a, b = 0, 1\n    for _ in range(n):\n        a, b = b, a + b\n    return a\n"}], "predict": [{"code": "def shout(word):\n    word = word + \"!\"\n\nw = \"hi\"\nshout(w)\nprint(w)", "why": "`shout` points its own local `word` at new text. The caller's `w` still names \"hi\", and the function returned nothing anyway.", "id": "p0", "traps": {"hi!": "Assigning to the parameter changes only the function's local name; the caller's w is untouched."}, "ans": "hi"}, {"code": "def g(x):\n    print(x * 2)\n\nr = g(4)\nprint(r)", "why": "Calling `g` prints 8. It has no return, so `r` is `None`, which prints as None.", "id": "p1", "traps": {"8\n8": "g prints its answer but has no return, so the caller gets None.", "8": "The second print runs too: it shows r, which is None."}, "ans": "8\nNone"}, {"code": "level = 3\n\ndef peek():\n    return level * 2\n\ndef reset():\n    level = 0\n    return level\n\nprint(peek(), reset(), peek())", "why": "`peek` reads the global `level`. `reset` assigns, so its `level` is a new local name; the global stays 3, and the second `peek` still gives 6.", "id": "p2", "traps": {"6 0 0": "reset assigned to a local level. The global level is still 3."}, "ans": "6 0 6"}, {"code": "def f(a, b=2, c=3):\n    return a + 10 * b + 100 * c\n\nprint(f(1), f(1, c=0), f(1, 0))", "why": "Defaults give 1 + 20 + 300 = 321. The keyword sets only c: 21. A second positional argument fills the second parameter, b: 1 + 0 + 300 = 301.", "id": "p3", "traps": {"321 21 21": "A second positional argument fills b, the second parameter. Only a keyword can skip to c."}, "ans": "321 21 301"}, {"code": "def count_down(n):\n    if n == 0:\n        return \"liftoff\"\n    return count_down(n - 1)\n\nprint(count_down(3))", "why": "Each call returns the result of the next smaller call until n reaches 0 and the base case returns the text, which is passed back up unchanged.", "id": "p4", "traps": {"None": "Every level returns what the smaller call returned, so the text travels all the way back up."}, "ans": "liftoff"}, {"code": "count = 0\n\ndef bump():\n    count = count + 1\n\nprint(\"defined\", count)", "why": "`def` only defines `bump`; its body never runs because `bump` is never called. Calling it would raise UnboundLocalError (count is local because it is assigned), but the program only prints the global count.", "id": "p-unbound", "traps": {"UnboundLocalError": "The error would come only when bump() is called. Defining a function runs nothing inside it.", "defined 1": "bump is never called, so nothing adds 1."}, "ans": "defined 0"}, {"code": "def add_dose(doses):\n    doses.append(5)\n\nmine = [10]\nadd_dose(mine)\nprint(mine)", "why": "`doses` and `mine` are two names for the same list. `append` changes that list, so the caller sees the 5.", "id": "p-list-append", "traps": {"[10]": "No assignment happens here: append changes the one list both names point at."}, "ans": "[10, 5]"}, {"code": "def add_dose(doses):\n    doses = doses + [5]\n\nmine = [10]\nadd_dose(mine)\nprint(mine)", "why": "`doses + [5]` builds a new list, and the assignment points only the local name at it. The caller's list is unchanged.", "id": "p-list-rebind", "traps": {"[10, 5]": "`+` makes a new list and `=` re-points the local name; the caller's list was never changed."}, "ans": "[10]"}, {"code": "def f(n):\n    if n == 0:\n        return\n    print(n)\n    f(n - 1)\n    print(n)\n\nf(2)", "why": "f(2) prints 2, then f(1) prints 1, then f(0) returns at once. Back in f(1) the second print shows 1; back in f(2) it shows 2. Calls finish in reverse order.", "id": "p-trace", "traps": {"2\n1\n2\n1": "The second print in each call waits until the smaller call has finished, so the innermost call finishes first.", "2\n1": "After each smaller call returns, the caller carries on and runs its second print."}, "ans": "2\n1\n1\n2"}], "cards": [{"f": "What does `return` do?", "b": "Ends the function at once and hands a value back to the caller.", "id": "c0"}, {"f": "`print` versus `return`?", "b": "`print` shows text to a person. `return` gives a value to the program so it can be stored and reused.", "id": "c1"}, {"f": "Parameter versus argument?", "b": "A parameter is the name in the `def` line. An argument is the value you pass when you call it.", "id": "c2"}, {"f": "With `def power(b, e=2): return b ** e`, what is `power(3)`?", "b": "9. `e` was left out, so its default 2 is used: 3 ** 2.", "id": "c3"}, {"f": "Can a function change the caller's variable by assigning to the same name?", "b": "No. Assigning inside a function creates a new local name. The caller's variable is unchanged.", "id": "c4"}, {"f": "Inside a function, in what order does Python look up a name?", "b": "Local names first, then global names, then built-ins (the LEGB rule; E, enclosing, applies to functions defined inside functions).", "id": "c5"}, {"f": "What two parts must every recursive function have?", "b": "A base case that stops it, and a recursive case that moves toward the base case.", "id": "c6"}, {"f": "What does `assert x > 0` do?", "b": "Raises `AssertionError` if the condition is false and does nothing if it is true. A tiny test.", "id": "c7"}, {"f": "What does a function with no `return` give back?", "b": "`None`.", "id": "c8"}, {"f": "If `def add(lst): lst.append(1)` is called as `add(mine)`, does `mine` change?", "b": "Yes. `lst` and `mine` name the same list, and `append` changes that list in place.", "id": "c-list-param"}, {"f": "If `def add(lst): lst = lst + [1]` is called as `add(mine)`, does `mine` change?", "b": "No. `lst + [1]` builds a new list and only the local name `lst` is pointed at it.", "id": "c-list-rebind"}, {"f": "What is wrong? `count = 5`, then a function whose body is `print(count)` followed by `count = 0`.", "b": "Calling it raises UnboundLocalError: `count` is assigned in the function, so it is local throughout, and it has no value yet when printed.", "id": "c-unbound"}, {"f": "What does the `global` statement do, and what is usually better?", "b": "`global x` lets a function assign to the outer `x`. Better: pass the value in and return the new value.", "id": "c-global"}, {"f": "What is a pure function?", "b": "One that only uses its arguments and returns a result: same inputs, same output, no side effects.", "id": "c-pure"}, {"f": "`def f(n):` prints n, calls `f(n - 1)` while n > 0, then prints n again. What does `f(2)` print?", "b": "2, 1, 1, 2. Lines after the recursive call run as the calls return, innermost first.", "id": "c-trace"}, {"f": "What does `def f(): return 1` followed by `print(\"after\")` inside f print when you call `print(f())`?", "b": "Only `1`. `return` ends the call, so the line after it never runs.", "id": "c-early-return"}, {"f": "Why is `fib(n) = fib(n - 1) + fib(n - 2)` slow?", "b": "It recomputes the same values over and over: fib(20) makes 21,891 calls. A loop with two names makes one.", "id": "c-fib-calls"}, {"f": "What makes a string a docstring?", "b": "Being the first statement of a function's body. Python keeps it as `function_name.__doc__` and `help()` shows it.", "id": "c-docstring"}]}, {"id": "py05", "track": "py", "n": 5, "title": "Strings in depth", "minutes": 70, "summary": "Indexing, slicing (including backwards), immutability, methods, split, partition and join, str versus repr, comparing strings, aligned f-strings, and how characters are numbers.", "goals": ["Index and slice strings, including negative and stepped slices", "Explain why strings are immutable and what that means for methods", "Use split, partition and join to process text", "Read the difference between str() and repr(), and why lists show quotes", "Compare strings and shift letters using their character codes"], "blocks": [{"t": "h", "x": "Strings are sequences of characters"}, {"t": "p", "x": "A `str` is an ordered sequence of Unicode characters. `len(s)` counts them, a `for` loop visits them one at a time, and `in` tests for a substring."}, {"t": "code", "x": "word = \"Python\"\nprint(len(word))\nprint(\"th\" in word)\nprint(\"z\" in word, \"P\" in word, \"p\" in word)\nfor ch in word:\n    print(ch, end=\"-\")\nprint()"}, {"t": "note", "k": "deep", "x": "`in` is case-sensitive (`\"p\" in \"Python\"` is False). And `\"\" in s` is True for every string, even `\"\"` itself: the empty string fits between any two characters. So a check like `if part in text:` passes when `part` is accidentally empty."}, {"t": "h", "x": "Indexing and slicing"}, {"t": "p", "x": "Each character has a position called an **index**, starting at 0. Negative indexes count from the end, so `-1` is the last character. A slice `s[start:stop]` takes the characters from `start` up to but **not including** `stop`. Leave out either end to go to the edge, and add a third number for the step."}, {"t": "code", "x": "s = \"Python\"\nprint(s[0], s[1], s[-1], s[-2])\nprint(s[0:2])\nprint(s[2:])\nprint(s[:4])\nprint(s[::2])\nprint(s[::-1])"}, {"t": "note", "k": "model", "x": "Picture the indexes as cuts *between* the characters: `|P|y|t|h|o|n|` has cuts numbered 0 to 6. A slice `s[a:b]` takes whatever lies between cut `a` and cut `b`. That is why `s[:k] + s[k:]` always rebuilds the whole string. When `0 <= a <= b <= len(s)`, `len(s[a:b])` is `b - a`. Otherwise Python first cuts `a` and `b` down to fit the string, and a slice whose start lies after its stop is simply empty."}, {"t": "note", "k": "trap", "x": "Indexing past the end raises `IndexError` (`s[6]` on a 6-character string), but slicing never raises `IndexError`: `s[2:100]` quietly stops at the end, and `s[10:]` is the empty string. Indexes are strict; slices are forgiving. (The one slice that is an error: a step of 0, as in `s[::0]`, raises `ValueError`.)"}, {"t": "code", "x": "s = \"Python\"\nprint(s[2:100])\nprint(len(s[10:]), len(s[4:2]), len(s[-100:2]))"}, {"t": "p", "x": "**Stepping backwards.** With a negative step the slice walks from right to left: it starts **at** index `start` (included) and stops just **before** index `stop`. Leave both out and you get the whole string reversed. If `start` is already left of `stop`, there is nothing to walk and the slice is empty."}, {"t": "code", "x": "s = \"Python\"\nprint(s[4:1:-1])\nprint(s[-1:-4:-1])\nprint(s[::-2])\nprint(len(s[1:4:-1]))"}, {"t": "h", "x": "Strings cannot be changed"}, {"t": "p", "x": "Strings are **immutable**: you cannot change a character in place. Every apparent modification builds a new string."}, {"t": "code", "x": "word = \"cat\"\nword = \"b\" + word[1:]\nprint(word)"}, {"t": "p", "x": "Because of this, string methods return new strings instead of altering the original. Calling `s.upper()` on a line by itself does nothing useful."}, {"t": "code", "x": "name = \"ada\"\nname.upper()\nprint(name)\nname = name.upper()\nprint(name)"}, {"t": "h", "x": "Useful methods"}, {"t": "code", "x": "text = \"  Hello, World  \"\nprint(text.strip())\nprint(text.lower())\nprint(text.upper())\nprint(text.replace(\"World\", \"Lime\"))\nprint(\"a,b,c\".split(\",\"))\nprint(\"-\".join([\"2026\", \"11\", \"07\"]))\nprint(\"hello world\".title())\nprint(\"racecar\".startswith(\"race\"), \"racecar\".endswith(\"car\"))\nprint(\"banana\".count(\"an\"), \"banana\".find(\"n\"), \"banana\".find(\"z\"))"}, {"t": "p", "x": "`split` turns a string into a list of pieces, and `join` glues a list of strings together with a separator. This pair is the backbone of text processing. `find` returns -1 when nothing is found, while `index` raises `ValueError`."}, {"t": "note", "k": "trap", "x": "`strip`, `lstrip` and `rstrip` remove characters from the ends. Given an argument, they treat it as a **set of characters**, not a word: `\"xxhixyx\".strip(\"xy\")` is `\"hi\"`. To remove one exact piece of text from the start or the end, use `removeprefix` or `removesuffix`."}, {"t": "code", "x": "print(\"xxhixyx\".strip(\"xy\"))\nprint(\"www.calx.org\".removeprefix(\"www.\"))\nprint(\"scan_04.png\".removesuffix(\".png\"))\nprint(\"scan_04.png\".removesuffix(\".jpg\"))"}, {"t": "note", "k": "deep", "x": "Two quiet surprises. `count` counts **non-overlapping** matches from left to right, so `\"aaaa\".count(\"aa\")` is 2, not 3. And `title()` capitalises every letter that follows a non-letter, so `\"they're\".title()` is `\"They'Re\"` and `\"o'neil\"` becomes `\"O'Neil\"`. For real titles you write your own rule (one of the exercises below)."}, {"t": "h", "x": "Splitting and joining"}, {"t": "code", "x": "sentence = \"the quick brown fox\"\nwords = sentence.split()\nprint(words)\nprint(len(words))\nprint(\" \".join(words[::-1]))"}, {"t": "note", "k": "tip", "x": "`split()` with no argument splits on any run of whitespace and ignores leading and trailing spaces, so `\"  a   b \".split()` is `[\"a\", \"b\"]`. `split(\" \")` would keep the empty pieces."}, {"t": "p", "x": "**Splitting only once.** `split(sep, n)` splits at most `n` times and leaves the rest in one piece. `partition(sep)` splits at the **first** `sep` only and always gives three parts: before, the separator, after. It returns them as a tuple (the fixed group of values from lesson 4), so you can unpack it into three names. If `sep` is missing, the last two parts are empty strings. When you do not need one of the values, the name `_` is the usual way to say \"I don't need this one\". It is an ordinary name; the underscore is a convention for human readers."}, {"t": "code", "x": "line = \"note=BP=120/80\"\nprint(line.split(\"=\"))\nprint(line.split(\"=\", 1))\nkey, _, value = line.partition(\"=\")\nprint(key, value)\nprint(\"no sign here\".partition(\"=\"))"}, {"t": "note", "k": "deep", "x": "Building a long string with `result += piece` in a loop works, but because strings are immutable each `+=` makes a brand-new string and copies everything collected so far. For a few pieces that does not matter (and CPython often optimises it). For many thousands of pieces the copying grows roughly with the square of the count. The fast habit is to collect the pieces in a list and call `\"\".join(pieces)` once at the end; lesson 6 shows how to grow a list and why some list operations are cheap and others are not."}, {"t": "h", "x": "Checking what a string contains"}, {"t": "code", "x": "print(\"abc\".isalpha(), \"abc123\".isalpha(), \"abc123\".isalnum())\nprint(\"123\".isdigit(), \"12.5\".isdigit(), \"-5\".isdigit(), \"\".isdigit())\nprint(\"  \".isspace(), \"Hello\".islower(), \"hello\".islower())"}, {"t": "p", "x": "`isdigit()` asks \"is every character a digit?\", so it is not a test for \"is this a number\": `\"-5\"` and `\"12.5\"` give False although `int(\"-5\")` and `float(\"12.5\")` both work. An empty string gives False for every `is...` method."}, {"t": "note", "k": "deep", "x": "These methods understand all of Unicode: `\"é\".isalpha()` and `\"é\".islower()` are both True. That matters whenever your code quietly assumes \"letter\" means a to z, as the Caesar exercise below shows."}, {"t": "h", "x": "Escapes, quotes and raw strings"}, {"t": "p", "x": "A backslash starts an escape: `\\n` is a new line, `\\t` a tab, `\\\\` a backslash and `\\\"` a quote. Triple quotes span several lines. A **raw string**, `r\"...\"`, keeps backslashes literally, which helps with Windows paths and regular expressions."}, {"t": "code", "x": "print(\"line one\\nline two\")\nprint(\"tab\\tseparated\")\nprint(\"She said \\\"hi\\\"\")\nprint(r\"C:\\new\\table\")\nprint('''multi\nline''')"}, {"t": "h", "x": "str() and repr(): two ways to show a value"}, {"t": "p", "x": "Every value has two text forms. `str(x)` is the friendly form, and it is what `print` shows. `repr(x)` is the precise form a programmer needs: for a string it adds quotes and spells out escapes such as `\\n`, so you can see exactly what is there, spaces included. When Python shows a **list**, it shows each item with `repr`. That is why strings inside a printed list have quotes and numbers do not. Python picks single quotes unless the text itself contains a single quote."}, {"t": "code", "x": "s = \" spaced \\n\"\nprint(\"[\" + s + \"]\")\nprint(repr(s))\nprint(repr(\"it's\"), repr(42))\nprint([\"a\", \"b c\", 5, \"5\"])"}, {"t": "note", "k": "tip", "x": "When a value prints strangely, print its `repr`: stray spaces, a hidden new line or a number stored as text show up at once. Inside an f-string, `{x!r}` gives the repr."}, {"t": "h", "x": "Characters are numbers"}, {"t": "p", "x": "Every character has a numeric code. `ord(ch)` gives the code and `chr(n)` turns a code back into a character. Letters are consecutive, so `ord(\"b\") - ord(\"a\")` is 1. That is the key to shifting letters, as in a Caesar cipher."}, {"t": "code", "x": "print(ord(\"A\"), ord(\"a\"), ord(\"0\"))\nprint(chr(72), chr(105))\nprint(chr(ord(\"a\") + 3))\nprint((ord(\"y\") - ord(\"a\") + 3) % 26)"}, {"t": "p", "x": "The `%` operator wraps values around: shifting `y` by 3 should land on `b`, not on a symbol after `z`. Position 24 plus 3 is 27, and `27 % 26` is 1, the position of `b`."}, {"t": "note", "k": "tip", "x": "Python strings are Unicode, so `ord(\"é\")` and `ord(\"日\")` work too. Behind the scenes, text is stored as bytes using an *encoding*, usually UTF-8. Characters and bytes are different things, and you will meet that boundary again when reading files."}, {"t": "h", "x": "Comparing strings"}, {"t": "p", "x": "`<`, `>` and `==` compare strings **character by character from the left, by character code**. The first difference decides. If one string runs out first, the shorter one is smaller. Every capital letter (codes 65 to 90) comes before every lower-case letter (97 to 122), so `\"Zebra\" < \"apple\"`. Digits are compared as characters too, so `\"10\" < \"9\"`, because `\"1\"` comes before `\"9\"`. That is why sorting words needs care (lesson 6) and why numbers stored as text sort strangely. A chained comparison such as `\"a\" <= ch <= \"z\"` is the plain way to ask \"is `ch` one of the letters a to z?\"."}, {"t": "code", "x": "print(\"apple\" < \"banana\", \"apple\" < \"apricot\")\nprint(\"Zebra\" < \"apple\", ord(\"Z\"), ord(\"a\"))\nprint(\"10\" < \"9\", 10 < 9)\nprint(\"app\" < \"apple\")\nch = \"q\"\nprint(\"a\" <= ch <= \"z\", \"a\" <= \"Q\" <= \"z\")"}, {"t": "h", "x": "Lining up columns with f-strings"}, {"t": "p", "x": "Lesson 2 showed `:>10`. After the colon you can combine an alignment, a width and a precision, as in `{price:>8.2f}`: `<` aligns left, `>` right and `^` centre, and the width is the **minimum** number of characters. Text aligns left by default and numbers right. Width and precision together line up a column of prices. A character before the alignment sign is used for padding."}, {"t": "code", "x": "print(f\"{'Item':<8}|{'Qty':>4}|{'Price':>8}|\")\nprint(f\"{'gauze':<8}|{12:>4}|{3.5:>8.2f}|\")\nprint(f\"{'saline':<8}|{3:>4}|{12.25:>8.2f}|\")\nprint(f\"{'ok':^6}|{'ok':*^6}|{'too long':<4}|\")"}], "exercises": [{"id": "palindrome", "title": "is_palindrome", "kind": "write", "prompt": "Write `is_palindrome(s)` that returns `True` when the text reads the same forwards and backwards, ignoring upper or lower case and spaces.", "starter": "def is_palindrome(s):\n    pass\n", "tests": "f = ns.get(\"is_palindrome\")\ncheck(\"defines is_palindrome\", lambda: callable(f), \"Start with def is_palindrome(s):\")\ncheck_eq('\"racecar\"', lambda: f(\"racecar\"), True, \"Return a bool: compare the text with its reverse t[::-1].\")\ncheck_eq('\"Never odd or even\"', lambda: f(\"Never odd or even\"), True, \"Remove spaces and compare in lower case.\")\ncheck_eq('\"hello\"', lambda: f(\"hello\"), False, \"A word that differs from its reverse must give False.\")\ncheck_eq('\"\"', lambda: f(\"\"), True, \"The empty string reads the same both ways.\")\ncheck_eq('\"Was it a car or a cat I saw\"', lambda: f(\"Was it a car or a cat I saw\"), True, \"Lower-case everything and drop every space, not just the first.\")\ncheck_eq('\"ab ba c\"', lambda: f(\"ab ba c\"), False, \"Compare the whole cleaned text, not just its ends.\")\n", "hint": "Clean the text with replace and lower, then compare it to its reverse `t[::-1]`.", "solution": "def is_palindrome(s):\n    t = s.replace(\" \", \"\").lower()\n    return t == t[::-1]\n"}, {"id": "initials", "title": "initials", "kind": "write", "prompt": "Write `initials(name)` that returns the capitalised initials with a full stop after each, so `\"Ada Lovelace\"` gives `\"A.L.\"`.", "starter": "def initials(name):\n    pass\n", "tests": "f = ns.get(\"initials\")\ncheck(\"defines initials\", lambda: callable(f), \"Start with def initials(name):\")\ncheck_eq('\"Ada Lovelace\"', lambda: f(\"Ada Lovelace\"), \"A.L.\", \"One capital letter and a full stop per word.\")\ncheck_eq(\"lower case input\", lambda: f(\"grace brewster murray hopper\"), \"G.B.M.H.\", \"Use word[0].upper() so lower-case names still give capitals.\")\ncheck_eq(\"one name\", lambda: f(\"plato\"), \"P.\")\ncheck_eq(\"extra spaces\", lambda: f(\"  alan   turing \"), \"A.T.\", \"split() with no argument handles extra spaces; split(\\\" \\\") keeps empty pieces.\")\n", "hint": "Loop over name.split(). Add word[0].upper() + \".\" to a result string each time.", "solution": "def initials(name):\n    result = \"\"\n    for word in name.split():\n        result += word[0].upper() + \".\"\n    return result\n"}, {"id": "vowels", "title": "count_vowels", "kind": "write", "prompt": "Write `count_vowels(s)` that counts the vowels `a e i o u` in a string, ignoring case.", "starter": "def count_vowels(s):\n    pass\n", "tests": "f = ns.get(\"count_vowels\")\ncheck(\"defines count_vowels\", lambda: callable(f), \"Start with def count_vowels(s):\")\ncheck_eq('\"Lime\"', lambda: f(\"Lime\"), 2, \"Count every vowel, one at a time, and return the number.\")\ncheck_eq('\"rhythm\"', lambda: f(\"rhythm\"), 0)\ncheck_eq('\"AEIOU\"', lambda: f(\"AEIOU\"), 5, \"Convert to lower case first.\")\ncheck_eq('\"\"', lambda: f(\"\"), 0)\ncheck_eq('\"Queueing\"', lambda: f(\"Queueing\"), 5, \"Repeated vowels each count.\")\n", "hint": "Loop over s.lower() and count the characters that are in \"aeiou\".", "solution": "def count_vowels(s):\n    count = 0\n    for ch in s.lower():\n        if ch in \"aeiou\":\n            count += 1\n    return count\n"}, {"id": "last_three", "title": "Fix the slice", "kind": "fix", "prompt": "`last_three(s)` should return the last three characters of a string, but it returns only two. Fix it. For strings shorter than three characters it should return the whole string.", "starter": "def last_three(s):\n    return s[len(s) - 2:]\n", "tests": "f = ns.get(\"last_three\")\ncheck(\"defines last_three\", lambda: callable(f))\ncheck_eq('\"abcdef\"', lambda: f(\"abcdef\"), \"def\", \"Three characters means the slice starts three before the end.\")\ncheck_eq('\"xy\"', lambda: f(\"xy\"), \"xy\", \"With len(s) - 3 the start is -1 for \\\"xy\\\", and a negative start counts from the END, so you get only \\\"y\\\". A negative start of -3 is clipped to fit instead: s[-3:].\")\ncheck_eq('\"\"', lambda: f(\"\"), \"\")\ncheck_eq('\"abc\"', lambda: f(\"abc\"), \"abc\")\ncheck_eq('\"a\"', lambda: f(\"a\"), \"a\", \"Short strings come back whole.\")\n", "hint": "Negative slices count from the end, and a slice start that is too far left is clipped to 0: `s[-3:]`.", "solution": "def last_three(s):\n    return s[-3:]\n"}, {"id": "reverse_words", "title": "reverse_words", "kind": "write", "prompt": "Write `reverse_words(sentence)` that reverses the order of the words, so `\"the quick brown fox\"` gives `\"fox brown quick the\"`. Extra spaces should be ignored.", "starter": "def reverse_words(sentence):\n    pass\n", "tests": "f = ns.get(\"reverse_words\")\ncheck(\"defines reverse_words\", lambda: callable(f))\ncheck_eq(\"basic sentence\", lambda: f(\"the quick brown fox\"), \"fox brown quick the\", \"Reverse the list of words, not the characters.\")\ncheck_eq(\"single word\", lambda: f(\"lime\"), \"lime\", \"One word stays as it is (reversing the string would give \\\"emil\\\").\")\ncheck_eq(\"extra spaces\", lambda: f(\"  a   b \"), \"b a\", \"split() with no argument drops the extra spaces.\")\n", "hint": "split() gives a list of words, a slice [::-1] reverses a list, and \" \".join glues it back.", "solution": "def reverse_words(sentence):\n    return \" \".join(sentence.split()[::-1])\n"}, {"id": "caesar", "title": "Caesar cipher", "kind": "write", "prompt": "Write `caesar(text, shift)` that moves every letter from `a` to `z` and from `A` to `Z` `shift` places along the alphabet, wrapping around from `z` to `a`. Keep upper and lower case. Everything else stays unchanged, including accented letters such as `é` (they are letters, but not in this 26-letter alphabet). A negative shift must undo a positive one.", "starter": "def caesar(text, shift):\n    pass\n", "tests": "f = ns.get(\"caesar\")\ncheck(\"defines caesar\", lambda: callable(f))\ncheck_eq('caesar(\"abc\", 1)', lambda: f(\"abc\", 1), \"bcd\", \"Shift each letter's position: ord(ch) - ord(\\\"a\\\") + shift.\")\ncheck_eq(\"wraps around\", lambda: f(\"xyz\", 3), \"abc\", \"Use % 26 so positions past z wrap back to a.\")\ncheck_eq(\"keeps case and punctuation\", lambda: f(\"Hello, World!\", 5), \"Mjqqt, Btwqi!\", \"Capitals need ord(\\\"A\\\") as the base; anything else is copied unchanged.\")\ncheck_eq(\"negative shift decodes\", lambda: f(\"Mjqqt, Btwqi!\", -5), \"Hello, World!\")\ncheck_eq(\"shift of 26 changes nothing\", lambda: f(\"Lime\", 26), \"Lime\")\ncheck_eq('accented letters stay: caesar(\"café\", 1)', lambda: f(\"café\", 1), \"dbgé\", \"islower() is True for é too. Test the range instead: \\\"a\\\" <= ch <= \\\"z\\\".\")\ncheck_eq('caesar(\"Ærø Zß\", 2)', lambda: f(\"Ærø Zß\", 2), \"Ætø Bß\", \"Only a to z and A to Z move. isupper() and isalpha() accept Æ and ß.\")\n", "hint": "For each character: if \"a\" <= ch <= \"z\", find its position with ord(ch) - ord(\"a\"), add shift, use % 26, then convert back with chr. Do the same with \"A\" for capitals. Copy anything else unchanged.", "solution": "def caesar(text, shift):\n    result = \"\"\n    for ch in text:\n        if \"a\" <= ch <= \"z\":\n            result += chr((ord(ch) - ord(\"a\") + shift) % 26 + ord(\"a\"))\n        elif \"A\" <= ch <= \"Z\":\n            result += chr((ord(ch) - ord(\"A\") + shift) % 26 + ord(\"A\"))\n        else:\n            result += ch\n    return result\n"}, {"id": "title_case", "title": "title_case", "kind": "write", "prompt": "`\"they're back\".title()` gives `\"They'Re Back\"`. Write `title_case(s)` that does it properly: split the text into words on spaces, make the first character of each word upper case and the rest lower case, and join the words with single spaces. Do not use `title()`.\n\n- `title_case(\"they're BACK\")` is `\"They're Back\"`", "starter": "def title_case(s):\n    return s.title()\n", "tests": "f = ns.get(\"title_case\")\ncheck(\"defines title_case\", lambda: callable(f))\ncheck_eq('\"they\\'re BACK\"', lambda: f(\"they're BACK\"), \"They're Back\", \"title() capitalises after every non-letter, including the apostrophe. Handle each word yourself: word[0].upper() + word[1:].lower().\")\ncheck_eq('\"x-ray of o\\'neil\"', lambda: f(\"x-ray of o'neil\"), \"X-ray Of O'neil\", \"Only the first character of each space-separated word is capitalised.\")\ncheck_eq(\"extra spaces\", lambda: f(\"  dr   who \"), \"Dr Who\", \"split() with no argument drops extra spaces; join with one space.\")\ncheck_eq(\"one shouted word\", lambda: f(\"ADA\"), \"Ada\", \"The rest of each word must be lower case: word[1:].lower().\")\ncheck(\"does not call title()\", lambda: not uses_call(\"title\"), \"Build each word yourself instead of calling title().\")\n", "hint": "Loop over s.split(). For each word build word[0].upper() + word[1:].lower(), add it and a space to a result string, and strip the last space at the end (or collect the words and \" \".join them).", "solution": "def title_case(s):\n    result = \"\"\n    for word in s.split():\n        result += word[0].upper() + word[1:].lower() + \" \"\n    return result.strip()\n"}, {"id": "parse_pair", "title": "parse_pair", "kind": "write", "prompt": "Settings arrive as text like `\"dose = 5 mg\"`. Write `parse_pair(text)` that returns two values, the key and the value, split at the **first** `=` only and with spaces stripped from both. If there is no `=`, the value is `\"\"`.\n\n- `parse_pair(\"dose = 5 mg\")` returns `(\"dose\", \"5 mg\")`\n- `parse_pair(\"a=b=c\")` returns `(\"a\", \"b=c\")`", "starter": "def parse_pair(text):\n    key, value = text.split(\"=\")\n    return key, value\n", "tests": "f = ns.get(\"parse_pair\")\ncheck(\"defines parse_pair\", lambda: callable(f))\ncheck_eq('\"dose = 5 mg\"', lambda: f(\"dose = 5 mg\"), (\"dose\", \"5 mg\"), \"Strip the spaces from both parts with strip().\")\ncheck_eq('\"a=b=c\"', lambda: f(\"a=b=c\"), (\"a\", \"b=c\"), \"Split at the first = only: split(\\\"=\\\", 1) or partition(\\\"=\\\").\")\ncheck_eq(\"no = sign\", lambda: f(\"  flag \"), (\"flag\", \"\"), \"With no = there is nothing to split. partition gives an empty value for free.\")\ncheck_eq(\"empty key\", lambda: f(\"=x\"), (\"\", \"x\"))\ncheck_eq(\"url as value\", lambda: f(\"link = a.org/?q=1\"), (\"link\", \"a.org/?q=1\"))\n", "hint": "`key, _, value = text.partition(\"=\")` always gives three parts, even when there is no `=`. Then return key.strip(), value.strip().", "solution": "def parse_pair(text):\n    key, _, value = text.partition(\"=\")\n    return key.strip(), value.strip()\n"}], "predict": [{"code": "w = \"stethoscope\"\nprint(w[:5], w[-5:], w[::3])", "why": "`[:5]` is positions 0 to 4 (the stop is excluded): steth. `[-5:]` is the last five: scope. `[::3]` takes positions 0, 3, 6 and 9: s, t, s, p.", "id": "p0", "traps": {"stetho scope stsp": "The stop is excluded: `w[:5]` is positions 0 to 4, five characters."}, "ans": "steth scope stsp"}, {"code": "s = \"hello\"\ns.replace(\"l\", \"L\")\nprint(s)", "why": "Strings are immutable. `replace()` built a new string, `heLLo`, and nothing kept it, so `s` is unchanged.", "id": "p1", "traps": {"heLLo": "`replace` returns a new string; it cannot change `s`. Keep the result: `s = s.replace(...)`.", "heLlo": "`replace` replaces every match, but here its result was thrown away anyway."}, "ans": "hello"}, {"code": "parts = \" a  b\".split(\" \")\nprint(parts, \"|\".join(parts))", "why": "With an explicit separator, `split` cuts at every single space, so the leading space and the double space leave empty strings. A list shows its strings with quotes. `join` puts `|` only between pieces, so the empty pieces show as `||`.", "id": "p2", "traps": {"['a', 'b'] a|b": "Only `split()` with no argument drops empty pieces. `split(\" \")` cuts at every single space and keeps the empty strings between them.", "[a, b] a|b": "A list shows each item with repr(), so strings keep their quotes, and `split(\" \")` keeps empty pieces."}, "ans": "['', 'a', '', 'b'] |a||b"}, {"code": "print(\"nanana\".count(\"nana\"), \"nanana\".find(\"an\"), \"nanana\".find(\"x\"))", "why": "`count` counts non-overlapping matches: after `nana` at 0, only `na` is left, so 1. The first `an` starts at index 1. `find` returns -1 when there is no match.", "id": "p3", "traps": {"2 1 -1": "`count` does not count overlapping matches. Once `nana` is used up at 0, the remaining `na` cannot match.", "1 1 None": "`find` returns -1 for no match (and `index` would raise ValueError)."}, "ans": "1 1 -1"}, {"code": "w = \"tram\"\nprint(w[1:99] + w[9:] + \"!\", len(w[3:1]))", "why": "Slices are forgiving: `[1:99]` stops at the end (ram), `[9:]` is empty, and a slice whose start is after its stop is empty, so its length is 0, not -2.", "id": "p4", "traps": {"ram! -2": "`len(s[a:b])` is `b - a` only when a <= b; a slice with its start after its stop is empty."}, "ans": "ram! 0"}, {"code": "print(chr(ord(\"A\") + 32), ord(\"z\") - ord(\"a\"))", "why": "Every lower-case letter is exactly 32 codes after its capital (A is 65, a is 97). z is 25 places after a, because a is place 0.", "id": "p5", "traps": {"a 26": "a is place 0, so z is place 25: the difference between their codes is 25."}, "ans": "a 25"}, {"code": "print(\"python\"[4:1:-1], len(\"python\"[1:4:-1]))", "why": "A negative step walks right to left, starting AT index 4 (o) and stopping just before index 1: o, h, t. `[1:4:-1]` would have to walk left from 1 to reach 4, so it is empty.", "id": "p-neg-step", "traps": {"hty 0": "With a negative step the start (4, `o`) is included and the stop (1, `y`) is excluded.", "oht 3": "Walking left from 1 never reaches 4, so `[1:4:-1]` is empty: length 0."}, "ans": "oht 0"}, {"code": "print(\"Zebra\" < \"apple\", \"10\" < \"9\", \"app\" < \"apple\")", "why": "Strings compare by character code from the left. `Z` (90) is smaller than `a` (97). `\"1\"` (49) is smaller than `\"9\"` (57), whatever follows. When one string runs out first, the shorter one is smaller.", "id": "p-compare", "traps": {"False False True": "Strings are not compared alphabetically or as numbers, but by character codes: every capital comes before every lower-case letter, and `\"1\" < \"9\"`.", "False True True": "Capital letters have smaller codes than lower-case ones: `Z` is 90, `a` is 97."}, "ans": "True True True"}, {"code": "word = \"hi\"\nprint(word, repr(word), [word, \"5\", 5])", "why": "`print` shows the str() form: hi. `repr` adds the quotes. A list shows every item with repr, so its strings get quotes and the number does not.", "id": "p-repr", "traps": {"hi hi [hi, 5, 5]": "`repr` adds quotes, and a list always shows its items with repr: `['hi', '5', 5]`.", "hi 'hi' ['hi', '5', '5']": "Only strings get quotes; the number 5 is shown as 5."}, "ans": "hi 'hi' ['hi', '5', 5]"}, {"code": "print(\"www.lime.com\".strip(\"w.com\"))", "why": "The argument of `strip` is a set of characters: Python removes w, ., c, o and m from both ends until it meets another character. From the left that takes `www.`; from the right `.com`. Use `removeprefix`/`removesuffix` for exact text.", "id": "p-strip", "traps": {"www.lime.com": "`strip` does not look for the word `w.com`; it removes any of the characters w . c o m from both ends.", "www.lime": "`strip` works on both ends, and treats `w.com` as a set of characters, not as text to find."}, "ans": "lime"}, {"code": "print(f\"[{'ab':>4}][{'ab':<4}][{7:03d}]\")", "why": "`>4` pushes the text to the right of a 4-character field, `<4` to the left. `03d` pads a whole number with zeros to width 3.", "id": "p-fwidth", "traps": {"[ab  ][  ab][007]": "The arrow points to the side the text moves to: `>` right-aligns, `<` left-aligns.", "[  ab][ab  ][7]": "`03d` pads with zeros to a width of 3: 007."}, "ans": "[  ab][ab  ][007]"}], "cards": [{"f": "What index does the first character of a string have?", "b": "0. The last character is at `-1`.", "id": "c0"}, {"f": "Does the slice `s[2:5]` include index 5?", "b": "No. The stop is excluded, so it has `5 - 2` = 3 characters (if the string is at least 5 long).", "id": "c1"}, {"f": "How do you reverse a string?", "b": "`s[::-1]`. A step of -1 walks backwards.", "id": "c2"}, {"f": "`s = \"abc\"`: what do `s[5]` and `s[1:50]` do?", "b": "`s[5]` raises `IndexError`. `s[1:50]` gives `'bc'`: slices stop at the end and never raise IndexError (only a step of 0 is an error).", "id": "c3"}, {"f": "What does 'strings are immutable' mean?", "b": "You cannot change a string in place. Methods like `upper()` return a new string, so keep the result.", "id": "c4"}, {"f": "What does `\"a,b,,c\".split(\",\")` give?", "b": "`['a', 'b', '', 'c']`. With an explicit separator, empty pieces are kept.", "id": "c5"}, {"f": "What does `\"-\".join([\"2026\", \"11\", \"07\"])` give?", "b": "`'2026-11-07'`: the separator goes between items, not after the last.", "id": "c-join"}, {"f": "`\"abc\".find(\"z\")` versus `\"abc\".index(\"z\")`?", "b": "`find` returns -1. `index` raises `ValueError`.", "id": "c6"}, {"f": "What is a raw string and when do you use it?", "b": "`r\"...\"` keeps backslashes literally. Useful for Windows paths and regular expressions.", "id": "c7"}, {"f": "What do `ord` and `chr` do?", "b": "`ord(ch)` gives the numeric code of a character. `chr(n)` gives the character for a code.", "id": "c8"}, {"f": "In a Caesar shift, `chr((ord(ch) - ord(\"a\") + shift) % 26 + ord(\"a\"))`: why `% 26`?", "b": "There are 26 letters. `% 26` wraps a position past `z` (25) back to the start, so `y` + 3 gives position 1, `b`, instead of a symbol after `z`.", "id": "c-why-mod26"}, {"f": "What does `print([\"a\", 1])` show, and why the quotes?", "b": "`['a', 1]`. A list shows each item with `repr()`, which puts quotes round strings.", "id": "c-repr"}, {"f": "`\"Zebra\" < \"apple\"` and `\"10\" < \"9\"`: True or False?", "b": "Both True. Strings compare character codes from the left; capitals (65-90) come before lower case (97-122), and `\"1\"` comes before `\"9\"`.", "id": "c-compare"}, {"f": "What is `\"python\"[4:1:-1]`?", "b": "`'oht'`. A negative step starts at index 4 (included) and stops before index 1.", "id": "c-neg-step"}, {"f": "What is wrong with `\"www.lime.com\".strip(\"www.\")` to remove the prefix?", "b": "`strip` treats its argument as a set of characters to peel from both ends, not as text. Use `removeprefix(\"www.\")`.", "id": "c-strip"}, {"f": "What is `\"aaaa\".count(\"aa\")`?", "b": "2. `count` counts non-overlapping matches.", "id": "c-count"}, {"f": "What is `\"a=b=c\".split(\"=\", 1)`?", "b": "`['a', 'b=c']`: at most one split. `partition(\"=\")` would give `('a', '=', 'b=c')`.", "id": "c-split-max"}, {"f": "What does `f\"{'ab':>5}|\"` give?", "b": "`'   ab|'`: right-aligned in a field 5 characters wide.", "id": "c-fwidth"}, {"f": "Why prefer `\"\".join(pieces)` over `result += piece` in a long loop?", "b": "Strings are immutable, so each `+=` copies everything built so far; `join` builds the result once.", "id": "c-join-loop"}]}, {"id": "py06", "track": "py", "n": 6, "title": "Lists and tuples", "minutes": 80, "summary": "Mutable sequences, sorting with keys and lambdas, how tuples compare, aliasing and copying (including through functions and +=), comprehensions, safe looping, tuples, unpacking, enumerate and zip, and the costs of list operations.", "goals": ["Create, index, slice and change lists", "Sort with key functions, lambdas and tuple keys, and use stability", "Explain aliasing: why b = a, a parameter and a += [x] do not copy a list", "Write list comprehensions with a condition, and avoid changing a list while looping over it", "Use tuples, unpacking, enumerate and zip", "Avoid the mutable default argument trap"], "blocks": [{"t": "h", "x": "A list is an ordered, changeable collection"}, {"t": "code", "x": "nums = [10, 20, 30, 40]\nprint(nums)\nprint(len(nums), nums[0], nums[-1])\nprint(nums[1:3])\nnums[0] = 99\nprint(nums)"}, {"t": "p", "x": "Lists are written with square brackets and can hold any values, even mixed types. Indexing and slicing work exactly as they do for strings, with one big difference: lists are **mutable**, so you can assign to a position."}, {"t": "h", "x": "Changing lists"}, {"t": "code", "x": "items = [\"a\", \"b\"]\nitems.append(\"c\")\nitems.extend([\"d\", \"e\"])\nitems.insert(0, \"start\")\nprint(items)\nlast = items.pop()\nprint(last, items)\nitems.remove(\"b\")\nprint(items)\nprint(\"c\" in items, items.index(\"c\"))\ndel items[0]\nprint(items)"}, {"t": "p", "x": "- `append(x)` adds one item at the end\n- `extend(other)` adds every item of another sequence\n- `insert(i, x)` puts an item at position `i`\n- `pop()` removes and returns the last item, or the item at an index you give\n- `remove(x)` removes the first item equal to `x`\n- `del items[i]` removes the item at position `i`\n\n`remove(x)` and `index(x)` raise `ValueError` when `x` is not in the list, so test `if x in items:` first when it might be missing."}, {"t": "note", "k": "deep", "x": "**Slice assignment** replaces a whole stretch of a list in place: `a[1:3] = []` deletes positions 1 and 2, `a[0:1] = [\"x\", \"y\"]` replaces one item with two, and `a[:] = new_items` swaps the entire contents of the *same* list object, so every other name for that list sees the new contents."}, {"t": "h", "x": "Sorting"}, {"t": "code", "x": "nums = [3, 1, 2]\nprint(sorted(nums), nums)\nresult = nums.sort()\nprint(result, nums)\nwords = [\"banana\", \"apple\", \"Cherry\"]\nprint(sorted(words))\nprint(sorted(words, key=str.lower))\nprint(sorted(words, key=len, reverse=True))"}, {"t": "note", "k": "trap", "x": "`list.sort()` sorts **in place** and returns `None`. Writing `nums = nums.sort()` destroys your list. Use `sorted(nums)` when you want a new sorted list and the original left alone."}, {"t": "p", "x": "Plain `sorted(words)` puts `\"Cherry\"` first because strings compare by character code and capitals come before lower case (lesson 5). The `key` argument fixes that: it is a function applied to each item to decide its order, which is why functions being values (lesson 4) matters. `key=str.lower` sorts by the lower-case form while keeping the original words.\n\nSorting is **stable**: items with equal keys keep their original relative order. Look at the last line above: `banana` and `Cherry` both have length 6, and `banana` stays first because it came first, even with `reverse=True`."}, {"t": "p", "x": "Often the key is a tiny function you need only once. A **lambda** writes it inline: `lambda w: w[-1]` is a function that takes `w` and returns `w[-1]`. It is the same as a `def` whose body is a single `return`, just without a name. The two sorts below are identical; notice that `tea` stays before `soda` (both end in `a`) because the sort is stable."}, {"t": "code", "x": "drinks = [\"tea\", \"milk\", \"juice\", \"soda\"]\n\ndef last_letter(w):\n    return w[-1]\n\nprint(sorted(drinks, key=last_letter))\nprint(sorted(drinks, key=lambda w: w[-1]))"}, {"t": "p", "x": "**How tuples and lists compare.** Like strings, they compare item by item from the left, and the first difference decides: `(1, \"z\") < (2, \"a\")` because 1 < 2, and the second items are never looked at. Only on a tie does Python move on to the next item. That makes a tuple the natural key for \"sort by this, then by that\". A key can also look things up in another list, which lets you sort *positions* instead of values."}, {"t": "code", "x": "print((1, \"z\") < (2, \"a\"), (2, \"a\") < (2, \"b\"), (2, 5) < (2, 5, 0))\nrota = [(\"Ward B\", \"Noor\"), (\"Ward A\", \"Sam\"), (\"Ward B\", \"Ali\")]\nprint(sorted(rota))\nwords = [\"fig\", \"kiwi\", \"date\", \"yam\"]\nprint(sorted(words, key=lambda w: (-len(w), w)))\ntemps = [37.2, 39.1, 36.8]\nprint(sorted(range(len(temps)), key=lambda i: temps[i]))"}, {"t": "p", "x": "The key `(-len(w), w)` means \"longest first, then alphabetical\". The last line sorts the positions 0, 1, 2 by the temperature at each position, giving the order coolest first: position 2, then 0, then 1."}, {"t": "h", "x": "Names, aliases and copies"}, {"t": "p", "x": "This is where the label idea from lesson 2 pays off. `b = a` does not copy a list. It attaches a second name to the **same** list object."}, {"t": "code", "x": "a = [1, 2, 3]\nb = a\nb.append(4)\nprint(a)\nprint(a is b)\nc = a.copy()\nc.append(5)\nprint(a, c)\nprint(a is c, a == c)"}, {"t": "note", "k": "model", "x": "`==` asks whether two lists have equal contents. `is` asks whether they are the very same object. Changing a list through one name is visible through every other name for that object. When you need independence, copy: `a.copy()`, `a[:]` or `list(a)`."}, {"t": "p", "x": "**Through a function.** A parameter is one more name for the caller's object. Changing the object (`append`, `sort`, assigning to an index) shows up in the caller. Assigning a new value to the parameter only moves the local name, exactly as with numbers in lesson 4."}, {"t": "code", "x": "def add_dose(doses):\n    doses.append(5)\n\ndef replace_doses(doses):\n    doses = doses + [5]\n\nmine = [10]\nadd_dose(mine)\nprint(mine)\nreplace_doses(mine)\nprint(mine)"}, {"t": "p", "x": "**`+=` on a list changes it in place.** For numbers and strings, `x += y` means `x = x + y`. For a list it does not: `a += [3]` extends the existing list (like `extend`), so every alias sees it, while `a = a + [4]` builds a new
